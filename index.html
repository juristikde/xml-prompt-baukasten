<script>
(function(){
  /* ===== i18n =====
   * Texte in lang/{code}.json (ISO 639-1). TEMPLATES/Prompts werden nie übersetzt.
   * Bei UI-Änderungen immer lang/*.json mitpflegen (siehe KI-Hinweis im <head>).
   * Verfügbare Sprachen = Keys in i18nDict.languages der geladenen JSON (kein Ordner-Scan).
   * Anzeige: native Name; Suche: native + local (Name in aktueller UI-Sprache) + Code.
   */
  const LANG_BASE = 'lang/';
  let currentLang = 'de';
  let i18nDict = {};
  let languageSearchQuery = '';

  function getAvailableLanguages(){
    const map = (i18nDict && i18nDict.languages) || {};
    return Object.keys(map).map(code => {
      const entry = map[code] || {};
      return {
        code,
        native: entry.native || code,
        local: entry.local || entry.native || code
      };
    }).sort((a, b) => a.native.localeCompare(b.native, currentLang || 'de'));
  }

  function detectSystemLanguage(){
    const nav = (navigator.languages && navigator.languages[0]) || navigator.language || navigator.userLanguage || 'de';
    const code = String(nav).slice(0, 2).toLowerCase();
    return code || 'de';
  }

  /**
   * UI-Text mit deutschem Default im Quelltext; JSON überschreibt über key.
   * t('Kopieren', 'detail.copy') oder t('…{n}…', 'chars.count', {n:3})
   * Ohne JSON bleibt immer das deutsche Default — nie der Key-Platzhalter.
   */
  /*
   * Neue i18n-Keys aus dem Umbau – JSON-Sync bewusst später.
   * t() nutzt de-Default; wenn JSON fehlt, bleibt DE. Beim finalen JSON-Update
   * alle Keys aus I18N_PENDING in lang/*.json übernehmen.
   */
  const I18N_PENDING = {
    'drafts.persist': {
      de: 'Entwürfe im lokalen Browser-Speicher sichern',
      en: 'Save drafts in local browser storage'
    },
    'drafts.clear': {
      de: 'Gespeicherte Entwürfe löschen',
      en: 'Clear saved drafts'
    },
    'drafts.cleared': {
      de: '✓ Gelöscht',
      en: '✓ Cleared'
    },
    'drafts.clearEmpty': {
      de: 'Nichts gespeichert',
      en: 'Nothing saved'
    },
    'confirm.cancel': { de: 'Abbrechen', en: 'Cancel' },
    'confirm.ok': { de: 'Bestätigen', en: 'Confirm' },
    'focusEditor.back': { de: 'Zurück', en: 'Back' },
    'focusEditor.undo': { de: 'Rückgängig', en: 'Undo' },
    'focusEditor.redo': { de: 'Wiederholen', en: 'Redo' },
    'focusEditor.find': { de: 'Suchen', en: 'Find' },
    'focusEditor.editText': { de: 'Text bearbeiten', en: 'Edit text' },
    'outline.structUndo': { de: 'Struktur rückgängig', en: 'Undo structure' },
    'outline.structUndoTitle': { de: 'Strukturänderung rückgängig', en: 'Undo structure change' },
    'outline.structRedo': { de: 'Struktur wiederholen', en: 'Redo structure' },
    'outline.structRedoTitle': { de: 'Strukturänderung wiederherstellen', en: 'Redo structure change' },
    'outline.copyFailed': { de: '✗', en: '✗' },
    'outline.copyFailedFull': { de: '✗ Kopieren fehlgeschlagen', en: '✗ Copy failed' },
    'warnings.resetSettings': { de: 'Auf Standardwerte zurücksetzen', en: 'Reset to defaults' },
    'warnings.confirmResetSettings': { de: 'Alle Einstellungen zurücksetzen?', en: 'Reset all settings?' },
    'settings.title': { de: 'Einstellungen', en: 'Settings' },
    'settings.close': { de: 'Einstellungen schließen', en: 'Close settings' },
    'settings.sectionWarnings': { de: 'Warnungen', en: 'Warnings' },
    'settings.sectionDisplay': { de: 'Darstellung', en: 'Display' },
    'settings.sectionTabBar': { de: 'Tab-Leiste', en: 'Tab Bar' },
    'settings.sectionAdvanced': { de: 'Erweitert', en: 'Advanced' },
    'settings.sectionDrafts': { de: 'Entwürfe', en: 'Drafts' },
    'settings.showCharacterCount': { de: 'Gesamtzeichenanzahl anzeigen', en: 'Show total character count' },
    'settings.xmlCodeLineWrap': { de: 'XML-Zeilenumbruch', en: 'XML line wrap' },
    'settings.tabBarShown': { de: 'Tab-Leiste anzeigen', en: 'Show tab bar' },
    'settings.tabBarLocation': { de: 'Position', en: 'Position' },
    'settings.tabBarTop': { de: 'Oben', en: 'Top' },
    'settings.tabBarLeft': { de: 'Links', en: 'Left' },
    'settings.protocolThreshold': { de: 'Protokoll-Schwellwert', en: 'Protocol threshold' },
    'settings.warnPastingTextThreshold': { de: 'Paste-Warn-Schwellwert', en: 'Paste warn threshold' },
    'settings.displayedAmountbuttonC': { de: 'Custom-Buttons Anzahl', en: 'Custom button count' },
    'focusEditor.options': { de: 'Optionen', en: 'Options' },
    'detail.wrapOn': { de: 'Umbruch an', en: 'Wrap on' },
    'detail.wrapOff': { de: 'Umbruch aus', en: 'Wrap off' },
    'detail.wrapTitle': { de: 'Zeilenumbruch umschalten', en: 'Toggle line wrap' },
    'settings.detailLineWrap': { de: 'Text-Zeilenumbruch', en: 'Text line wrap' },
    'detail.wikiSettingsShort': { de: 'Wiki-Einstellungen', en: 'Wiki settings' },
    'outline.filterPlaceholder': { de: 'Filtern…', en: 'Filter…' },
    'outline.filterAria': { de: 'Struktur filtern', en: 'Filter structure' },
    'outline.filterClear': { de: 'Filter löschen', en: 'Clear filter' },
    'outline.collapseLevel': { de: 'Ebenen einklappen', en: 'Collapse levels' },
    'outline.collapseLevelTitle': { de: 'Ebenen einklappen', en: 'Collapse levels' },
    'outline.collapseAll': { de: 'Alle einklappen', en: 'Collapse all' },
    'outline.expandAll': { de: 'Alle ausklappen', en: 'Expand all' },
    'protocol.jumpTitle': { de: 'Zum Eintrag springen', en: 'Jump to entry' },
    'settings.performanceMode': { de: 'Performance-Modus', en: 'Performance mode' },
    'settings.performanceAuto': { de: 'Automatisch', en: 'Automatic' },
    'settings.performanceOn': { de: 'Immer aktiv', en: 'Always on' },
    'settings.performanceOff': { de: 'Deaktiviert', en: 'Disabled' },
    'diff.added': { de: 'Hinzugefügt: {items}', en: 'Added: {items}' },
    'diff.removed': { de: 'Entfernt: {items}', en: 'Removed: {items}' },
    'diff.renamed': { de: 'Umbenannt: {items}', en: 'Renamed: {items}' },
    'diff.textChanged': { de: 'Text geändert: {items}', en: 'Text changed: {items}' },
    'diff.noChange': { de: 'Keine Strukturänderung', en: 'No structural change' }
  };

  function t(de, key, vars){
    if(typeof key === 'object' && key !== null && vars === undefined){
      /* Absicherung falls doch t(key, vars) */
      vars = key; key = de; de = null;
    }
    let cur = i18nDict;
    if(typeof key === 'string' && key){
      const parts = key.split('.');
      for(let i = 0; i < parts.length; i++){
        if(cur == null || typeof cur !== 'object'){ cur = undefined; break; }
        cur = cur[parts[i]];
      }
    } else {
      cur = undefined;
    }
    let s = (typeof cur === 'string') ? cur : null;
    if(s == null && typeof key === 'string' && I18N_PENDING[key]){
      const pack = I18N_PENDING[key];
      s = (currentLang === 'en' && pack.en) ? pack.en : (pack.de || null);
    }
    if(s == null){
      s = (typeof de === 'string' && de !== '') ? de : (typeof key === 'string' ? key : '');
    }
    if(vars && typeof vars === 'object'){
      Object.keys(vars).forEach(k => {
        s = s.split('{' + k + '}').join(String(vars[k]));
      });
    }
    return s;
  }



  function applyI18nDom(root){
    const scope = root || document;
    /* HTML trägt deutsches Default; JSON überschreibt nur wenn Eintrag existiert */
    scope.querySelectorAll('[data-i18n]').forEach(el => {
      const key = el.getAttribute('data-i18n');
      if(!key) return;
      el.textContent = t(el.textContent, key);
    });
    scope.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
      const key = el.getAttribute('data-i18n-placeholder');
      if(!key) return;
      el.setAttribute('placeholder', t(el.getAttribute('placeholder') || '', key));
    });
    scope.querySelectorAll('[data-i18n-aria]').forEach(el => {
      const key = el.getAttribute('data-i18n-aria');
      if(!key) return;
      el.setAttribute('aria-label', t(el.getAttribute('aria-label') || '', key));
    });
    scope.querySelectorAll('[data-i18n-title]').forEach(el => {
      const key = el.getAttribute('data-i18n-title');
      if(!key) return;
      el.setAttribute('title', t(el.getAttribute('title') || '', key));
    });
  }

  let languageLoadToken = 0;
  async function loadLanguage(code){
    const safe = (code || 'de').toLowerCase().slice(0, 2);
    const token = ++languageLoadToken;
    try{
      const res = await fetch(LANG_BASE + safe + '.json', { cache: 'no-cache' });
      if(!res.ok) throw new Error('missing');
      const data = await res.json();
      if(token !== languageLoadToken) return; /* veraltete Antwort verwerfen */
      i18nDict = data || {};
      currentLang = (data && data.meta && data.meta.code) ? data.meta.code : safe;
    }catch(err){
      if(token !== languageLoadToken) return;
      if(safe !== 'de') return loadLanguage('de');
      i18nDict = {};
      currentLang = 'de';
    }
    if(token !== languageLoadToken) return;
    try { flushSourceFromTree(); } catch(_){}
    captureScrollPositions();
    /* Offene Menüs schließen – sie wurden mit alten t()-Texten gebaut */
    if(typeof closeOptionsMenu === 'function') closeOptionsMenu();
    if(typeof closeAllWikiMenus === 'function') closeAllWikiMenus();
    if(typeof closeTemplateMenu === 'function') closeTemplateMenu();
    document.documentElement.lang = currentLang;
    if(i18nDict.app && i18nDict.app.documentTitle) document.title = i18nDict.app.documentTitle;
    applyI18nDom(document);
    if(typeof setSourceLabels === 'function'){
      const open = sourcePanel && sourcePanel.style.display !== 'none' && sourcePanel.style.display !== '';
      setSourceLabels(!!open && !isMobileLayout() ? true : (typeof activeSheet !== 'undefined' && activeSheet === 'source'));
    }
    if(typeof updateSourcePanelTitle === 'function') updateSourcePanelTitle();
    if(typeof updateSourceHeadTools === 'function') updateSourceHeadTools();
    if(typeof renderTemplateMenus === 'function') renderTemplateMenus();
    if(typeof renderCustomButtons === 'function') renderCustomButtons();
    if(typeof renderWarningsMenus === 'function') renderWarningsMenus();
    if(typeof render === 'function') render();
    if(typeof updateResultCharCount === 'function') updateResultCharCount();
    if(typeof renderProtocolList === 'function' && isProtocolOpen && isProtocolOpen()) renderProtocolList();
    updateLanguageButton();
    writeHashState();
  }

  function currentLanguageNativeName(){
    const langs = getAvailableLanguages();
    const hit = langs.find(l => l.code === currentLang);
    return (hit && hit.native) || currentLang.toUpperCase();
  }

  function updateLanguageButton(){
    const name = currentLanguageNativeName();
    const btn = document.getElementById('btnLanguage');
    if(btn){
      btn.textContent = name;
      btn.title = name;
    }
    const opt = document.getElementById('optLanguage');
    if(opt){
      const base = t('Sprache', 'toolbar.language');
      opt.textContent = base + (base ? ' · ' : '') + name;
    }
  }

  function normalizeSearch(s){
    return String(s || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
  }

  function fuzzyMatch(query, target){
    const q = normalizeSearch(query).trim();
    const tnorm = normalizeSearch(target);
    if(!q) return true;
    if(tnorm.indexOf(q) !== -1) return true;
    let ti = 0;
    for(let qi = 0; qi < q.length; qi++){
      const ch = q[qi];
      ti = tnorm.indexOf(ch, ti);
      if(ti === -1) return false;
      ti++;
    }
    return true;
  }

  function renderLanguageList(){
    const list = document.getElementById('languageList');
    if(!list) return;
    list.innerHTML = '';
    /* Nur Sprachen aus der aktuellen JSON (languages-Objekt), kein Ordner-Scan */
    const all = getAvailableLanguages();
    const filtered = all.filter(l =>
      fuzzyMatch(languageSearchQuery, l.native) ||
      fuzzyMatch(languageSearchQuery, l.local) ||
      fuzzyMatch(languageSearchQuery, l.code)
    );
    if(!filtered.length){
      const empty = document.createElement('div');
      empty.className = 'language-empty';
      empty.textContent = t('Keine Sprache gefunden.', 'language.empty');
      list.appendChild(empty);
      return;
    }
    filtered.forEach(l => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'language-item' + (l.code === currentLang ? ' selected' : '');
      btn.setAttribute('role', 'option');
      btn.setAttribute('aria-selected', l.code === currentLang ? 'true' : 'false');
      const name = document.createElement('span');
      name.className = 'lang-name';
      /* Anzeige immer in Muttersprache der Zielsprache */
      name.textContent = l.native;
      const check = document.createElement('span');
      check.className = 'lang-check';
      check.textContent = '✓';
      check.setAttribute('aria-label', t('Ausgewählt', 'language.selected'));
      btn.appendChild(name);
      btn.appendChild(check);
      btn.onclick = () => {
        if(l.code === currentLang){
          closeLanguagePanel();
          return;
        }
        loadLanguage(l.code).then(() => closeLanguagePanel());
      };
      list.appendChild(btn);
    });
  }

  function openLanguagePanel(){
    closeAllWikiMenus();
    closeTemplateMenu();
    closeOptionsMenu();
    if(typeof closeProtocol === 'function') closeProtocol();
    const panel = document.getElementById('languagePanel');
    const overlay = document.getElementById('languageOverlay');
    if(!panel) return;
    languageSearchQuery = '';
    const search = document.getElementById('languageSearch');
    if(search) search.value = '';
    renderLanguageList();
    if(overlay){
      overlay.hidden = false;
      overlay.classList.add('open');
    }
    panel.classList.add('open');
    document.body.style.overflow = 'hidden';
    /* Fokus auf Schließen-Button (nicht auf Suchfeld – vermeidet Mobile-Tastatur) */
    const closeBtn = document.getElementById('btnLanguageClose');
    if(closeBtn) closeBtn.focus();
  }

  function closeLanguagePanel(){
    const panel = document.getElementById('languagePanel');
    const overlay = document.getElementById('languageOverlay');
    if(panel) panel.classList.remove('open');
    if(overlay){
      overlay.classList.remove('open');
      overlay.hidden = true;
    }
    if(!isProtocolOpen || !isProtocolOpen()) document.body.style.overflow = '';
  }

  function isLanguagePanelOpen(){
    const panel = document.getElementById('languagePanel');
    return panel && panel.classList.contains('open');
  }

  /* ===== Tab-Zustand und globale UI-Flags ===== */
  let tabs = [];
  let activeTabId = null;
  let tabIdCounter = 1;
  let tabsOrientation = 'horizontal';
  let tabsVisible = true;
  let mobileDetailOpen = false;

  const _mqMobile = window.matchMedia('(max-width: 900px)');
  let _isMobile = _mqMobile.matches;
  _mqMobile.addEventListener('change', e => { _isMobile = e.matches; });
  function isMobileLayout(){
    return _isMobile;
  }

  function useUnpackedTools(){
    return !isMobileLayout();
  }

  const SHEET_MS = 280;
  let activeSheet = null;
  let sheetTimer = null;

  function sheetPanelEl(side){
    return side === 'detail' ? document.getElementById('detailCol') : sourcePanel;
  }

  function clearSheetTimer(){
    if(sheetTimer){ clearTimeout(sheetTimer); sheetTimer = null; }
  }

  let outlineScrollFrozen = false;
  /* Verhindert, dass Re-Render/Restore (scrollTop=0 Zwischenzustand) Tab-Scroll-State überschreibt */
  let scrollCaptureFrozen = false;

  function getActiveTab(){
    return tabs.find(x => x.id === activeTabId) || null;
  }

  /*
   * Single Source of Truth
   * ----------------------
   * S ist ein Accessor-Objekt auf den aktiven Tab. Getter/Setter sehen wie
   * Variablen aus, gehen aber direkt auf tab.{tree,selectedId,idCounter,
   * sourceFocused,focusDetailField}. Kein globaler Arbeits-Spiegel mehr.
   * Wenn kein aktiver Tab existiert (z.B. ganz früh in Init), liefern die
   * Getter neutrale Werte ([] / null / 1 / false); Setter sind dann No-Op.
   */
  const S = {
    get tree(){ const t = getActiveTab(); return t ? (t.tree || []) : []; },
    set tree(v){ const t = getActiveTab(); if(t) t.tree = v || []; },

    get selectedId(){ const t = getActiveTab(); return t ? t.selectedId : null; },
    set selectedId(v){ const t = getActiveTab(); if(t) t.selectedId = v || null; },

    get idCounter(){ const t = getActiveTab(); return t ? (t.idCounter || 1) : 1; },
    set idCounter(v){ const t = getActiveTab(); if(t) t.idCounter = v; },

    get sourceFocused(){ const t = getActiveTab(); return !!(t && t.sourceFocused); },
    set sourceFocused(v){ const t = getActiveTab(); if(t) t.sourceFocused = !!v; },

    get focusDetailField(){ const t = getActiveTab(); return !!(t && t.focusDetailField); },
    set focusDetailField(v){ const t = getActiveTab(); if(t) t.focusDetailField = !!v; }
  };

  function setSelectedId(id){
    S.selectedId = id || null;
    return S.selectedId;
  }


  /* Tree/selectedId/idCounter/sourceFocused/focusDetailField sind durch S
     immer synchron. Diese Funktion sichert nur noch die Scroll-Position. */
  function syncActiveTabToMemory(opts){
    if(!opts || opts.captureScroll !== false) captureScrollPositions();
  }

  /* Scroll strikt pro Tab – einzige Quelle ist tab.scroll (keine zweite Map) */
  function scrollStateForTabId(tabId){
    if(!tabId) return { outline: 0, detail: 0, source: 0, fields: {} };
    const tab = tabs.find(x => x.id === tabId);
    if(!tab) return { outline: 0, detail: 0, source: 0, fields: {} };
    if(!tab.scroll) tab.scroll = { outline: 0, detail: 0, source: 0, fields: {} };
    if(!tab.scroll.fields) tab.scroll.fields = {};
    return tab.scroll;
  }

  function getActiveTabScroll(){
    return scrollStateForTabId(activeTabId);
  }

  /*
   * Wiederverwendbare UI-Fabrik – neue Menü-/Toolbar-Einträge hierüber bauen,
   * damit Klassen und A11y konsistent bleiben.
   */
  function createUiButton(opts){
    opts = opts || {};
    const b = document.createElement(opts.href ? 'a' : 'button');
    if(!opts.href) b.type = opts.type || 'button';
    else {
      b.href = opts.href;
      if(opts.target) b.target = opts.target;
      if(opts.rel) b.rel = opts.rel;
    }
    const classes = ['btn'];
    if(opts.small !== false && opts.variant !== 'menu') classes.push('small');
    if(opts.primary) classes.push('primary');
    if(opts.danger) classes.push('danger');
    if(opts.iconOnly) classes.push('icon-only');
    if(opts.className) classes.push(opts.className);
    if(opts.variant === 'menu') b.className = 'opt-item' + (opts.danger ? ' danger' : '') + (opts.className ? ' ' + opts.className : '');
    else b.className = classes.filter(Boolean).join(' ');
    if(opts.text != null) b.textContent = opts.text;
    if(opts.html != null) b.innerHTML = opts.html;
    if(opts.title) b.title = opts.title;
    if(opts.ariaLabel) b.setAttribute('aria-label', opts.ariaLabel);
    if(opts.i18n) b.setAttribute('data-i18n', opts.i18n);
    if(opts.i18nTitle) b.setAttribute('data-i18n-title', opts.i18nTitle);
    if(opts.i18nAria) b.setAttribute('data-i18n-aria', opts.i18nAria);
    if(opts.role) b.setAttribute('role', opts.role);
    if(opts.disabled) b.disabled = true;
    if(typeof opts.onclick === 'function') b.addEventListener('click', opts.onclick);
    return b;
  }

  function createMenuItem(opts){
    opts = opts || {};
    opts.variant = 'menu';
    opts.role = opts.role || 'menuitem';
    return createUiButton(opts);
  }

  function createMenuSeparator(){
    const sep = document.createElement('div');
    sep.className = 'opt-sep';
    sep.setAttribute('role', 'separator');
    return sep;
  }

  function captureScrollPositions(){
    if(scrollCaptureFrozen || !activeTabId) return;
    const tabId = activeTabId;
    const sc = scrollStateForTabId(tabId);
    /* Outline immer erfassen – outlineScrollFrozen betrifft nur den Scroll-Listener,
        nicht das bewusste Sichern beim Tab-Wechsel. */
    if(outlineList) sc.outline = outlineList.scrollTop;
    if(detailScroll) sc.detail = detailScroll.scrollTop;
    if(sourceText) sc.source = sourceText.scrollTop;
    const ta = detailScroll && detailScroll.querySelector('textarea.detail-textarea');
    if(ta && S.selectedId) sc.fields[S.selectedId] = ta.scrollTop;
    // scroll direkt in tab.scroll gespeichert
  }

  function applyScrollState(sc){
    if(!sc) return;
    if(outlineList) outlineList.scrollTop = sc.outline || 0;
    if(detailScroll) detailScroll.scrollTop = sc.detail || 0;
    if(sourceText) sourceText.scrollTop = sc.source || 0;
    const ta = detailScroll && detailScroll.querySelector('textarea.detail-textarea');
    if(ta && S.selectedId && sc.fields && sc.fields[S.selectedId] != null){
      ta.scrollTop = sc.fields[S.selectedId];
    }
  }

  function restoreScrollPositions(){
    if(!activeTabId) return;
    const sc = scrollStateForTabId(activeTabId);
    applyScrollState(sc);
    requestAnimationFrame(() => {
      applyScrollState(sc);
      requestAnimationFrame(() => applyScrollState(sc));
    });
  }

  function bindOutlineScroll(){
    if(!outlineList || outlineList._scrollBound) return;
    outlineList._scrollBound = true;
    outlineList.addEventListener('scroll', () => {
      if(outlineScrollFrozen || scrollCaptureFrozen || !activeTabId) return;
      const tabId = activeTabId;
      const sc = scrollStateForTabId(tabId);
      sc.outline = outlineList.scrollTop;
      // scroll direkt in tab.scroll gespeichert
    }, { passive: true });
  }

  function bindSharedScrollPersist(){
    if(detailScroll && !detailScroll._scrollPersistBound){
      detailScroll._scrollPersistBound = true;
      detailScroll.addEventListener('scroll', () => {
        if(scrollCaptureFrozen || !activeTabId) return;
        const tabId = activeTabId;
        const sc = scrollStateForTabId(tabId);
        sc.detail = detailScroll.scrollTop;
        // scroll direkt in tab.scroll gespeichert
      }, { passive: true });
    }
    if(sourceText && !sourceText._scrollPersistBound){
      sourceText._scrollPersistBound = true;
      sourceText.addEventListener('scroll', () => {
        if(scrollCaptureFrozen || !activeTabId) return;
        const tabId = activeTabId;
        const sc = scrollStateForTabId(tabId);
        sc.source = sourceText.scrollTop;
        // scroll direkt in tab.scroll gespeichert
      }, { passive: true });
    }
  }

  function bindDetailTextareaScroll(ta, nodeId){
    if(!ta || !nodeId || ta._scrollPersistBound) return;
    ta._scrollPersistBound = true;
    ta.addEventListener('scroll', () => {
      if(scrollCaptureFrozen || !activeTabId) return;
      const tabId = activeTabId;
      const sc = scrollStateForTabId(tabId);
      sc.fields[nodeId] = ta.scrollTop;
      // scroll direkt in tab.scroll gespeichert
    }, { passive: true });
  }

  function restoreOutlineScroll(){
    if(!outlineList || !activeTabId) return;
    const sc = scrollStateForTabId(activeTabId);
    outlineList.scrollTop = sc.outline || 0;
  }

  function ensureDetailParent(){
    const detailCol = document.getElementById('detailCol');
    const split = document.getElementById('splitBody');
    if(!detailCol || !split) return;
    if(isMobileLayout()){
      if(detailCol.parentElement !== layout) layout.appendChild(detailCol);
    } else {
      if(detailCol.parentElement !== split) split.appendChild(detailCol);
    }
  }

  function clearSheetInlineGeometry(){
    const detailCol = document.getElementById('detailCol');
    [detailCol, sourcePanel].forEach(el => {
      if(!el) return;
      el.style.position = '';
      el.style.top = '';
      el.style.left = '';
      el.style.right = '';
      el.style.bottom = '';
      el.style.width = '';
      el.style.height = '';
    });
    ['--mobile-sheet-top','--mobile-sheet-left','--mobile-sheet-right',
     '--mobile-sheet-bottom','--mobile-outline-h'].forEach(p => layout.style.removeProperty(p));
  }

  function putSheetDormant(panel){
    if(!panel) return;
    panel.classList.remove('mobile-open');
    panel.classList.add('sheet-dormant');
    panel.setAttribute('aria-hidden', 'true');
  }

  function wakeSheet(panel){
    if(!panel) return;
    panel.classList.remove('sheet-dormant');
    panel.setAttribute('aria-hidden', 'false');
  }

  function putAllSheetsDormant(){
    const detailCol = document.getElementById('detailCol');
    putSheetDormant(detailCol);
    putSheetDormant(sourcePanel);
  }

  const _mqSmall = window.matchMedia('(max-width: 480px)');
  let _isSmall = _mqSmall.matches;
  _mqSmall.addEventListener('change', e => { _isSmall = e.matches; });

  function updateMobileSheetMetrics(){
    if(!isMobileLayout()){
      clearSheetInlineGeometry();
      return;
    }
    ensureDetailParent();
    const split = document.getElementById('splitBody');
    const detailCol = document.getElementById('detailCol');
    if(!split || !detailCol) return;
    const fraction = _isSmall ? 0.53 : 0.52;
    const layoutRect = layout.getBoundingClientRect();
    const splitRect = split.getBoundingClientRect();
    if(splitRect.height < 40) return;
    const outlineH = Math.max(80, Math.round(splitRect.height * fraction));
    const top = Math.round(splitRect.top + outlineH);
    const left = Math.round(layoutRect.left);
    const width = Math.round(layoutRect.width);
    const height = Math.max(80, Math.round(layoutRect.bottom - top));
    layout.style.setProperty('--mobile-outline-h', outlineH + 'px');
    [detailCol, sourcePanel].forEach(el => {
      if(!el) return;
      el.style.position = 'fixed';
      el.style.top = top + 'px';
      el.style.left = left + 'px';
      el.style.width = width + 'px';
      el.style.height = height + 'px';
      el.style.right = 'auto';
      el.style.bottom = 'auto';
    });
  }

  function applySheetChrome(on){
    bindOutlineScroll();
    if(on){
      if(outlineList && !outlineScrollFrozen){
        const sc = getActiveTabScroll();
        if(sc) sc.outline = outlineList.scrollTop;
      }
      outlineScrollFrozen = true;
      layout.classList.add('sheet-open');
      updateMobileSheetMetrics();
      restoreOutlineScroll();
      requestAnimationFrame(() => {
        restoreOutlineScroll();
        outlineScrollFrozen = false;
      });
    } else {
      outlineScrollFrozen = true;
      layout.classList.remove('sheet-open');
      restoreOutlineScroll();
      requestAnimationFrame(() => {
        restoreOutlineScroll();
        outlineScrollFrozen = false;
      });
    }
  }

  function openSheet(side){
    if(!isMobileLayout()) return;
    if(activeSheet === side) return;
    bindOutlineScroll();
    if(outlineList && !outlineScrollFrozen){
      const sc = getActiveTabScroll();
      if(sc) sc.outline = outlineList.scrollTop;
    }
    if(activeSheet && activeSheet !== side){
      closeSheet(true);
    }
    activeSheet = side;
    mobileDetailOpen = (side === 'detail');
    const panel = sheetPanelEl(side);
    if(side === 'source'){
      sourcePanel.style.display = 'flex';
      setSourceLabels(true);
      sourceGesamtMode = false;
      sourceDirty = false;
      updateSourcePanelTitle();
      updateSourceFromTree();
      updateSourceHeadTools();
    }
    clearSheetTimer();
    ensureDetailParent();
    updateMobileSheetMetrics();
    applySheetChrome(false);
    restoreOutlineScroll();
    wakeSheet(panel);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        panel.classList.add('mobile-open');
      });
    });
    const done = (e) => {
      if(e && e.target !== panel) return;
      panel.removeEventListener('transitionend', done);
      clearSheetTimer();
      if(activeSheet === side){
        applySheetChrome(true);
        restoreOutlineScroll();
      }
    };
    panel.addEventListener('transitionend', done);
    sheetTimer = setTimeout(() => done(), SHEET_MS + 40);
  }

  function closeSheet(immediate){
    bindOutlineScroll();
    if(outlineList && !outlineScrollFrozen){
      const sc = getActiveTabScroll();
      if(sc) sc.outline = outlineList.scrollTop;
    }
    if(!activeSheet) {
      putAllSheetsDormant();
      applySheetChrome(false);
      restoreOutlineScroll();
      mobileDetailOpen = false;
      return;
    }
    const side = activeSheet;
    const panel = sheetPanelEl(side);
    activeSheet = null;
    mobileDetailOpen = false;
    clearSheetTimer();
    applySheetChrome(false);
    restoreOutlineScroll();
    if(immediate){
      putSheetDormant(panel);
      if(side === 'source') setSourceLabels(false);
      restoreOutlineScroll();
      return;
    }
    void layout.offsetHeight;
    requestAnimationFrame(() => {
      panel.classList.remove('mobile-open');
      restoreOutlineScroll();
    });
    const done = (e) => {
      if(e && e.target !== panel) return;
      panel.removeEventListener('transitionend', done);
      clearSheetTimer();
      putSheetDormant(panel);
      if(side === 'source') setSourceLabels(false);
      restoreOutlineScroll();
    };
    panel.addEventListener('transitionend', done);
    sheetTimer = setTimeout(() => done(), SHEET_MS + 40);
  }

  function openMobileDetail(){ openSheet('detail'); }
  function closeMobileDetail(){ if(activeSheet === 'detail' || mobileDetailOpen) closeSheet(false); }

  function shouldFocusDetail(){
    return !isMobileLayout() || mobileDetailOpen;
  }

  /* ===== URL-Hash ===== */
  function parseHashParams(){
    const raw = (location.hash || '').replace(/^#/, '');
    const params = {};
    raw.split('&').forEach(part => {
      if(!part) return;
      const eq = part.indexOf('=');
      if(eq < 0){
        const k = decodeURIComponent(part.trim());
        if(k) params[k] = '';
        return;
      }
      const k = decodeURIComponent(part.slice(0, eq).trim());
      const v = decodeURIComponent(part.slice(eq + 1).trim());
      if(k) params[k] = v;
    });
    return params;
  }

  function readBoolParam(params, key, defaultVal){
    if(Object.prototype.hasOwnProperty.call(params, key)){
      const v = params[key];
      return (v === 'true' || v === '1');
    }
    return defaultVal;
  }

  function readHashState(){
    const params = parseHashParams();
    /* Defaults werden immer gesetzt; URL-Werte überschreiben, wenn vorhanden */
    if(params.tabBarLocation === 'left') tabsOrientation = 'vertical';
    else if(params.tabBarLocation === 'top') tabsOrientation = 'horizontal';
    else tabsOrientation = 'horizontal';
    if(params.tabBarShown === 'false') tabsVisible = false;
    else if(params.tabBarShown === 'true') tabsVisible = true;
    else tabsVisible = true;
    if(Object.prototype.hasOwnProperty.call(params, 'showCharacterCount')){
      const v = params.showCharacterCount;
      showCharacterCount = (v === 'true' || v === '1');
    } else {
      showCharacterCount = false;
    }
    if(Object.prototype.hasOwnProperty.call(params, 'xmlCodeLineWrap')){
      const v = params.xmlCodeLineWrap;
      xmlCodeLineWrap = (v === 'true' || v === '1');
    } else {
      xmlCodeLineWrap = true;
    }
    if(Object.prototype.hasOwnProperty.call(params, 'detailTextLineWrap')){
      const v = params.detailTextLineWrap;
      detailTextLineWrap = (v === 'true' || v === '1');
    } else {
      detailTextLineWrap = true;
    }
    if(Object.prototype.hasOwnProperty.call(params, 'protocolThreshold')){
      const n = parseInt(params.protocolThreshold, 10);
      if(Number.isInteger(n) && n > 0 && n <= 1000) protocolThreshold = n;
      else protocolThreshold = 20;
    } else {
      protocolThreshold = 20;
    }
    if(Object.prototype.hasOwnProperty.call(params, 'setLanguage')){
      const code = String(params.setLanguage || '').toLowerCase().slice(0, 2);
      if(code) currentLang = code;
      else currentLang = detectSystemLanguage();
    } else {
      currentLang = detectSystemLanguage();
    }
    /* displayedAmountbuttonC: 2–6; Default Mobile 2, Desktop 4 */
    if(Object.prototype.hasOwnProperty.call(params, 'displayedAmountbuttonC')){
      const n = parseInt(params.displayedAmountbuttonC, 10);
      if(Number.isInteger(n) && n >= 2 && n <= CUSTOM_SLOT_MAX) displayedAmountbuttonC = n;
      else displayedAmountbuttonC = (typeof isMobileLayout === 'function' && isMobileLayout()) ? 2 : 4;
    } else {
      displayedAmountbuttonC = (typeof isMobileLayout === 'function' && isMobileLayout()) ? 2 : 4;
    }
    customButtonActions = CUSTOM_ACTION_DEFAULTS.slice();
    for(let i = 0; i < CUSTOM_SLOT_MAX; i++){
      const key = 'buttonC' + (i + 1);
      if(Object.prototype.hasOwnProperty.call(params, key)){
        const v = String(params[key] || '').toLowerCase();
        if(CUSTOM_ACTION_IDS.indexOf(v) !== -1) customButtonActions[i] = v;
      }
    }
    (function resolveCustomDupes(){
      const used = new Set();
      for(let i = 0; i < CUSTOM_SLOT_MAX; i++){
        if(used.has(customButtonActions[i])){
          const free = CUSTOM_ACTION_IDS.find(a => !used.has(a) && customButtonActions.indexOf(a) === -1) ||
            CUSTOM_ACTION_IDS.find(a => !used.has(a));
          if(free) customButtonActions[i] = free;
        }
        used.add(customButtonActions[i]);
      }
    })();
    warnBrowserTabClose = readBoolParam(params, 'warnBrowserTabClose', true);
    warnPromptTabClose = readBoolParam(params, 'warnPromptTabClose', true);
    warnPromptTabReset = readBoolParam(params, 'warnPromptTabReset', true);
    warnPromptEntryDelete = readBoolParam(params, 'warnPromptEntryDelete', true);
    warnBeforePastingText = readBoolParam(params, 'warnBeforePastingText', true);
    if(Object.prototype.hasOwnProperty.call(params, 'warnPastingTextThreshold')){
      const n = parseInt(params.warnPastingTextThreshold, 10);
      if(Number.isInteger(n) && n >= 1) warnPastingTextThreshold = n;
      else warnPastingTextThreshold = 500000;
    } else {
      warnPastingTextThreshold = 500000;
    }
    persistDrafts = readBoolParam(params, 'persistDrafts', false);
    if(Object.prototype.hasOwnProperty.call(params, 'performanceMode')){
      const v = String(params.performanceMode || 'auto');
      if(v === 'on' || v === 'off' || v === 'auto') performanceMode = v;
      else performanceMode = 'auto';
    } else {
      performanceMode = 'auto';
    }
  }

  function writeHashState(){
    /* Feste Reihenfolge; alle Parameter immer mit aktuellem Wert schreiben (Persistenz beim Neuladen) */
    const parts = [];
    parts.push('setLanguage=' + currentLang);
    parts.push('tabBarShown=' + (tabsVisible ? 'true' : 'false'));
    parts.push('tabBarLocation=' + (tabsOrientation === 'vertical' ? 'left' : 'top'));
    parts.push('showCharacterCount=' + (showCharacterCount ? 'true' : 'false'));
    parts.push('xmlCodeLineWrap=' + (xmlCodeLineWrap ? 'true' : 'false'));
    parts.push('detailTextLineWrap=' + (detailTextLineWrap ? 'true' : 'false'));
    parts.push('protocolThreshold=' + protocolThreshold);
    parts.push('displayedAmountbuttonC=' + displayedAmountbuttonC);
    for(let i = 0; i < CUSTOM_SLOT_MAX; i++){
      parts.push('buttonC' + (i + 1) + '=' + (customButtonActions[i] || CUSTOM_ACTION_DEFAULTS[i]));
    }
    parts.push('warnBrowserTabClose=' + (warnBrowserTabClose ? 'true' : 'false'));
    parts.push('warnPromptTabClose=' + (warnPromptTabClose ? 'true' : 'false'));
    parts.push('warnPromptTabReset=' + (warnPromptTabReset ? 'true' : 'false'));
    parts.push('warnPromptEntryDelete=' + (warnPromptEntryDelete ? 'true' : 'false'));
    parts.push('warnBeforePastingText=' + (warnBeforePastingText ? 'true' : 'false'));
    parts.push('warnPastingTextThreshold=' + warnPastingTextThreshold);
    parts.push('persistDrafts=' + (persistDrafts ? 'true' : 'false'));
    parts.push('performanceMode=' + performanceMode);
    const next = '#' + parts.join('&');
    if(location.hash !== next){
      history.replaceState(null, '', next);
    }
  }

  /* ===== Baum- und Editor-Zustand ===== */
  /* tree/selectedId/idCounter/sourceFocused/focusDetailField leben jetzt im
     aktiven Tab und werden ausschließlich über S angesprochen. */
  let showCharacterCount = false;
  /* Custom-Footer-Buttons C1–C6; Menü: user, assistant, tool, comment, parent (Pre/Oberpunkt), child (Sub/Unterpunkt) */
  const CUSTOM_SLOT_MAX = 6;
  const CUSTOM_ACTION_IDS = ['user', 'assistant', 'tool', 'comment', 'parent', 'child'];
  const CUSTOM_ACTION_DEFAULTS = ['user', 'assistant', 'comment', 'child', 'tool', 'parent'];
  let customButtonActions = CUSTOM_ACTION_DEFAULTS.slice();
  /* Anzeigeanzahl Custom-Buttons: 2–6; Default Desktop 4, Mobile 2 */
  let displayedAmountbuttonC = 4;
  let protocolLog = [];
  let hasProtocolErrors = false;
  let protocolErrorCount = 0;
  let protocolThreshold = 20;
  const protocolTriggerEls = [];
  let xmlCodeLineWrap = true;
  let detailTextLineWrap = true;
  

  let sourceGesamtMode = false;
  let sourceDirty = false; /* Source-Text wurde manuell editiert, noch nicht übernommen */
  let wikiSettings = {lang:'de', chars:1200}, openWikiMenu = null, openTemplateMenu = null, openOptionsMenu = null;

  /* Schließ-/Lösch-/Paste-Warnungen (URL-Parameter, Default true) */
  let warnBrowserTabClose = true;
  let warnPromptTabClose = true;
  let warnPromptTabReset = true;
  let warnPromptEntryDelete = true;
  let warnBeforePastingText = true;
  let warnPastingTextThreshold = 500000;
  /* Entwürfe: immer sessionStorage; localStorage nur mit Opt-In (URL persistDrafts) */
  let persistDrafts = false;
  const DRAFT_SESSION_KEY = 'pb-draft-v1';
  const DRAFT_LOCAL_KEY = 'pb-draft-v1-local';
  const DRAFT_LOCAL_TIME_KEY = 'pb-draft-v1-local-time';
  let draftSaveTimer = null;

  let nodeClipboard = null;
  let pendingPaste = null; /* { text, target } für Paste-Warn-Dialog */

  /* ===== Strukturelles Undo/Redo =====
   * Snapshots des gesamten Baums vor jeder Struktur-Operation.
   * {n} ist klein genug (meist < 100 Knoten) für Full-Tree-Snapshot. */
  const STRUCT_UNDO_LIMIT = 80;
  let structUndoStack = [];
  let structRedoStack = [];
  let structUndoSuspended = false;

  function structSnapshot(){
    return {
      tree: cloneTree(S.tree),
      selectedId: S.selectedId,
      idCounter: S.idCounter
    };
  }

  function structUndoPush(){
    if(structUndoSuspended) return;
    structUndoStack.push(structSnapshot());
    if(structUndoStack.length > STRUCT_UNDO_LIMIT) structUndoStack.shift();
    structRedoStack.length = 0;
    updateStructUndoButtons();
  }

  function structUndo(){
    if(!structUndoStack.length) return;
    structRedoStack.push(structSnapshot());
    const snap = structUndoStack.pop();
    structUndoSuspended = true;
    const oldTree = cloneTree(S.tree);
    S.tree = snap.tree;
    S.selectedId = snap.selectedId;
    S.idCounter = snap.idCounter;
    render();
    structUndoSuspended = false;
    updateStructUndoButtons();
    const diff = diffTrees(oldTree, S.tree);
    showBanner('ok', [formatTreeDiff(diff)]);
  }

  function structRedo(){
    if(!structRedoStack.length) return;
    structUndoStack.push(structSnapshot());
    const snap = structRedoStack.pop();
    structUndoSuspended = true;
    const oldTree = cloneTree(S.tree);
    S.tree = snap.tree;
    S.selectedId = snap.selectedId;
    S.idCounter = snap.idCounter;
    render();
    structUndoSuspended = false;
    updateStructUndoButtons();
    const diff = diffTrees(oldTree, S.tree);
    showBanner('ok', [formatTreeDiff(diff)]);
  }

  function updateStructUndoButtons(){
    const btnU = document.getElementById('btnStructUndo');
    const btnR = document.getElementById('btnStructRedo');
    if(btnU) btnU.disabled = structUndoStack.length === 0;
    if(btnR) btnR.disabled = structRedoStack.length === 0;
  }

  function clearStructUndo(){
    structUndoStack.length = 0;
    structRedoStack.length = 0;
    updateStructUndoButtons();
  }

  /* Editor: Einrückung wie Serialisierung (2 Spaces) */
  const EDITOR_INDENT = '  ';
  /* VS-Code-ähnlich: viele Schritte, Tipp-Burst wird zu einem Undo-Stop */
  const EDITOR_UNDO_LIMIT = 150;
  const editorHistMap = new Map();

  function pruneEditorHistKeys(pred){
    for(const key of [...editorHistMap.keys()]){
      if(pred(key)) editorHistMap.delete(key);
    }
  }

  function collectNodeIds(nodes, out){
    (nodes || []).forEach(n => {
      if(n && n.id) out.push(n.id);
      if(n && n.children) collectNodeIds(n.children, out);
    });
    return out;
  }

  /* Nur History des aktuellen Tabs für diese Node-IDs entfernen */
  function pruneEditorHistForNodeIds(ids, tabId){
    if(!ids || !ids.length) return;
    const tid = tabId || activeTabId || '';
    const set = new Set(ids);
    pruneEditorHistKeys(k => {
      for(const id of set){
        if(tid && (k === 'detail-' + tid + '-' + id || k === 'detail-tag-' + tid + '-' + id)) return true;
        /* Legacy ohne Tab-Id */
        if(k === 'detail-' + id || k === 'detail-tag-' + id) return true;
      }
      return false;
    });
  }

  function pruneEditorHistForTree(nodes, tabId){
    pruneEditorHistForNodeIds(collectNodeIds(nodes, []), tabId);
  }

  function pruneEditorHistForTabId(tabId){
    if(!tabId) return;
    pruneEditorHistKeys(k =>
      k.indexOf('detail-' + tabId + '-') === 0 || k.indexOf('detail-tag-' + tabId + '-') === 0
    );
  }
  /* Viele textartige Formate für Drag&Drop / Datei-Paste in Editoren */
  const FILE_DROP_EXTS = /\.(txt|text|md|markdown|mdx|rst|json|jsonc|json5|csv|tsv|xml|xsl|xsd|html?|xhtml|css|scss|sass|less|js|mjs|cjs|jsx|ts|tsx|vue|svelte|astro|py|rb|go|rs|java|kt|kts|c|h|cc|cpp|cxx|hpp|hxx|cs|php|sql|yml|yaml|toml|ini|cfg|conf|env|log|rtf|svg|tex|latex|bib|sh|bash|zsh|fish|ps1|bat|cmd|r|R|swift|scala|lua|pl|pm|dart|graphql|gql|proto|editorconfig|gitignore|gitattributes|dockerignore|npmrc|nvmrc|prettierrc|eslintrc|babelrc|map|properties|gradle|cmake|makefile|mk|dockerfile|ipynb|lock|sum|mod|plist|strings|asm|s|vb|fs|fsx|clj|cljs|edn|ex|exs|erl|hrl|hs|lhs|ml|mli|nim|zig|v|vhdl|vhd|sv|svh)$/i;
  const FILE_DROP_MAX_BYTES = 8 * 1024 * 1024;

  let dragId = null;
  let dragOverId = null;
  let dragOverPos = null;
  let longPressTimer = null;
  let touchStartY = 0;
  let isTouchDragging = false;

  const outlineList = document.getElementById('outlineList');
  const detailScroll = document.getElementById('detailScroll');
  const sourceText = document.getElementById('sourceText');
  const sourcePanel = document.getElementById('sourcePanel');
  const layout = document.getElementById('layout');
  const tabsShell = document.getElementById('tabsShell');
  const tabList = document.getElementById('tabList');
  const panelStructureTitle = document.getElementById('panelStructureTitle');
  const LANG_CODES = ['de','en','fr','es','it','pt','nl','pl','ru','ja','zh'];

  /* Fallback-Zähler für den seltenen Fall, dass vor dem Anlegen des ersten
     Tabs bereits neue Knoten erzeugt werden (z.B. beim Laden eines Drafts). */
  let _fallbackIdCounter = 1;
  function uid(){
    const tab = getActiveTab();
    if(tab){
      const n = tab.idCounter || 1;
      tab.idCounter = n + 1;
      return 'n' + n;
    }
    return 'n' + (_fallbackIdCounter++);
  }
  function newNode(tag,text){ return {id:uid(), kind:'element', tag:tag||'', text:text||'', children:[], collapsed:false}; }
  function newCommentNode(text){ return {id:uid(), kind:'comment', text:text||''}; }

  function cloneNode(node){
    if(!node) return null;
    if(node.kind === 'comment') return newCommentNode(node.text);
    const c = newNode(node.tag, node.text);
    c.collapsed = !!node.collapsed;
    if(node.children && node.children.length) c.children = node.children.map(cloneNode);
    return c;
  }

  function cloneTree(nodes){ return (nodes || []).map(cloneNode); }

  /* ===== Tab-Verwaltung ===== */
  function createTabState(title, treeData){
    const tabState = {
      id: 'tab'+(tabIdCounter++),
      title: title || t('Prompt {n}', 'tabs.defaultTitle', {n: tabIdCounter}),
      tree: treeData || [],
      selectedId: null,
      idCounter: 1,
      sourceFocused: false,
      focusDetailField: false,
      scroll: { outline: 0, detail: 0, source: 0, fields: {} },
      draftDirty: true,
      draftXml: null,
      protocolLog: [],
      protocolErrorCount: 0,
      hasProtocolErrors: false
    };
    if(treeData && treeData.length){
      let max = 0;
      (function walk(nodes){
        nodes.forEach(n=>{
          const m = /^n(\d+)$/.exec(n.id||'');
          if(m) max = Math.max(max, parseInt(m[1],10));
          if(n.children) walk(n.children);
        });
      })(treeData);
      tabState.idCounter = max + 1;
      tabState.selectedId = firstNavigableId(treeData);
    }
    return tabState;
  }

  function saveActiveTab(opts){
    syncActiveTabToMemory(opts);
    scheduleDraftSave();
  }

  /* ===== Entwürfe (sessionStorage immer, localStorage nur Opt-In) ===== */
  function markActiveTabDraftDirty(){
    const tab = getActiveTab();
    if(tab) tab.draftDirty = true;
  }

  function serializeTabXml(tab){
    const body = serializeTree(tab.tree || [], 1);
    return body ? ('<prompt>\n' + body + '</prompt>') : '<prompt></prompt>';
  }

  function buildDraftPayload(){
    syncActiveTabToMemory({ captureScroll: false });
    const activeIdx = Math.max(0, tabs.findIndex(x => x.id === activeTabId));
    return {
      version: 1,
      active: activeIdx,
      tabs: tabs.map(tab => {
        if(tab.draftDirty || tab.draftXml == null){
          tab.draftXml = serializeTabXml(tab);
          tab.draftDirty = false;
        }
        return { title: tab.title || '', xml: tab.draftXml };
      }),
      ts: Date.now()
    };
  }

  function scheduleDraftSave(){
    /* dirty nur setzen, wenn Aufrufer Inhalt geändert hat (markActiveTabDraftDirty) */
    if(draftSaveTimer) clearTimeout(draftSaveTimer);
    draftSaveTimer = setTimeout(() => {
      draftSaveTimer = null;
      try { saveDraftNow(); } catch(_){}
    }, 600);
  }

  function saveDraftNow(){
    if(!tabs || !tabs.length) return;
    const payload = JSON.stringify(buildDraftPayload());
    try { sessionStorage.setItem(DRAFT_SESSION_KEY, payload); } catch(_){}
    if(persistDrafts){
      try {
        localStorage.setItem(DRAFT_LOCAL_KEY, payload);
        localStorage.setItem(DRAFT_LOCAL_TIME_KEY, String(Date.now()));
      } catch(_){}
    }
  }

  function clearLocalDraft(){
    try {
      localStorage.removeItem(DRAFT_LOCAL_KEY);
      localStorage.removeItem(DRAFT_LOCAL_TIME_KEY);
    } catch(_){}
  }

  function hasLocalDraft(){
    try { return !!localStorage.getItem(DRAFT_LOCAL_KEY); } catch(_){ return false; }
  }

  function loadDraftPayload(){
    let raw = null;
    try { raw = sessionStorage.getItem(DRAFT_SESSION_KEY); } catch(_){}
    if(raw){
      try { return JSON.parse(raw); } catch(_){}
    }
    /* localStorage nur bei Opt-In lesen – nie automatisch löschen (nur per Button) */
    if(persistDrafts){
      try {
        raw = localStorage.getItem(DRAFT_LOCAL_KEY);
        if(raw) return JSON.parse(raw);
      } catch(_){}
    }
    return null;
  }

  function applyDraftPayload(data){
    if(!data || !Array.isArray(data.tabs) || !data.tabs.length) return false;
    const newTabs = [];
    data.tabs.forEach((entry, i) => {
      const title = (entry && entry.title) ? String(entry.title) : t('Prompt {n}', 'tabs.defaultTitle', {n: i + 1});
      let treeData = [];
      if(entry && entry.xml){
        const parsed = parseXMLString(String(entry.xml));
        if(parsed && parsed.tree && !parsed.errors.length){
          if(parsed.tree.length === 1 && parsed.tree[0].kind === 'element' && (parsed.tree[0].tag || '').toLowerCase() === 'prompt'){
            treeData = parsed.tree[0].children || [];
          } else {
            treeData = parsed.tree;
          }
        }
      }
      newTabs.push(createTabState(title, treeData));
    });
    if(!newTabs.length) return false;
    tabs = newTabs;
    const idx = Math.min(Math.max(0, data.active|0), tabs.length - 1);
    activeTabId = tabs[idx].id;
    /* tree/selectedId/idCounter werden von S direkt aus tabs[idx] gelesen –
       keine Zuweisung mehr nötig. */
    clearStructUndo();
    return true;
  }

  function loadTab(tabId){
    if(typeof flushSourceFromTree === 'function') flushSourceFromTree();
    /* Scroll des aktuellen Tabs sichern BEVOR activeTabId wechselt.
        Guard absichtlich NICHT abfragen: beim Verlassen wollen wir immer speichern. */
    if(activeTabId){
      const prevId = activeTabId;
      const sc = scrollStateForTabId(prevId);
      if(outlineList) sc.outline = outlineList.scrollTop;
      if(detailScroll) sc.detail = detailScroll.scrollTop;
      if(sourceText) sc.source = sourceText.scrollTop;
      // scroll direkt in tab.scroll gespeichert
    }
    saveActiveTab({ captureScroll: true });
    /* Protokoll-Zustand pro Tab speichern/wiederherstellen */
    if(activeTabId){
      const prevTab = tabs.find(x => x.id === activeTabId);
      if(prevTab){
        prevTab.protocolLog = protocolLog;
        prevTab.protocolErrorCount = protocolErrorCount;
        prevTab.hasProtocolErrors = hasProtocolErrors;
      }
    }
    /* Sheet schließen, solange activeTabId noch der alte Tab ist –
        sonst schreibt closeSheet() den neuen Tab-Scroll in die alte Outline. */
    closeSheet(true);
    const t = tabs.find(x => x.id === tabId);
    if(!t) return;
    activeTabId = tabId;
    /* S liest ab jetzt direkt aus t – keine Kopie in Globals mehr. */
    S.sourceFocused = false;
    S.focusDetailField = false;
    sourceDirty = false;
    sourceGesamtMode = false;
    clearStructUndo();
    /* Protokoll aus neuem Tab wiederherstellen */
    protocolLog = t.protocolLog || [];
    protocolErrorCount = t.protocolErrorCount || 0;
    hasProtocolErrors = !!t.hasProtocolErrors;
    updateProtocolMarks();
    if(!t.scroll) t.scroll = { outline: 0, detail: 0, source: 0, fields: {} };
    /* Tab.scroll in Store spiegeln falls noch nicht in Map */
    /* tab.scroll ist jetzt die einzige Scroll-Quelle – kein separater Map-Store mehr */
    hideBanner();
    renderTabs();
    render();
    /* Scroll wird in render() per rAF gesetzt – hier kein zusätzlicher Aufruf nötig */
  }

  function addNewTab(title, treeData){
    saveActiveTab();
    const t = createTabState(title, treeData);
    tabs.push(t);
    activeTabId = t.id;
    /* S liest direkt aus t; sourceFocused/focusDetailField sind in createTabState
       bereits false. */
    closeSheet(true);
    hideBanner();
    sourceDirty = false;
    clearStructUndo();
    renderTabs();
    render();
  }

  function duplicateActiveTab(){
    saveActiveTab();
    const activeTab = getActiveTab();
    if(!activeTab) return;
    const clonedTree = cloneTree(activeTab.tree);
    const baseTitle = (activeTab.title || 'Prompt').trim() || 'Prompt';
    addNewTab(baseTitle + t(' Kopie', 'tabs.copySuffix'), clonedTree);
  }

  function closeTab(tabId, evt){
    if(evt) evt.stopPropagation();
    if(tabs.length <= 1){
      const doReset = () => {
        const lastTab = tabs[0];
        pruneEditorHistForTabId(lastTab.id);
        lastTab.tree = [];
        lastTab.selectedId = null;
        lastTab.idCounter = 1;
        lastTab.title = t('Prompt {n}', 'tabs.defaultTitle', {n: 1});
        lastTab.draftDirty = true;
        lastTab.draftXml = null;
        if(lastTab.scroll) lastTab.scroll = { outline: 0, detail: 0, source: 0, fields: {} };
        loadTab(lastTab.id);
      };
      maybeConfirm(warnPromptTabReset, t('Letzten Tab zurücksetzen?', 'tabs.confirmResetLast'), doReset);
      return;
    }
    const doClose = () => {
      const idx = tabs.findIndex(x => x.id === tabId);
      if(idx < 0) return;
      const closing = tabs[idx];
      if(closing) pruneEditorHistForTabId(closing.id);
      const wasActive = activeTabId === tabId;
      tabs.splice(idx, 1);
      if(wasActive){
        const next = tabs[Math.min(idx, tabs.length-1)];
        activeTabId = null;
        loadTab(next.id);
      } else {
        renderTabs();
      }
    };
    maybeConfirm(warnPromptTabClose, t('Diesen Prompt-Tab schließen?', 'tabs.confirmClose'), doClose);
  }

  function updatePanelStructureTitle(){
    if(!panelStructureTitle) return;
    const activeTab = getActiveTab();
    const name = activeTab ? activeTab.title : t('Prompt {n}', 'tabs.defaultTitle', {n: 1});
    if(document.activeElement !== panelStructureTitle){
      panelStructureTitle.value = name;
    }
  }

  function applyPanelTitleToTab(){
    const activeTab = getActiveTab();
    if(!activeTab) return;
    const name = (panelStructureTitle.value || '').trim() || 'Prompt';
    if(activeTab.title === name) return;
    activeTab.title = name;
    activeTab.draftDirty = true;
    const label = tabList.querySelector('.tab-item.active .tab-title');
    if(label) label.textContent = name;
    scheduleDraftSave();
  }

  let tabDragId = null;
  let tabDragOverId = null;
  let tabDragOverPos = null;

  function clearTabDragStyles(){
    tabList.querySelectorAll('.tab-item').forEach(r => {
      r.classList.remove('dragging', 'drag-over-before', 'drag-over-after');
    });
  }

  function moveTabById(sourceId, targetId, pos){
    if(!sourceId || !targetId || sourceId === targetId) return;
    const from = tabs.findIndex(x => x.id === sourceId);
    const toIdx = tabs.findIndex(x => x.id === targetId);
    if(from < 0 || toIdx < 0) return;
    let to = pos === 'after' ? toIdx + 1 : toIdx;
    const item = tabs.splice(from, 1)[0];
    if(from < to) to -= 1;
    tabs.splice(to, 0, item);
    renderTabs();
  }

  function moveActiveTab(dir){
    if(!activeTabId) return;
    const idx = tabs.findIndex(x => x.id === activeTabId);
    if(idx < 0) return;
    const ni = idx + dir;
    if(ni < 0 || ni >= tabs.length) return;
    const tmp = tabs[idx];
    tabs[idx] = tabs[ni];
    tabs[ni] = tmp;
    renderTabs();
  }

  function updateTabMoveButtonLabels(){
    const vertical = !isMobileLayout() && tabsOrientation === 'vertical';
    const prevLabel = vertical ? t('Tab nach oben verschieben', 'tabs.moveUpTitle') : t('Tab nach links verschieben', 'tabs.movePrevTitle');
    const nextLabel = vertical ? t('Tab nach unten verschieben', 'tabs.moveDownTitle') : t('Tab nach rechts verschieben', 'tabs.moveNextTitle');
    const prevAria = vertical ? t('Nach oben', 'tabs.moveUp') : t('Nach links', 'tabs.movePrev');
    const nextAria = vertical ? t('Nach unten', 'tabs.moveDown') : t('Nach rechts', 'tabs.moveNext');
    /* Pfeil mit Strich wie in der Struktur (↑↓), horizontal ←→ – keine spitzen Klammern */
    const prevChar = vertical ? '↑' : '←';
    const nextChar = vertical ? '↓' : '→';
    const btnPrev = document.getElementById('btnMoveTabPrev');
    const btnNext = document.getElementById('btnMoveTabNext');
    if(btnPrev){
      btnPrev.textContent = prevChar;
      btnPrev.setAttribute('aria-label', prevAria);
      btnPrev.title = prevLabel;
    }
    if(btnNext){
      btnNext.textContent = nextChar;
      btnNext.setAttribute('aria-label', nextAria);
      btnNext.title = nextLabel;
    }
    /* Mobile-Menü: ausgeschriebener Text wie zuvor */
    const optPrev = document.getElementById('optMoveTabPrev');
    const optNext = document.getElementById('optMoveTabNext');
    if(optPrev){
      optPrev.textContent = prevAria;
      optPrev.setAttribute('aria-label', prevAria);
    }
    if(optNext){
      optNext.textContent = nextAria;
      optNext.setAttribute('aria-label', nextAria);
    }
  }

  function renderTabs(){
    tabList.innerHTML = '';
    tabs.forEach(tab => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'tab-item' + (tab.id === activeTabId ? ' active' : '');
      btn.setAttribute('role', 'tab');
      btn.setAttribute('aria-selected', tab.id === activeTabId ? 'true' : 'false');
      btn.dataset.tabId = tab.id;
      btn.draggable = true;
      btn.onclick = () => { if(tab.id !== activeTabId) loadTab(tab.id); };

      const title = document.createElement('span');
      title.className = 'tab-title';
      title.textContent = tab.title;
      btn.appendChild(title);

      const close = document.createElement('button');
      close.type = 'button';
      close.className = 'tab-close';
      close.title = t('Tab schließen', 'tabs.close');
      close.setAttribute('aria-label', t('Tab schließen', 'tabs.close'));
      close.textContent = '×';
      close.draggable = false;
      close.onclick = e => closeTab(tab.id, e);
      btn.appendChild(close);

      btn.addEventListener('dragstart', e => {
        if(e.target.closest('.tab-close')){ e.preventDefault(); return; }
        tabDragId = tab.id;
        btn.classList.add('dragging');
        e.dataTransfer.effectAllowed = 'move';
        e.dataTransfer.setData('text/plain', tab.id);
        requestAnimationFrame(() => btn.classList.add('dragging'));
      });
      btn.addEventListener('dragend', () => {
        tabDragId = null; tabDragOverId = null; tabDragOverPos = null; clearTabDragStyles();
      });
      btn.addEventListener('dragover', e => {
        if(!tabDragId || tabDragId === tab.id) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        const rect = btn.getBoundingClientRect();
        const effectiveVertical = !isMobileLayout() && tabsOrientation === 'vertical';
        let pos;
        if(effectiveVertical){
          const mid = rect.top + rect.height / 2;
          pos = e.clientY < mid ? 'before' : 'after';
        } else {
          const mid = rect.left + rect.width / 2;
          pos = e.clientX < mid ? 'before' : 'after';
        }
        if(tabDragOverId !== tab.id || tabDragOverPos !== pos){
          clearTabDragStyles();
          const src = tabList.querySelector('.tab-item[data-tab-id="'+tabDragId+'"]');
          if(src) src.classList.add('dragging');
          btn.classList.add(pos === 'before' ? 'drag-over-before' : 'drag-over-after');
          tabDragOverId = tab.id;
          tabDragOverPos = pos;
        }
      });
      btn.addEventListener('dragleave', e => {
        if(!btn.contains(e.relatedTarget)) btn.classList.remove('drag-over-before', 'drag-over-after');
      });
      btn.addEventListener('drop', e => {
        e.preventDefault();
        const srcId = tabDragId || e.dataTransfer.getData('text/plain');
        const pos = tabDragOverPos || 'after';
        clearTabDragStyles();
        if(srcId) moveTabById(srcId, tab.id, pos);
        tabDragId = null; tabDragOverId = null; tabDragOverPos = null;
      });

      /* Touch long-press drag (wie Outline) */
      let tabLongPress = null;
      let tabTouchDragging = false;
      let tabTouchStartY = 0;
      let tabTouchStartX = 0;
      btn.addEventListener('touchstart', e => {
        if(e.touches.length !== 1 || e.target.closest('.tab-close')) return;
        tabTouchStartY = e.touches[0].clientY;
        tabTouchStartX = e.touches[0].clientX;
        tabTouchDragging = false;
        tabLongPress = setTimeout(() => {
          tabTouchDragging = true;
          tabDragId = tab.id;
          btn.classList.add('dragging');
          if(navigator.vibrate) try { navigator.vibrate(30); } catch(_){}
        }, 420);
      }, {passive: true});
      btn.addEventListener('touchmove', e => {
        if(!tabLongPress && !tabTouchDragging) return;
        const touch = e.touches[0];
        if(!tabTouchDragging){
          if(Math.abs(touch.clientY - tabTouchStartY) > 10 || Math.abs(touch.clientX - tabTouchStartX) > 10){
            clearTimeout(tabLongPress);
            tabLongPress = null;
          }
          return;
        }
        e.preventDefault();
        const el = document.elementFromPoint(touch.clientX, touch.clientY);
        const targetBtn = el && el.closest ? el.closest('.tab-item') : null;
        if(targetBtn && targetBtn.dataset.tabId && targetBtn.dataset.tabId !== tabDragId){
          const rect = targetBtn.getBoundingClientRect();
          const effectiveVertical = !isMobileLayout() && tabsOrientation === 'vertical';
          let pos;
          if(effectiveVertical){
            pos = touch.clientY < rect.top + rect.height / 2 ? 'before' : 'after';
          } else {
            pos = touch.clientX < rect.left + rect.width / 2 ? 'before' : 'after';
          }
          if(tabDragOverId !== targetBtn.dataset.tabId || tabDragOverPos !== pos){
            clearTabDragStyles();
            btn.classList.add('dragging');
            targetBtn.classList.add(pos === 'before' ? 'drag-over-before' : 'drag-over-after');
            tabDragOverId = targetBtn.dataset.tabId;
            tabDragOverPos = pos;
          }
        }
      }, {passive: false});
      btn.addEventListener('touchend', () => {
        clearTimeout(tabLongPress);
        tabLongPress = null;
        if(tabTouchDragging && tabDragId && tabDragOverId) moveTabById(tabDragId, tabDragOverId, tabDragOverPos || 'after');
        tabTouchDragging = false;
        tabDragId = null; tabDragOverId = null; tabDragOverPos = null;
        clearTabDragStyles();
      });
      btn.addEventListener('touchcancel', () => {
        clearTimeout(tabLongPress);
        tabLongPress = null;
        tabTouchDragging = false;
        tabDragId = null; tabDragOverId = null; tabDragOverPos = null;
        clearTabDragStyles();
      });

      tabList.appendChild(btn);
    });

    const addBtn = document.createElement('button');
    addBtn.type = 'button';
    addBtn.className = 'tab-new';
    addBtn.title = t('Neuer Tab', 'tabs.new');
    addBtn.setAttribute('aria-label', t('Neuer Tab', 'tabs.new'));
    addBtn.textContent = '+';
    addBtn.onclick = e => {
      e.stopPropagation();
      addNewTab(t('Prompt {n}', 'tabs.defaultTitle', {n: tabs.length+1}), []);
    };
    tabList.appendChild(addBtn);

    tabsShell.classList.remove('tabs-horizontal','tabs-vertical','tabs-hidden');
    /* Mobile: linke Tab-Leiste visuell wie oben (top); Parameter left bleibt gültig und persistent */
    const effectiveOrientation = isMobileLayout() ? 'horizontal' : tabsOrientation;
    if(!tabsVisible){
      tabsShell.classList.add('tabs-hidden');
      tabsShell.classList.add(effectiveOrientation === 'vertical' ? 'tabs-vertical' : 'tabs-horizontal');
    } else {
      tabsShell.classList.add(effectiveOrientation === 'vertical' ? 'tabs-vertical' : 'tabs-horizontal');
    }
    updateTabMoveButtonLabels();
    if(!_suppressHashWrite) writeHashState();
    updatePanelStructureTitle();
  }

  /* ===== Wiki & Menü-Positionierung ===== */
  async function fetchWikiText(lang,chars){
    const limit = Math.max(80, Math.min(2000, chars||450));
    let useLang = lang==='random' ? LANG_CODES[Math.floor(Math.random()*LANG_CODES.length)] : lang;
    const url = `https://${useLang}.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&prop=extracts|info&inprop=url&exintro&explaintext&exchars=${limit}&format=json&origin=*`;
    const res = await fetch(url); if(!res.ok) throw new Error(t('Netzwerkfehler', 'protocol.networkError'));
    const data = await res.json(); const pages = data.query?.pages;
    if(!pages) throw new Error(t('Keine Seite', 'protocol.noPage'));
    const page = Object.values(pages)[0];
    let extract = (page.extract||'').trim().replace(/\s+/g,' ');
    if(extract.endsWith('...')) extract = extract.slice(0,-3).trim();
    if(!extract || extract.length < 30) throw new Error(t('Text zu kurz', 'protocol.textTooShort'));
    return extract;
  }

  /**
   * Positioniert ein fixed-Menü am Button.
   * Bevorzugt unterhalb, sonst oberhalb, sonst ganz oben (Oberkante des Menüs).
   * Hängt das Menü an document.body, damit transform der Sheets nicht stört.
   */
  function positionMenu(btn, menu){
    if(menu.parentElement !== document.body){
      document.body.appendChild(menu);
    }
    menu.style.visibility = 'hidden';
    menu.classList.add('open');
    const rect = btn.getBoundingClientRect();
    const mh = menu.offsetHeight || 180;
    const mw = menu.offsetWidth || 220;
    let left = Math.min(rect.left, window.innerWidth - mw - 8);
    left = Math.max(8, left);
    let top = rect.bottom + 6;
    if(top + mh > window.innerHeight - 8){
      top = rect.top - mh - 6;
    }
    if(top < 8) top = 8;
    menu.style.left = left + 'px';
    menu.style.top = top + 'px';
    /* Z-Index dynamisch: über dem Stacking-Context des Buttons (z.B. Fokus-Editor 15000) */
    let z = 10000;
    let el = btn;
    while(el && el !== document.body){
      const cs = getComputedStyle(el);
      if(cs.position !== 'static'){
        const zi = parseInt(cs.zIndex, 10);
        if(!isNaN(zi) && zi > z) z = zi;
      }
      el = el.parentElement;
    }
    menu.style.zIndex = (z + 1);
    menu.style.visibility = '';
  }

    else if(e.key === 'ArrowUp') idx = Math.max(idx - 1, 0);

    items[idx].focus();

  /* ===== XML-Parsing / Serialisierung (unverändert in Logik) ===== */
  /* Vorlagen-Menü entfernt: „Bibliothek“ öffnet die externe Bibliothek */
  function renderTemplateMenus(){ /* keine eingebetteten Vorlagen mehr */ }
  const strayAmpRe = /&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g;
  function replaceStrayAmpersands(str,rep){ return (str||'').replace(strayAmpRe, rep); }
  function cleanParserErrorText(raw){
    let s = (raw || '').replace(/\s+/g, ' ').trim();
    s = s.replace(/\bAdresse:\s*\S+/gi, '');
    s = s.replace(/\bLocation:\s*\S+/gi, '');
    s = s.replace(/file:\/\/\/\S+/gi, '');
    s = s.replace(/https?:\/\/\S+/gi, '');
    s = s.replace(/This page contains the following errors:\s*/i, '');
    s = s.replace(/Below is a rendering of the page up to the first error\.?/gi, '');
    s = s.replace(/----+\^/g, '');
    s = s.replace(/:\s*<\/[^>]+>\s*$/g, '');
    return s.replace(/\s+/g, ' ').trim();
  }

  function extractXmlParserLocation(parserErrorEl){
    const raw = parserErrorEl ? (parserErrorEl.textContent || '') : '';
    const patterns = [
      /error on line\s+(\d+)\s+at column\s+(\d+)/i,
      /Line Number\s*(\d+)\s*,?\s*Column\s*(\d+)/i,
      /Zeile\s*Nr\.?\s*(\d+)\s*,\s*Spalte\s*(\d+)/i,
      /line(?:\s*number)?\s*(\d+)\s*,\s*column\s*(\d+)/i,
      /Zeile\s*(\d+)\s*,\s*Spalte\s*(\d+)/i
    ];
    let line = null, col = null;
    for(const re of patterns){
      const m = re.exec(raw);
      if(m){ line = parseInt(m[1],10); col = m[2] ? parseInt(m[2],10) : null; break; }
    }
    let message;
    const chromeMatch = /error on line\s+\d+\s+at column\s+\d+\s*:?\s*([^\n]*)/i.exec(raw);
    if(chromeMatch && chromeMatch[1]) message = chromeMatch[1];
    else message = raw.split(/Location:/i)[0].replace(/^XML Parsing Error:\s*/i, '');
    message = message.split(/\n/)[0].replace(/[-]{2,}\^.*$/, '').trim();
    return { line, col, detail: message };
  }

  /* Vor dem DOMParser: ungültige Tag-Namen (z.B. Ziffer am Anfang) → _prefix; Kommentare unangetastet */
  function rewriteInvalidXmlTagNames(xml){
    const renames = [];
    const map = new Map();
    function mapName(name){
      if(map.has(name)) return map.get(name);
      const fixed = sanitizeTagName(name);
      map.set(name, fixed);
      if(fixed !== name) renames.push({ from: name, to: fixed });
      return fixed;
    }
    const comments = [];
    let s = String(xml || '').replace(/<!--[\s\S]*?-->/g, m => {
      comments.push(m);
      return '\0C' + (comments.length - 1) + '\0';
    });
    s = s.replace(/<\/([^\s>]+)\s*>/g, (m, name) => {
      const fixed = mapName(name);
      return fixed === name ? m : ('</' + fixed + '>');
    });
    s = s.replace(/<([^\s>\/!?]+)(\s[^>]*)?(\/?)>/g, (m, name, attrs, slash) => {
      const fixed = mapName(name);
      if(fixed === name) return m;
      return '<' + fixed + (attrs || '') + (slash || '') + '>';
    });
    s = s.replace(/\0C(\d+)\0/g, (_, i) => comments[Number(i)] || '');
    return { xml: s, renames };
  }

  function parseXMLString(str){
    const raw = str || '';
    const leading = raw.match(/^\s*/)?.[0] || '';
    const leadingNL = (leading.match(/\n/g) || []).length;
    const rawTrim = raw.trim();
    if(!rawTrim) return { tree: [], errors: [], migrated: 0, renames: [] };

    const rewritten = rewriteInvalidXmlTagNames(rawTrim);
    const renames = rewritten.renames || [];

    const prefix = '<__root__>';
    const wrapped = prefix + replaceStrayAmpersands(rewritten.xml, '&amp;') + '</__root__>';
    const doc = new DOMParser().parseFromString(wrapped, 'text/xml');
    const pe = doc.querySelector('parsererror');

    if(pe){
      const loc = extractXmlParserLocation(pe);
      let line = loc.line;
      let col = loc.col;
      if(line != null){
        line = Math.max(1, line - 1 + leadingNL);
        if(line - leadingNL === 1 && col != null) col = Math.max(1, col - prefix.length);
      }
      const detail = cleanParserErrorText(loc.detail);
      let message;
      if(line != null){
        if(col != null && detail) message = t('XML ungültig – Zeile {line}, Spalte {col}: {detail}', 'protocol.invalidXmlLineColDetail', {line, col, detail});
        else if(col != null) message = t('XML ungültig – Zeile {line}, Spalte {col}', 'protocol.invalidXmlLineCol', {line, col});
        else if(detail) message = t('XML ungültig – Zeile {line}: {detail}', 'protocol.invalidXmlLineDetail', {line, detail});
        else message = t('XML ungültig – Zeile {line}', 'protocol.invalidXmlLine', {line});
      } else if(detail) message = t('XML ungültig: {detail}', 'protocol.invalidXmlDetail', {detail});
      else message = t('XML ungültig.', 'protocol.invalidXml');
      return { tree: null, errors: [message], migrated: 0, renames: [] };
    }

    let migrated = 0;
    const result = domChildNodesToNodes(doc.documentElement, (n) => { migrated += n; });
    if(!result.length && doc.documentElement.textContent.trim()){
      result.push(newNode('text', doc.documentElement.textContent.trim()));
    }
    return { tree: result, errors: [], migrated, renames };
  }

  function domChildNodesToNodes(el, onMigrate){
    const out = [];
    for(const c of Array.from(el.childNodes)){
      if(c.nodeType === 1) out.push(domElementToNode(c, onMigrate));
      else if(c.nodeType === 8){
        const t = (c.data||'').trim();
        if(t) out.push(newCommentNode(t));
      }
    }
    return out;
  }

  function domElementToNode(el, onMigrate){
    const node = newNode(sanitizeTagName(el.tagName || '') || 'element', '');
    const ordered = [];
    let textChunks = [];
    let hasElements = false;
    let hasNonEmptyText = false;

    for(const c of Array.from(el.childNodes)){
      if(c.nodeType === 1){
        hasElements = true;
        ordered.push({type:'el', el:c});
      } else if(c.nodeType === 3){
        const raw = c.textContent || '';
        if(raw.trim()){
          hasNonEmptyText = true;
          ordered.push({type:'text', text: raw});
          textChunks.push(raw);
        }
      } else if(c.nodeType === 8){
        const t = (c.data||'').trim();
        if(t) ordered.push({type:'comment', text:t});
      }
    }

    if(hasNonEmptyText && hasElements){
      const kids = [];
      const parentTag = (el.tagName || 'element').trim();
      const leafTag = parentTag ? (parentTag + '_text') : 'content';
      for(const item of ordered){
        if(item.type === 'text'){
          const cleaned = dedentText(item.text);
          if(cleaned){
            kids.push(newNode(leafTag, cleaned));
            if(typeof onMigrate === 'function') onMigrate(1);
          }
        } else if(item.type === 'el') kids.push(domElementToNode(item.el, onMigrate));
        else if(item.type === 'comment') kids.push(newCommentNode(item.text));
      }
      node.text = '';
      node.children = kids;
    } else if(hasElements){
      node.text = '';
      node.children = ordered
        .filter(i => i.type === 'el' || i.type === 'comment')
        .map(i => i.type === 'el' ? domElementToNode(i.el, onMigrate) : newCommentNode(i.text));
    } else {
      node.text = dedentText(textChunks.join(''));
      node.children = [];
    }
    return node;
  }

  function escapeXML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  /* XML-Name: erstes Zeichen muss Buchstabe oder _ sein – sonst sichtbar "_" voranstellen */
  function sanitizeTagName(raw){
    let s = String(raw == null ? '' : raw).replace(/\s+/g, '-');
    if(!s) return s;
    let startOk = false;
    try {
      startOk = /^[\p{L}_]/u.test(s.charAt(0));
    } catch(_) {
      startOk = /^[A-Za-z_]/.test(s.charAt(0));
    }
    if(!startOk) s = '_' + s;
    return s;
  }

  /* Entfernt Pretty-Print-Einrückung aus mehrzeiligem Text (Round-Trip ohne Zeichenaufblähung) */
  function dedentText(s){
    s = String(s || '');
    if(!s.includes('\n')) return s.trim();
    const lines = s.split('\n');
    /* führende/trailing Leerzeilen entfernen */
    while(lines.length && lines[0].trim() === '') lines.shift();
    while(lines.length && lines[lines.length - 1].trim() === '') lines.pop();
    if(!lines.length) return '';
    let minIndent = Infinity;
    lines.forEach(l => {
      if(l.trim() === '') return;
      const m = /^[ \t]*/.exec(l);
      if(m) minIndent = Math.min(minIndent, m[0].length);
    });
    if(!isFinite(minIndent) || minIndent === 0) return lines.join('\n').trim();
    return lines.map(l => l.trim() === '' ? '' : l.slice(minIndent)).join('\n').trim();
  }

  function serializeTree(nodes, depth){
    depth = depth||0; const pad = '  '.repeat(depth); let out = '';
    for(const node of nodes){
      if(node.kind === 'comment'){ const s = (node.text||'').trim().replace(/--/g,'- -'); if(s) out += pad+'<!-- '+s+' -->\n'; continue; }
      const tag = sanitizeTagName((node.tag && node.tag.trim()) || '') || 'element';
      const hasCh = node.children && node.children.length;
      /* getrimmt: keine überflüssigen Abstände; Tag-Einrückung bleibt über pad */
      const text = dedentText(node.text == null ? '' : String(node.text));
      if(hasCh){
        out += pad+'<'+tag+'>\n';
        if(text.length) out += (text.includes('\n') ? text.split('\n').map(l => pad+'  '+escapeXML(l)).join('\n') : pad+'  '+escapeXML(text))+'\n';
        out += serializeTree(node.children, depth+1)+pad+'</'+tag+'>\n';
      } else {
        if(text.includes('\n')) out += pad+'<'+tag+'>\n'+text.split('\n').map(l => pad+'  '+escapeXML(l)).join('\n')+'\n'+pad+'</'+tag+'>\n';
        else out += pad+'<'+tag+'>'+escapeXML(text)+'</'+tag+'>\n';
      }
    }
    return out;
  }
  function serializeFull(){ return '<prompt>\n'+serializeTree(S.tree,1)+'</prompt>'; }
  function getCopyResultText(){ return serializeFull().trim(); }

  function serializeGesamtConfig(){
    saveActiveTab();
    const parts = ['<!-- GESAMT-CONFIG -->'];
    tabs.forEach(tab => {
      const title = ((tab.title || 'Prompt') + '').replace(/--/g, '- -');
      parts.push('<!-- TAB: ' + title + ' -->');
      parts.push(('<prompt>\n' + serializeTree(tab.tree || [], 1) + '</prompt>').trim());
    });
    return parts.join('\n\n');
  }

  function serializeTreeWithLines(nodes, depth, state){
    depth = depth || 0;
    state = state || {lines: [''], map: {}};
    const pad = '  '.repeat(depth);
    for(const node of nodes){
      if(node.kind === 'comment'){
        const s = (node.text||'').trim().replace(/--/g,'- -');
        if(s){
          state.map[node.id] = state.lines.length;
          state.lines.push(pad + '<!-- ' + s + ' -->');
        }
        continue;
      }
      const tag = sanitizeTagName((node.tag && node.tag.trim()) || '') || 'element';
      const hasCh = node.children && node.children.length;
      const text = dedentText(node.text == null ? '' : String(node.text));
      state.map[node.id] = state.lines.length;
      if(hasCh){
        state.lines.push(pad + '<' + tag + '>');
        if(text.length){
          if(text.includes('\n')) text.split('\n').forEach(l => state.lines.push(pad + '  ' + escapeXML(l)));
          else state.lines.push(pad + '  ' + escapeXML(text));
        }
        serializeTreeWithLines(node.children, depth + 1, state);
        state.lines.push(pad + '</' + tag + '>');
      } else {
        if(text.includes('\n')){
          state.lines.push(pad + '<' + tag + '>');
          text.split('\n').forEach(l => state.lines.push(pad + '  ' + escapeXML(l)));
          state.lines.push(pad + '</' + tag + '>');
        } else {
          state.lines.push(pad + '<' + tag + '>' + escapeXML(text) + '</' + tag + '>');
        }
      }
    }
    return state;
  }

  function getLineMap(){
    const state = {lines: ['<prompt>'], map: {}};
    serializeTreeWithLines(S.tree, 1, state);
    state.lines.push('</prompt>');
    return state;
  }

  /* ===== Zeichenanzahl (Toggle: Zahl ↔ Label) ===== */
  function formatResultCharCount(n){
    n = Math.max(0, Math.floor(Number(n) || 0));
    if(n < 10000000) return String(n);
    const exp = Math.floor(Math.log10(n));
    let mant = n / Math.pow(10, exp);
    mant = Math.round(mant * 100) / 100;
    let mStr = mant.toFixed(2).replace('.', ',');
    if(mStr.endsWith(',00')) mStr = mStr.slice(0, -3);
    else if(mStr.endsWith('0')) mStr = mStr.slice(0, -1);
    return mStr + '*10^' + exp;
  }

  /* ===== Baum-Navigation ===== */
  function findNode(nodes, id){
    for(let i = 0; i < nodes.length; i++){
      if(nodes[i].id === id) return {node:nodes[i], arr:nodes, index:i};
      if(nodes[i].children && nodes[i].children.length){ const f = findNode(nodes[i].children, id); if(f) return f; }
    }
    return null;
  }
  function findPath(nodes, id, trail){
    trail = trail||[];
    for(const n of nodes){
      const t = trail.concat([n]);
      if(n.id === id) return t;
      if(n.children && n.children.length){ const f = findPath(n.children, id, t); if(f) return f; }
    }
    return null;
  }
  function findParentOfArray(nodes, arr){
    for(const n of nodes){
      if(n.children === arr) return n;
      if(n.children && n.children.length){
        const hit = findParentOfArray(n.children, arr);
        if(hit) return hit;
      }
    }
    return null;
  }
  function firstNavigableId(nodes){ return nodes.length ? nodes[0].id : null; }

  function selectAndShowDetail(id, doFocus){
