      function renderOutlineRow(node, depth){
        const wrap = document.createElement('div');
        const row = document.createElement('div');
        row.className = 'outline-row depth-'+Math.min(depth,4);
        row.style.paddingLeft = (8 + depth*14)+'px';
        if(node.id === selectedId) row.classList.add('selected');
        if(node._hasError) row.classList.add('error');
        row.dataset.id = node.id;
        row.setAttribute('role', 'treeitem');
        row.tabIndex = 0;
        row.draggable = true;
    
        row.onclick = (e) => {
          if(e.target.closest('.outline-open') || e.target.closest('.outline-chevron')) return;
          selectNode(node.id);
        };
        row.onkeydown = e => {
          if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectNode(node.id); }
        };
    
        row.addEventListener('dragstart', e => {
          dragId = node.id;
          row.classList.add('dragging');
          e.dataTransfer.effectAllowed = 'move';
          e.dataTransfer.setData('text/plain', node.id);
          requestAnimationFrame(() => row.classList.add('dragging'));
        });
        row.addEventListener('dragend', () => {
          dragId = null;
          dragOverId = null;
          dragOverPos = null;
          clearDragStyles();
        });
        row.addEventListener('dragover', e => {
          if(!dragId || !canDropOn(dragId, node.id)) return;
          e.preventDefault();
          e.dataTransfer.dropEffect = 'move';
          const rect = row.getBoundingClientRect();
          const mid = rect.top + rect.height / 2;
          const pos = e.clientY < mid ? 'above' : 'below';
          if(dragOverId !== node.id || dragOverPos !== pos){
            clearDragStyles();
            const srcRow = outlineList.querySelector('.outline-row[data-id="'+dragId+'"]');
            if(srcRow) srcRow.classList.add('dragging');
            row.classList.add(pos === 'above' ? 'drag-over-above' : 'drag-over-below');
            dragOverId = node.id;
            dragOverPos = pos;
          }
        });
        row.addEventListener('dragleave', e => {
          if(!row.contains(e.relatedTarget)){
            row.classList.remove('drag-over-above', 'drag-over-below');
          }
        });
        row.addEventListener('drop', e => {
          e.preventDefault();
          const srcId = dragId || e.dataTransfer.getData('text/plain');
          const pos = dragOverPos || 'below';
          clearDragStyles();
          if(srcId) performDrop(srcId, node.id, pos);
          dragId = null;
          dragOverId = null;
          dragOverPos = null;
        });
    
        row.addEventListener('touchstart', e => {
          if(e.touches.length !== 1) return;
          touchStartY = e.touches[0].clientY;
          isTouchDragging = false;
          longPressTimer = setTimeout(() => {
            isTouchDragging = true;
            dragId = node.id;
            row.classList.add('dragging');
            if(navigator.vibrate) try { navigator.vibrate(30); } catch(_){}
          }, 420);
        }, {passive: true});
    
        row.addEventListener('touchmove', e => {
          if(!longPressTimer && !isTouchDragging) return;
          const touch = e.touches[0];
          if(!isTouchDragging){
            if(Math.abs(touch.clientY - touchStartY) > 10){
              clearTimeout(longPressTimer);
              longPressTimer = null;
            }
            return;
          }
          e.preventDefault();
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          const targetRow = el && el.closest ? el.closest('.outline-row') : null;
          if(targetRow && targetRow.dataset.id && canDropOn(dragId, targetRow.dataset.id)){
            const rect = targetRow.getBoundingClientRect();
            const mid = rect.top + rect.height / 2;
            const pos = touch.clientY < mid ? 'above' : 'below';
            if(dragOverId !== targetRow.dataset.id || dragOverPos !== pos){
              clearDragStyles();
              row.classList.add('dragging');
              targetRow.classList.add(pos === 'above' ? 'drag-over-above' : 'drag-over-below');
              dragOverId = targetRow.dataset.id;
              dragOverPos = pos;
            }
          }
        }, {passive: false});
    
        row.addEventListener('touchend', e => {
          clearTimeout(longPressTimer);
          longPressTimer = null;
          if(isTouchDragging && dragId && dragOverId){
            performDrop(dragId, dragOverId, dragOverPos || 'below');
          }
          isTouchDragging = false;
          dragId = null;
          dragOverId = null;
          dragOverPos = null;
          clearDragStyles();
        });
    
        row.addEventListener('touchcancel', () => {
          clearTimeout(longPressTimer);
          longPressTimer = null;
          isTouchDragging = false;
          dragId = null;
          dragOverId = null;
          dragOverPos = null;
          clearDragStyles();
        });
    
        const hasCh = node.kind === 'element' && node.children && node.children.length;
        const chev = document.createElement('button');
        chev.className = 'outline-chevron'+(hasCh?'':' invisible');
        chev.setAttribute('aria-label', node.collapsed ? 'Aufklappen' : 'Zuklappen');
        chev.textContent = node.collapsed ? '▸' : '▾';
        chev.onclick = e => toggleCollapse(node.id, e);
        row.appendChild(chev);
        if(node.kind === 'comment'){
          const lab = document.createElement('span'); lab.className = 'outline-comment';
          lab.textContent = '💬 '+((node.text||'').trim().slice(0,32)||'Anmerkung'); row.appendChild(lab);
        } else {
          const lab = document.createElement('span'); lab.className = 'outline-tag'+(node.tag.trim()?'':' empty');
          lab.textContent = node.tag.trim()||'(ohne Namen)'; row.appendChild(lab);
          const prev = document.createElement('span'); prev.className = 'outline-preview'; prev.textContent = getPreviewText(node); row.appendChild(prev);
          if(hasCh){ const c = document.createElement('span'); c.className = 'outline-count'; c.textContent = node.children.length; row.appendChild(c); }
        }
    
        const openBtn = document.createElement('button');
        openBtn.type = 'button';
        openBtn.className = 'outline-open';
        openBtn.setAttribute('aria-label', 'Im Editor öffnen');
        openBtn.textContent = '›';
        openBtn.onclick = e => {
          e.stopPropagation();
          selectNode(node.id);
          openMobileDetail();
        };
        row.appendChild(openBtn);
    
        wrap.appendChild(row);
        if(hasCh && !node.collapsed) node.children.forEach(ch => wrap.appendChild(renderOutlineRow(ch, depth+1)));
        return wrap;
      }
    
      function render(){ renderOutline(); renderDetail(); updateSourceFromTree(); saveActiveTab(); }
    
      function renderDetail(){
        detailScroll.innerHTML = '';
    
        if(!tree.length){ detailScroll.appendChild(buildEmptyState()); return; }
        if(!selectedId || !findNode(tree, selectedId)) selectedId = firstNavigableId(tree);
        const found = selectedId ? findNode(tree, selectedId) : null;
        if(!found){ detailScroll.appendChild(buildEmptyState()); return; }
        const node = found.node;
        const path = findPath(tree, node.id)||[];
        const depth = path.length;
    
        detailScroll.appendChild(buildLevelBar(path, depth));
    
        if(node.kind === 'comment'){
          const head = document.createElement('div'); head.className = 'detail-heading-row';
          const h = document.createElement('span'); h.className = 'comment-heading'; h.textContent = '💬 Anmerkung';
          head.appendChild(h); detailScroll.appendChild(head);
        } else {
          const head = document.createElement('div'); head.className = 'detail-heading-row';
          const oa = document.createElement('span'); oa.className = 'detail-angle'; oa.textContent = '<';
          head.appendChild(oa);
          const tagInput = document.createElement('input');
          tagInput.className = 'detail-tag-input'; tagInput.type = 'text'; tagInput.value = node.tag;
          tagInput.placeholder = 'tag-name'; tagInput.autocomplete = 'off'; tagInput.spellcheck = false;
          tagInput.setAttribute('aria-label', 'Tag-Name');
          tagInput.oninput = e => { node.tag = e.target.value.replace(/\s+/g,'-'); e.target.value = node.tag; updateOutlineLabelFor(node.id, node.tag); updateSourceFromTree(); };
          head.appendChild(tagInput);
          const ca = document.createElement('span'); ca.className = 'detail-angle'; ca.textContent = '>';
          head.appendChild(ca);
          detailScroll.appendChild(head);
        }
    
        const tools = document.createElement('div'); tools.className = 'detail-tools';
    
        const moveGroup = document.createElement('div');
        moveGroup.className = 'move-group';
        const btnUp = document.createElement('button');
        btnUp.type = 'button';
        btnUp.className = 'btn small icon-only';
        btnUp.setAttribute('aria-label', 'Nach oben');
        btnUp.textContent = '↑';
        btnUp.onclick = () => { if(selectedId) moveNode(selectedId, -1); };
        const btnDown = document.createElement('button');
        btnDown.type = 'button';
        btnDown.className = 'btn small icon-only';
        btnDown.setAttribute('aria-label', 'Nach unten');
        btnDown.textContent = '↓';
        btnDown.onclick = () => { if(selectedId) moveNode(selectedId, 1); };
        moveGroup.appendChild(btnUp);
        moveGroup.appendChild(btnDown);
        tools.appendChild(moveGroup);
    
        const textareaWrap = document.createElement('div'); textareaWrap.className = 'detail-textarea-wrap';
        const textarea = document.createElement('textarea');
        textarea.className = 'detail-textarea char-count-field'+(node.kind==='comment'?' comment-style':'');
        textarea.placeholder = node.kind==='comment'?'Anmerkung…':'Text für dieses Element…';
        textarea.value = node.text||'';
        textarea.setAttribute('aria-label', node.kind==='comment' ? 'Kommentartext' : 'Elementtext');
        textarea.oninput = e => {
          node.text = e.target.value;
          if(node.kind === 'comment') updateOutlineLabelFor(node.id, null, node.text);
          else updateOutlinePreview(node.id, node.text);
          updateSourceFromTree();
        };
        textareaWrap.appendChild(textarea);
        tools.appendChild(createWikiSplitButton(textarea));
        detailScroll.appendChild(tools);
        detailScroll.appendChild(textareaWrap);
        attachCharCount(textarea);
    
        if(focusDetailField && shouldFocusDetail()){
          focusDetailField = false;
          const ti = detailScroll.querySelector('.detail-tag-input');
          const ta = detailScroll.querySelector('.detail-textarea');
          if(ti) ti.focus(); else if(ta) ta.focus();
        } else {
          focusDetailField = false;
        }
      }
    
      function buildLevelBar(path, depth){
        const bar = document.createElement('div'); bar.className = 'level-bar';
        const badge = document.createElement('div'); badge.className = 'level-badge';
        badge.innerHTML = '<span class="lvl-num">'+depth+'</span> Ebene '+depth;
        bar.appendChild(badge);
        const bc = document.createElement('div'); bc.className = 'breadcrumb';
        path.forEach((n,i) => {
          if(i > 0){ const s = document.createElement('span'); s.className = 'sep'; s.textContent = '›'; bc.appendChild(s); }
          const btn = document.createElement('button');
          btn.textContent = n.kind==='comment'?'💬':(n.tag.trim()||'(?)');
          if(i === path.length-1) btn.classList.add('current');
          btn.onclick = () => selectNode(n.id);
          bc.appendChild(btn);
        });
        bar.appendChild(bc);
    
        const closeBtn = document.createElement('button');
        closeBtn.type = 'button';
        closeBtn.className = 'detail-close';
        closeBtn.setAttribute('aria-label', 'Editor schließen');
        closeBtn.textContent = '×';
        closeBtn.onclick = () => closeMobileDetail();
        bar.appendChild(closeBtn);
    
        return bar;
      }
    
      function buildEmptyState(){
        const empty = document.createElement('div'); empty.className = 'detail-empty';
        empty.innerHTML = '<p>Wähle links ein Element aus oder lege unten ein neues an.</p>';
        return empty;
      }
    
      function updateOutlineLabelFor(id, tagValue, commentValue){
        const row = outlineList.querySelector('.outline-row[data-id="'+id+'"]'); if(!row) return;
        if(tagValue != null){ const lab = row.querySelector('.outline-tag'); if(lab){ const t = tagValue.trim(); lab.textContent = t||'(ohne Namen)'; lab.classList.toggle('empty', !t); } }
        if(commentValue != null){ const lab = row.querySelector('.outline-comment'); if(lab) lab.textContent = '💬 '+((commentValue||'').trim().slice(0,32)||'Anmerkung'); }
      }
      function updateOutlinePreview(id, text){
        const row = outlineList.querySelector('.outline-row[data-id="'+id+'"]'); if(!row) return;
        const p = row.querySelector('.outline-preview'); if(p) p.textContent = (text||'').trim().slice(0,36);
      }
    
      function updateSourceFromTree(){
        if(!sourceFocused) sourceText.value = serializeFull().trim();
        updateResultCharCount();
      }
      function applySourceToTree(){
        const {tree:parsed, errors} = parseXMLString(sourceText.value);
        if(errors.length){ showBanner('error', errors); return; }
        if(parsed.length === 1 && parsed[0].kind === 'element' && (parsed[0].tag||'').toLowerCase() === 'prompt') tree = parsed[0].children;
        else tree = parsed;
        selectedId = firstNavigableId(tree); hideBanner(); render();
      }
    
      const tagNameRe = /^[A-Za-z_][A-Za-z0-9_.\-]*$/;
      function clearErrorFlags(nodes){ nodes.forEach(n => { n._hasError = false; if(n.children) clearErrorFlags(n.children); }); }
      function validateTree(){
        const issues = [];
        (function walk(nodes){ nodes.forEach(n => {
          if(n.kind === 'comment') return;
          const t = (n.tag||'').trim();
          if(!t) issues.push({id:n.id, message:'Element ohne Tag-Namen.'});
          else if(!tagNameRe.test(t)) issues.push({id:n.id, message:'„'+t+'" ungültig.'});
          if(n.children && n.children.length) walk(n.children);
        }); })(tree);
        return issues;
      }
      function runValidation(){
        clearErrorFlags(tree); const issues = validateTree();
        if(!issues.length){ showBanner('ok',['Keine Fehler.']); renderOutline(); return; }
        issues.forEach(i => { const f = findNode(tree, i.id); if(f) f.node._hasError = true; });
        renderOutline(); showBannerClickable(issues);
      }
      function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
    
      function bannerCloseBtn(){
        const btn = document.createElement('button');
        btn.type = 'button'; btn.className = 'banner-close'; btn.setAttribute('aria-label','Schließen');
        btn.innerHTML = '✕'; btn.onclick = hideBanner;
        return btn;
      }
      function showBanner(type, msgs){
        validationBanner.className = 'banner show '+type;
        validationBanner.innerHTML = '<strong>'+(type==='error'?'Achtung':'Alles gut')+'</strong><ul>'+
          msgs.map(m => '<li style="cursor:default;text-decoration:none;">'+escapeHTML(m)+'</li>').join('')+'</ul>';
        validationBanner.appendChild(bannerCloseBtn());
      }
      function showBannerClickable(issues){
        validationBanner.className = 'banner show error';
        validationBanner.innerHTML = '<strong>'+issues.length+' zu prüfen</strong><ul></ul>';
        const ul = validationBanner.querySelector('ul');
        issues.forEach(issue => {
          const li = document.createElement('li'); li.textContent = issue.message+' (springen)';
          li.onclick = () => { selectNode(issue.id); const row = outlineList.querySelector('.outline-row[data-id="'+issue.id+'"]'); if(row) row.scrollIntoView({behavior:'smooth', block:'center'}); };
          ul.appendChild(li);
        });
        validationBanner.appendChild(bannerCloseBtn());
      }
      function hideBanner(){ validationBanner.className = 'banner'; validationBanner.innerHTML = ''; }
    
      function resetAll(){
        if(tree.length && !confirm('Alles löschen?')) return;
        tree = []; selectedId = null; hideBanner(); closeSheet(true); render();
      }
      function copySource(){ sourceText.select(); navigator.clipboard.writeText(sourceText.value).then(() => flashButton('btnCopySource','✓')).catch(() => document.execCommand('copy')); }
      function copyResult(){
        const xml = serializeFull().trim();
        navigator.clipboard.writeText(xml).then(() => flashButton('btnCopyResult','✓ Kopiert'))
          .catch(() => { const t = document.createElement('textarea'); t.value = xml; document.body.appendChild(t); t.select(); document.execCommand('copy'); document.body.removeChild(t); flashButton('btnCopyResult','✓'); });
      }
      function flashButton(id, label){ const b = document.getElementById(id); if(!b) return; const o = b.textContent; b.textContent = label; setTimeout(() => b.textContent = o, 1300); }
      function setSourceLabels(open){
        const label = open ? 'XML ausblenden' : 'XML anzeigen';
        const desk = document.getElementById('btnToggleSource');
        const mob = document.getElementById('optToggleSource');
        if(desk) desk.textContent = label;
        if(mob) mob.textContent = label;
      }
    
      function toggleSourcePanel(){
        if(isMobileLayout()){
          if(activeSheet === 'source' || sourcePanel.classList.contains('mobile-open')){
            closeSheet(false);
          } else {
            openSheet('source');
          }
          return;
        }
        /* Desktop: klassisches Ein-/Ausblenden (Nebeneinander-Layout) */
        activeSheet = null;
        mobileDetailOpen = false;
        sourcePanel.classList.remove('mobile-open');
        applySheetChrome(false);
        ensureDetailParent();
        clearSheetInlineGeometry();
        const detailCol = document.getElementById('detailCol');
        if(detailCol){
          detailCol.classList.remove('mobile-open', 'sheet-dormant');
          detailCol.removeAttribute('aria-hidden');
        }
        sourcePanel.classList.remove('mobile-open', 'sheet-dormant');
        sourcePanel.removeAttribute('aria-hidden');
        sourcePanel.style.transform = '';
        sourcePanel.style.zIndex = '';
        sourcePanel.style.pointerEvents = '';
        const showing = sourcePanel.style.display !== 'none' && sourcePanel.style.display !== '';
        if(showing){
          sourcePanel.style.display = 'none';
          layout.classList.remove('with-source');
          setSourceLabels(false);
        } else {
          sourcePanel.style.display = 'flex';
          layout.classList.add('with-source');
          setSourceLabels(true);
          updateSourceFromTree();
        }
      }
      function toggleAmpPanel(){ ampPanel.style.display = ampPanel.style.display !== 'none' ? 'none' : 'block'; }
      function applyAmpFix(rep){ if(!rep) return; sourceText.value = replaceStrayAmpersands(sourceText.value, rep); applySourceToTree(); ampPanel.style.display = 'none'; }
    
      document.getElementById('btnExample').onclick = e => {
        e.stopPropagation();
        loadTemplate('example');
      };
      document.getElementById('btnTemplateCaret').onclick = e => {
        e.stopPropagation();
        const menu = document.getElementById('templateMenu');
        const isOpen = menu.classList.contains('open');
        closeAllWikiMenus();
        closeTemplateMenu();
        closeOptionsMenu();
        if(!isOpen){
          const btn = document.getElementById('btnTemplateCaret');
          const rect = btn.getBoundingClientRect();
          menu.style.left = Math.min(rect.left, window.innerWidth-240)+'px';
          menu.style.top = (rect.bottom+6)+'px';
          menu.classList.add('open');
          openTemplateMenu = menu;
        }
      };
      document.querySelectorAll('#templateMenu .tpl-item').forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          loadTemplate(btn.dataset.tpl);
        };
      });
    
      document.getElementById('btnOptions').onclick = e => {
        e.stopPropagation();
        const menu = document.getElementById('optionsMenu');
        const btn = document.getElementById('btnOptions');
        const isOpen = menu.classList.contains('open');
        closeAllWikiMenus();
        closeTemplateMenu();
        closeOptionsMenu();
        if(!isOpen){
          const rect = btn.getBoundingClientRect();
          menu.style.left = Math.min(rect.left, window.innerWidth-240)+'px';
          menu.style.top = (rect.bottom+6)+'px';
          menu.classList.add('open');
          btn.setAttribute('aria-expanded', 'true');
          openOptionsMenu = menu;
        }
      };
      document.querySelectorAll('#optionsMenu .opt-item[data-tpl]').forEach(btn => {
        btn.onclick = e => {
          e.stopPropagation();
          loadTemplate(btn.dataset.tpl);
        };
      });
      document.getElementById('optValidate').onclick = e => {
        e.stopPropagation();
        closeOptionsMenu();
        runValidation();
      };
      document.getElementById('optToggleSource').onclick = e => {
        e.stopPropagation();
        closeOptionsMenu();
        toggleSourcePanel();
      };
      document.getElementById('btnResetMobile').onclick = resetAll;
    
      document.getElementById('btnAddRoot').onclick = addRootNode;
      document.getElementById('btnAddRootComment').onclick = addRootComment;
      document.getElementById('btnAddUser').onclick = () => addTemplate('user');
      document.getElementById('btnAddAssistant').onclick = () => addTemplate('assistant');
      document.getElementById('btnAddChild').onclick = () => {
        if(selectedId){
          const f = findNode(tree, selectedId);
          if(f && f.node.kind === 'element') addChild(selectedId, false);
        }
      };
      document.getElementById('btnDelete').onclick = () => {
        if(selectedId && confirm('Wirklich löschen?')) deleteNode(selectedId);
      };
      document.getElementById('btnValidate').onclick = runValidation;
      document.getElementById('btnReset').onclick = resetAll;
      document.getElementById('btnToggleSource').onclick = toggleSourcePanel;
      document.getElementById('btnApplySource').onclick = applySourceToTree;
      document.getElementById('btnCopySource').onclick = copySource;
      document.getElementById('btnCopyResult').onclick = copyResult;
      document.getElementById('btnFixAmp').onclick = toggleAmpPanel;
      document.getElementById('btnSourceClose').onclick = () => {
        if(isMobileLayout()) closeSheet(false);
        else {
          sourcePanel.style.display = 'none';
          layout.classList.remove('with-source');
          setSourceLabels(false);
        }
      };
      document.querySelectorAll('.amp-options .btn').forEach(b => b.onclick = () => applyAmpFix(b.dataset.amp));
      document.getElementById('btnAmpCustomApply').onclick = () => { const v = document.getElementById('ampCustomInput').value; if(v) applyAmpFix(v); };
      sourceText.onfocus = () => sourceFocused = true; sourceText.onblur = () => sourceFocused = false;
    
      window.addEventListener('hashchange', () => {
        readHashState();
        readShowCharacterCount();
        renderTabs();
      });
    
      window.addEventListener('resize', () => {
        if(!isMobileLayout()){
          closeSheet(true);
          if(sourcePanel.style.display !== 'none' && !layout.classList.contains('with-source')){
            sourcePanel.style.display = 'none';
          }
          sourcePanel.classList.remove('mobile-open');
          applySheetChrome(false);
          ensureDetailParent();
          clearSheetInlineGeometry();
        } else {
          ensureDetailParent();
          if(activeSheet) updateMobileSheetMetrics();
        }
      });
    
      readHashState();
      writeHashState(); /* alle Parameter immer in der URL; Default nur wenn zuvor fehlte */
    
      idCounter = 1;
      const first = createTabState('Prompt 1', []);
      tabs = [first];
      activeTabId = first.id;
      tree = first.tree;
      selectedId = first.selectedId;
      idCounter = first.idCounter;
      bindOutlineScroll();
      ensureDetailParent();
      if(isMobileLayout()){
        updateMobileSheetMetrics();
        putAllSheetsDormant();
      }
      readShowCharacterCount();
      renderTabs();
      render();
      updateResultCharCount();
    })();
    </script>
    </body>
    </html>
