  /* ===== showConfirm: Bestätigungs-Dialog statt native confirm() ===== */
  let confirmCallback = null;
  function showConfirm(message, onConfirm){
    const panel = document.getElementById('confirmPanel');
    const overlay = document.getElementById('confirmOverlay');
    const msg = document.getElementById('confirmMessage');
    if(!panel || !overlay || !msg) return;
    msg.textContent = message;
    confirmCallback = typeof onConfirm === 'function' ? onConfirm : null;
    overlay.hidden = false;
    overlay.classList.add('open');
    panel.hidden = false;
    panel.classList.add('open');
    document.body.style.overflow = 'hidden';
    /* Fokus auf „Abbrechen" (nicht auf Textfeld – vermeidet Mobile-Tastatur) */
    const cancelBtn = document.getElementById('btnConfirmCancel');
    if(cancelBtn) cancelBtn.focus();
  }

  function closeConfirm(confirmed){
    const panel = document.getElementById('confirmPanel');
    const overlay = document.getElementById('confirmOverlay');
    if(panel){ panel.classList.remove('open'); panel.hidden = true; }
    if(overlay){ overlay.classList.remove('open'); overlay.hidden = true; }
    const cb = confirmCallback;
    confirmCallback = null;
    if(!isProtocolOpen() && !isLanguagePanelOpen() && !isSettingsOpen()) document.body.style.overflow = '';
    if(confirmed && cb) cb();
  }

  /* Bedingte Bestätigung: wenn condition true, showConfirm; sonst sofort callback */
  function maybeConfirm(condition, message, callback){
    if(!condition){ if(typeof callback === 'function') callback(); return; }
    showConfirm(message, callback);
  }

  (function wireConfirmUi(){
    const cancel = document.getElementById('btnConfirmCancel');
    const ok = document.getElementById('btnConfirmOk');
    const overlay = document.getElementById('confirmOverlay');
    if(cancel) cancel.onclick = () => closeConfirm(false);
    if(ok) ok.onclick = () => closeConfirm(true);
    if(overlay) overlay.onclick = () => closeConfirm(false);
    document.addEventListener('keydown', e => {
      if(e.key === 'Escape' && document.getElementById('confirmPanel') && document.getElementById('confirmPanel').classList.contains('open')){
        e.preventDefault();
        closeConfirm(false);
      }
    });
  })();

  /* ===== Warnungs-Einstellungen & Paste-Warn-Dialog ===== */
  const WARN_TOGGLE_DEFS = [
    { key: 'warnPromptEntryDelete', get: () => warnPromptEntryDelete, set: v => { warnPromptEntryDelete = v; }, labelKey: 'warnings.entryDelete', labelDe: 'Beim Löschen von Struktur-Einträgen' },
    { key: 'warnPromptTabReset', get: () => warnPromptTabReset, set: v => { warnPromptTabReset = v; }, labelKey: 'warnings.tabReset', labelDe: 'Beim Zurücksetzen des Prompts' },
    { key: 'warnPromptTabClose', get: () => warnPromptTabClose, set: v => { warnPromptTabClose = v; }, labelKey: 'warnings.tabClose', labelDe: 'Beim Schließen eines Prompt-Tabs' },
    { key: 'warnBrowserTabClose', get: () => warnBrowserTabClose, set: v => { warnBrowserTabClose = v; }, labelKey: 'warnings.browserClose', labelDe: 'Beim Schließen der Website' },
    { key: 'warnBeforePastingText', get: () => warnBeforePastingText, set: v => { warnBeforePastingText = v; }, labelKey: 'warnings.pasteLarge', labelDe: 'Bei sehr großen Einfügeaktionen' }
  ];

  function buildWarningsChecklist(container){
    if(!container) return;
    container.innerHTML = '';
    container.classList.add('warnings-menu');
    WARN_TOGGLE_DEFS.forEach(def => {
      const lab = document.createElement('label');
      lab.className = 'warn-check';
      const cb = document.createElement('input');
      cb.type = 'checkbox';
      cb.dataset.warnKey = def.key;
      cb.checked = !!def.get();
      cb.addEventListener('change', () => {
        def.set(!!cb.checked);
        writeHashState();
        syncWarningsChecklists();
      });
      const span = document.createElement('span');
      span.textContent = t(def.labelDe, def.labelKey);
      lab.appendChild(cb);
      lab.appendChild(span);
      container.appendChild(lab);
    });
    const sep2 = document.createElement('div');
    sep2.className = 'opt-sep';
    container.appendChild(sep2);

    const persistLab = document.createElement('label');
    persistLab.className = 'warn-check';
    const persistCb = document.createElement('input');
    persistCb.type = 'checkbox';
    persistCb.dataset.persistDrafts = '1';
    persistCb.checked = !!persistDrafts;
    persistCb.addEventListener('change', () => {
      persistDrafts = !!persistCb.checked;
      writeHashState();
      /* Opt-In an: sofort speichern. Opt-Out: localStorage bleibt bis manueller Löschen-Button */
      if(persistDrafts){
        try { saveDraftNow(); } catch(_){}
      }
      renderWarningsMenus();
    });
    const persistSpan = document.createElement('span');
    persistSpan.textContent = t(
      'Entwürfe im lokalen Browser-Speicher sichern',
      'drafts.persist'
    );
    persistLab.appendChild(persistCb);
    persistLab.appendChild(persistSpan);
    container.appendChild(persistLab);

    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'opt-item';
    clearBtn.textContent = t('Gespeicherte Entwürfe löschen', 'drafts.clear');
    clearBtn.disabled = !hasLocalDraft();
    clearBtn.addEventListener('click', e => {
      e.stopPropagation();
      if(!hasLocalDraft()){
        const prev = clearBtn.textContent;
        clearBtn.textContent = t('Nichts gespeichert', 'drafts.clearEmpty');
        setTimeout(() => { clearBtn.textContent = prev; }, 1300);
        return;
      }
      clearLocalDraft();
      const prev = clearBtn.textContent;
      clearBtn.textContent = t('✓ Gelöscht', 'drafts.cleared');
      clearBtn.disabled = true;
      setTimeout(() => {
        clearBtn.textContent = prev;
        clearBtn.disabled = !hasLocalDraft();
      }, 1300);
    });
    container.appendChild(clearBtn);

    const sep3 = document.createElement('div');
    sep3.className = 'opt-sep';
    container.appendChild(sep3);

    const resetSettingsBtn = document.createElement('button');
    resetSettingsBtn.type = 'button';
    resetSettingsBtn.className = 'opt-item';
    resetSettingsBtn.textContent = t('Auf Standardwerte zurücksetzen', 'warnings.resetSettings');
    resetSettingsBtn.addEventListener('click', e => {
      e.stopPropagation();
      maybeConfirm(true, t('Alle Einstellungen zurücksetzen?', 'warnings.confirmResetSettings'), () => {
        history.replaceState(null, '', location.pathname + location.search);
        location.reload();
      });
    });
    container.appendChild(resetSettingsBtn);
  }

  function syncWarningsChecklists(){
    document.querySelectorAll('.warnings-menu input[type="checkbox"]').forEach(cb => {
      if(cb.dataset.warnKey){
        const def = WARN_TOGGLE_DEFS.find(d => d.key === cb.dataset.warnKey);
        if(def) cb.checked = !!def.get();
      } else if(cb.dataset.persistDrafts){
        cb.checked = !!persistDrafts;
      }
    });
  }

  function renderWarningsMenus(){
    const desk = document.getElementById('warningsMenuDesktop');
    if(desk){
      desk.hidden = false;
      buildWarningsChecklist(desk);

    const mob = document.getElementById('warningsMenuMobileBody');

  /* ===== Einstellungen-Panel (ersetzt Warnungs-Menü) ===== */
  function isSettingsOpen(){ const p = document.getElementById('settingsPanel'); return p && p.classList.contains('open'); }

  function openSettingsPanel(){

  function createSettingsNumRow(label, key, value, min, max, step, onChange){
    const row = document.createElement('div');
    row.className = 'settings-row';
    const lab = document.createElement('div');
    lab.className = 'settings-label';
    lab.textContent = label;
    const input = document.createElement('input');
    input.type = 'number';
    input.className = 'settings-num-input';
    input.value = value;
    if(min != null) input.min = min;
    if(max != null) input.max = max;
    if(step != null) input.step = step;
    input.addEventListener('change', () => {
      let n = parseInt(input.value, 10);

      if(min != null && n < min) n = min;
      if(max != null && n > max) n = max;
      input.value = n;
      onChange(n);
    });
    row.appendChild(lab);
    row.appendChild(input);
    return row;
  }

      const ta = pendingPaste.target;
      const text = pendingPaste.text || '';
      const replaceAll = !!pendingPaste.replaceAll;
      if(replaceAll && typeof pushEditorUndo === 'function' && typeof setEditorValue === 'function'){
        pushEditorUndo(ta);
        const len = text.length;

        insertTextInEditor(ta, text);
      } else {
        const start = ta.selectionStart || 0;
        const end = ta.selectionEnd || 0;
        const val = ta.value || '';
        ta.value = val.slice(0, start) + text + val.slice(end);
        const pos = start + text.length;
        try { ta.setSelectionRange(pos, pos); } catch(_){}
        ta.dispatchEvent(new Event('input', { bubbles: true }));

  /* ===== Textfeld-Enhancements – Undo/Redo nach VS-Code-Verhalten (kein Zeit-Debounce) ===== */
  function editorHistKey(el){
    return el.dataset.historyKey || el.id || ('anon-' + (el._histAnonId || (el._histAnonId = String(Math.random()).slice(2))));
  }

  const EditKind = {
    Other: 'Other',
    DeleteBackward: 'DeleteBackward',
    DeleteForward: 'DeleteForward',
    TypeChar: 'TypeChar',
    TypeFirstSpace: 'TypeFirstSpace',
    TypeConsecutiveSpace: 'TypeConsecutiveSpace'
  };

  function isTypingKind(kind){
    return kind === EditKind.TypeChar || kind === EditKind.TypeFirstSpace || kind === EditKind.TypeConsecutiveSpace;
  }

  function normalizeEditKind(kind){
    if(kind === EditKind.TypeFirstSpace || kind === EditKind.TypeConsecutiveSpace) return 'SPACE';
    return kind;
  }

  function classifyTypeChar(ch, prevKind){
    if(ch === ' ' || ch === '\u00a0'){
      if(prevKind === EditKind.TypeFirstSpace || prevKind === EditKind.TypeConsecutiveSpace){
        return EditKind.TypeConsecutiveSpace;
      }
      return EditKind.TypeFirstSpace;
    }
    return EditKind.TypeChar;
  }

  function shouldStartNewGroup(prevKind, newKind){
    if(isTypingKind(prevKind) && !isTypingKind(newKind)) return true;
    if(prevKind === EditKind.TypeFirstSpace) return false;
    return normalizeEditKind(prevKind) !== normalizeEditKind(newKind);
  }

  function shouldStartNewGroupForDelete(prevKind, newDeleteKind, spansLineBreak){
    if(spansLineBreak) return true;
    return prevKind !== newDeleteKind;
  }

  function computeTextChange(oldStr, newStr){
    oldStr = String(oldStr || '');
    newStr = String(newStr || '');
    let start = 0;
    const oldLen = oldStr.length;
    const newLen = newStr.length;
    while(start < oldLen && start < newLen && oldStr.charAt(start) === newStr.charAt(start)) start++;
    let endOld = oldLen;
    let endNew = newLen;
    while(endOld > start && endNew > start && oldStr.charAt(endOld - 1) === newStr.charAt(endNew - 1)){
      endOld--;
      endNew--;
    }
    return {
      rangeStart: start,
      rangeEnd: endOld,
      deletedText: oldStr.slice(start, endOld),
      insertedText: newStr.slice(start, endNew)
    };
  }

  function applyTextChange(value, ch){
    return value.slice(0, ch.rangeStart) + ch.insertedText + value.slice(ch.rangeEnd);
  }

  function invertTextChange(ch){
    return {
      rangeStart: ch.rangeStart,
      rangeEnd: ch.rangeStart + (ch.insertedText ? ch.insertedText.length : 0),
      deletedText: ch.insertedText || '',
      insertedText: ch.deletedText || ''
    };
  }


  function getEditorHist(el){
    const key = editorHistKey(el);
    let h = editorHistMap.get(key);
    if(!h){
      h = {
        past: [],
        future: [],
        isOpen: false,
        prevKind: EditKind.Other,
        pendingBefore: null,
        pendingKind: null,
        versionCounter: 0,
        versionMark: 0,
        applying: false,
        stackId: 1
      };
      editorHistMap.set(key, h);
    }
    return h;
  }

  function applyPasteFormat(text){
    return String(text == null ? '' : text)
      .replace(/\r\n/g, '\n')
      .replace(/\r/g, '\n');
  }

  function closeOpenStackElement(h){
    if(h.isOpen && h.past.length) h.isOpen = false;
    h.pendingBefore = null;
    h.pendingKind = null;
  }

  function pushNewStackElement(h, label, beforeSel, afterSel, changes, beforeMark){
    h.versionCounter++;
    h.versionMark = h.versionCounter;
    h.past.push({
      id: h.stackId++,
      label: label || 'Edit',
      beforeVersionMark: beforeMark != null ? beforeMark : (h.versionMark - 1),
      afterVersionMark: h.versionMark,
      beforeSelections: [beforeSel],
      afterSelections: [afterSel],
      changes: changes
    });
    h.isOpen = true;
    h.future.length = 0;
    while(h.past.length > EDITOR_UNDO_LIMIT) h.past.shift();
  }

  function appendToOpenElement(h, afterSel, changes){
    if(!h.past.length) return false;
    const el = h.past[h.past.length - 1];
    el.changes = el.changes.concat(changes);
    el.afterSelections = [afterSel];
    h.versionCounter++;
    h.versionMark = h.versionCounter;
    el.afterVersionMark = h.versionMark;
    h.future.length = 0;
    return true;
  }

  function classifyFromBeforeInput(e, prevKind){
    const it = e && e.inputType ? String(e.inputType) : '';
    if(it === 'historyUndo' || it === 'historyRedo') return null;
    if(it === 'insertLineBreak' || it === 'insertParagraph') return EditKind.Other;
    if(it === 'insertFromPaste' || it === 'insertFromDrop' || it === 'insertReplacementText') return EditKind.Other;
    if(it.indexOf('delete') === 0){
      if(it === 'deleteContentForward' || it === 'deleteWordForward' || it === 'deleteSoftLineForward'){
        return EditKind.DeleteForward;
      }
      return EditKind.DeleteBackward;
    }
    if(it === 'insertText' || it === 'insertCompositionText'){
      const data = e.data != null ? String(e.data) : '';
      if(data.length === 1) return classifyTypeChar(data, prevKind);
      if(data.length === 0) return EditKind.TypeChar;
      return EditKind.Other;
    }
    return EditKind.Other;
  }

  function getEditorValue(el){
    return el ? (el.value || '') : '';
  }

  function getEditorSelection(el){
    if(!el) return { start: 0, end: 0 };
    return { start: el.selectionStart || 0, end: el.selectionEnd || 0 };
  }

  function setEditorSelection(el, start, end){
    if(!el) return;
    try { el.setSelectionRange(start, end == null ? start : end); } catch(_){}
  }

  /* Zentrale Schreib-API für alle Textfelder */
  function setEditorValue(el, value, selStart, selEnd){
    const h = getEditorHist(el);
    h.applying = true;
    const val = value == null ? '' : String(value);
    const len = val.length;
    const s = Math.max(0, Math.min(selStart == null ? len : selStart, len));
    const e = Math.max(0, Math.min(selEnd == null ? s : selEnd, len));
    el.value = val;
    try { el.setSelectionRange(s, e); } catch(_){}
    try { el.dispatchEvent(new Event('input', { bubbles: true })); } catch(_){}
    h.applying = false;
    updateDetailFieldCharCount(el);
  }

  function replaceEditorRange(el, from, to, text, cursorPos){
    text = text == null ? '' : String(text);
    const val = el.value || '';
    const next = val.slice(0, from) + text + val.slice(to);
    const pos = cursorPos != null ? cursorPos : (from + text.length);
    setEditorValue(el, next, pos, pos);
  }

  /* Vor programmatischer/isolierter Aktion: offene Gruppe schließen, Snapshot als eigene Gruppe optional nicht nötig */
  function pushEditorUndo(el){
    const h = getEditorHist(el);
    if(h.applying) return;
    closeOpenStackElement(h);
    h.prevKind = EditKind.Other;
    h.pendingBefore = {
      value: getEditorValue(el),
      sel: getEditorSelection(el),
      mark: h.versionMark
    };
    h.pendingKind = EditKind.Other;
  }

  function commitEditorBaseline(el){
    const h = getEditorHist(el);
    if(h.applying) return;
    if(h.pendingBefore){
      const afterVal = getEditorValue(el);
      if(afterVal !== h.pendingBefore.value){
        const ch = computeTextChange(h.pendingBefore.value, afterVal);
        pushNewStackElement(h, 'Edit', h.pendingBefore.sel, getEditorSelection(el), [ch], h.pendingBefore.mark);
        h.isOpen = false;
      }
      h.pendingBefore = null;
      h.pendingKind = null;
    }
    closeOpenStackElement(h);
    h.prevKind = EditKind.Other;
  }

  function onEditorBeforeInput(el, e){
    const h = getEditorHist(el);
    if(h.applying) return;
    if(e && (e.inputType === 'historyUndo' || e.inputType === 'historyRedo')){
      e.preventDefault();
      if(e.inputType === 'historyUndo') editorUndo(el);
      else editorRedo(el);
      return;
    }
    const kind = classifyFromBeforeInput(e, h.prevKind) || EditKind.Other;
    h.pendingBefore = {
      value: getEditorValue(el),
      sel: getEditorSelection(el),
      mark: h.versionMark
    };
    h.pendingKind = kind;
  }

  function onEditorInputForHistory(el, e){
    const h = getEditorHist(el);
    if(h.applying) return;
    const afterVal = getEditorValue(el);
    const afterSel = getEditorSelection(el);
    const before = h.pendingBefore || { value: afterVal, sel: afterSel, mark: h.versionMark };
    const kind = h.pendingKind || EditKind.Other;
    h.pendingBefore = null;
    h.pendingKind = null;

    if(before.value === afterVal) return;
    const ch = computeTextChange(before.value, afterVal);
    const spansLineBreak = (ch.deletedText && ch.deletedText.indexOf('\n') !== -1) ||
      (ch.insertedText && ch.insertedText.indexOf('\n') !== -1);

    let startNew = true;
    if(kind === EditKind.DeleteBackward || kind === EditKind.DeleteForward){
      startNew = !h.isOpen || shouldStartNewGroupForDelete(h.prevKind, kind, spansLineBreak);
    } else if(isTypingKind(kind)){
      startNew = !h.isOpen || shouldStartNewGroup(h.prevKind, kind);
    } else {
      startNew = true;
    }

    if(startNew){
      closeOpenStackElement(h);
      pushNewStackElement(h, kind, before.sel, afterSel, [ch], before.mark);
      if(kind === EditKind.Other || kind === EditKind.DeleteBackward || kind === EditKind.DeleteForward){
        /* isolierte Ops: sofort schließen, außer reines Tippen/Löschen-Serien */
        if(!isTypingKind(kind) && kind !== EditKind.DeleteBackward && kind !== EditKind.DeleteForward){
          h.isOpen = false;
        }
      }
    } else {
      appendToOpenElement(h, afterSel, [ch]);
    }
    h.prevKind = kind;
  }

  function editorUndo(el){
    const h = getEditorHist(el);
    if(h.applying) return false;
    closeOpenStackElement(h);
    if(!h.past.length) return false;
    const elem = h.past.pop();
    h.isOpen = false;
    h.prevKind = EditKind.Other;
    let value = getEditorValue(el);
    for(let i = elem.changes.length - 1; i >= 0; i--){
      value = applyTextChange(value, invertTextChange(elem.changes[i]));
    }
    const sel = (elem.beforeSelections && elem.beforeSelections[0]) || { start: 0, end: 0 };
    h.future.push(elem);
    h.versionMark = elem.beforeVersionMark;
    setEditorValue(el, value, sel.start, sel.end);
    try { el.focus(); } catch(_){}
    return true;
  }

  function editorRedo(el){
    const h = getEditorHist(el);
    if(h.applying) return false;
    closeOpenStackElement(h);
    if(!h.future.length) return false;
    const elem = h.future.pop();
    h.prevKind = EditKind.Other;
    let value = getEditorValue(el);
    for(let i = 0; i < elem.changes.length; i++){
      value = applyTextChange(value, elem.changes[i]);
    }
    const sel = (elem.afterSelections && elem.afterSelections[0]) || { start: 0, end: 0 };
    h.past.push(elem);
    h.isOpen = false;
    h.versionMark = elem.afterVersionMark;
    setEditorValue(el, value, sel.start, sel.end);
    try { el.focus(); } catch(_){}
    return true;
  }

  function finalizeEditorCoalesce(el){
    const h = getEditorHist(el);
    closeOpenStackElement(h);
    h.prevKind = EditKind.Other;
  }

  function ensureDetailCharCountStack(wrap){
    let stack = wrap.querySelector('.detail-field-charcount-stack');
    if(!stack){
      stack = document.createElement('div');
      stack.className = 'detail-field-charcount-stack';
      stack.setAttribute('aria-hidden', 'true');
      const sel = document.createElement('span');
      sel.className = 'detail-field-selcount';
      sel.hidden = true;
      const meter = document.createElement('span');
      meter.className = 'detail-field-charcount';
      stack.appendChild(sel);
      stack.appendChild(meter);
      wrap.appendChild(stack);
    }
    return stack;
  }

  function updateDetailFieldCharCount(el){
    if(!el || !el.classList) return;
    const isDetail = el.classList.contains('detail-textarea');
    const isFocusEditor = el.id === 'focusEditorTextarea';
    if(!isDetail && !isFocusEditor) return;
    const wrap = isFocusEditor
      ? document.getElementById('focusEditorTextareaWrap')
      : el.closest('.detail-textarea-wrap');
    if(!wrap) return;
    const stack = ensureDetailCharCountStack(wrap);
    const meter = stack.querySelector('.detail-field-charcount');
    const selMeter = stack.querySelector('.detail-field-selcount');
    if(meter) meter.textContent = formatResultCharCount(getEditorValue(el).length);
    if(selMeter){
      let n = 0;
      try {
        const sel = getEditorSelection(el);
        n = Math.abs((sel.end || 0) - (sel.start || 0));
      } catch(_){ n = 0; }
      if(n >= 1){
        selMeter.hidden = false;
        selMeter.textContent = formatResultCharCount(n);
      } else {
        selMeter.hidden = true;
        selMeter.textContent = '';
      }
    }
  }

  function indentSelection(el, unindent){
    pushEditorUndo(el);
    const val = getEditorValue(el);
    const sel = getEditorSelection(el);
    let start = sel.start || 0;
    let end = sel.end || 0;
    const lineStart = val.lastIndexOf('\n', start - 1) + 1;
    let lineEnd = val.indexOf('\n', end);
    if(lineEnd === -1) lineEnd = val.length;
    /* wenn Selektion am Zeilenanfang endet und mehrzeilig, letzte leere Zeile nicht mitnehmen */
    if(end > start && val[end - 1] === '\n') lineEnd = end - 1;

    const block = val.slice(lineStart, lineEnd);
    const lines = block.split('\n');
    let deltaStart = 0;
    let deltaEnd = 0;
    const newLines = lines.map((line, i) => {
      if(unindent){
        let removed = 0;
        if(line.startsWith(EDITOR_INDENT)){ removed = EDITOR_INDENT.length; line = line.slice(EDITOR_INDENT.length); }
        else if(line.startsWith('\t')){ removed = 1; line = line.slice(1); }
        else if(line.startsWith(' ')){ removed = 1; line = line.slice(1); }
        if(i === 0) deltaStart = -removed;
        deltaEnd -= removed;
        return line;
      }
      if(i === 0) deltaStart = EDITOR_INDENT.length;
      deltaEnd += EDITOR_INDENT.length;
      return EDITOR_INDENT + line;
    });
    const next = val.slice(0, lineStart) + newLines.join('\n') + val.slice(lineEnd);
    const ns = Math.max(lineStart, start + deltaStart);
    const ne = Math.max(ns, end + deltaEnd);
    setEditorValue(el, next, ns, ne);
    commitEditorBaseline(el);
  }

  function wrapSelectionWithPair(el, open, close){
    pushEditorUndo(el);
    const sel = getEditorSelection(el);
    const val = getEditorValue(el);
    const selected = val.slice(sel.start, sel.end);
    const next = val.slice(0, sel.start) + open + selected + close + val.slice(sel.end);
    setEditorValue(el, next, sel.start + open.length, sel.start + open.length + selected.length);
    commitEditorBaseline(el);
  }

  function insertTextInEditor(el, text){
    text = applyPasteFormat(text);
    if(text == null) text = '';
    pushEditorUndo(el);
    const sel = getEditorSelection(el);
    const val = getEditorValue(el);
    const next = val.slice(0, sel.start) + text + val.slice(sel.end);
    setEditorValue(el, next, sel.start + text.length, sel.start + text.length);
    commitEditorBaseline(el);
  }

  function isAcceptedTextFile(file){
    if(!file) return false;
    if(file.size > FILE_DROP_MAX_BYTES) return false;
    const name = file.name || '';
    if(FILE_DROP_EXTS.test(name)) return true;
    const t = (file.type || '').toLowerCase();
    if(t.startsWith('text/')) return true;
    if(t === 'application/json' || t === 'application/ld+json' || t === 'application/xml' ||
       t === 'application/javascript' || t === 'application/x-javascript' || t === 'application/typescript' ||
       t === 'application/sql' || t === 'application/x-sh' || t === 'application/x-bash' ||
       t === 'application/yaml' || t === 'application/x-yaml' || t === 'application/toml' ||
       t === 'application/xhtml+xml' || t === 'application/rss+xml' || t === 'application/atom+xml' ||
       t === 'application/graphql' || t === 'application/x-httpd-php' || t === 'application/ecmascript'){
      return true;
    }
    /* unbekannter MIME, aber kleine Datei ohne Binär-Endung → versuchen */
    if(!t && name && !/\.(png|jpe?g|gif|webp|avif|ico|bmp|pdf|zip|gz|tar|rar|7z|wasm|exe|dll|so|dylib|bin|woff2?|ttf|otf|mp3|mp4|mov|webm|wav|ogg)$/i.test(name) && file.size <= FILE_DROP_MAX_BYTES){
      return true;
    }
    return false;
  }

  function readFileAsText(file){
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => {
        let s = String(r.result || '');
        /* Nullbytes → eher binär, verwerfen */
        if(s.indexOf('\u0000') !== -1){
          reject(new Error('binary'));
          return;
        }
        resolve(s);
      };
      r.onerror = () => reject(r.error || new Error('read failed'));
      r.readAsText(file);
    });
  }

  /* Datei-Inhalt ersetzt das gesamte Textfeld (Detail + XML-Source) */
  async function insertFileContents(el, files){
    const list = Array.from(files || []).filter(isAcceptedTextFile);
    if(!list.length) return;
    const parts = [];
    for(const f of list){
      try { parts.push(await readFileAsText(f)); } catch(_){}
    }
    if(!parts.length) return;
    let combined = parts.join('\n\n');
    combined = applyPasteFormat(combined);
    if(warnBeforePastingText && combined.length > warnPastingTextThreshold){
      openPasteWarn(combined, el, { replaceAll: true });
      return;
    }
    pushEditorUndo(el);
    const len = combined.length;
    setEditorValue(el, combined, len, len);
    commitEditorBaseline(el);
    try { el.focus(); } catch(_){}
  }

  function setupMobileKeyboardFix(){
    if(!window.visualViewport) return;
    const root = document.documentElement;
    let focusTimer = null;

    function isEditorTarget(el){
      if(!el || el.nodeType !== 1) return false;
      const tag = el.tagName;
      return tag === 'TEXTAREA' || tag === 'INPUT' || el.isContentEditable;
    }

    function updateKeyboardPadding(){
      const vv = window.visualViewport;
      const gap = Math.max(0, window.innerHeight - vv.height - (vv.offsetTop || 0));
      /* Tastatur offen wenn Visual-Viewport deutlich kleiner */
      if(gap > 80){
        const extra = Math.round(vv.height * 0.15);
        root.style.setProperty('--keyboard-padding', extra + 'px');
      } else {
        root.style.setProperty('--keyboard-padding', '0px');
      }
    }

    document.addEventListener('focusin', e => {
      const el = e.target;
      if(!isEditorTarget(el)) return;
      /* Fokus-Editor ist offen → kein scrollIntoView, kein Page-Scroll */
      const feOverlay = document.getElementById('focusEditorOverlay');
      if(feOverlay && feOverlay.classList.contains('open')) return;
      if(focusTimer) clearTimeout(focusTimer);
      focusTimer = setTimeout(() => {
        updateKeyboardPadding();
        try {
          el.scrollIntoView({ block: 'nearest', inline: 'nearest', behavior: 'smooth' });
        } catch(_){}
      }, 300);
    });

    document.addEventListener('focusout', () => {
      setTimeout(() => {
        if(!isEditorTarget(document.activeElement)){
          root.style.setProperty('--keyboard-padding', '0px');
        }
      }, 200);
    });

    window.visualViewport.addEventListener('resize', updateKeyboardPadding);
    window.visualViewport.addEventListener('scroll', updateKeyboardPadding);
  }

  /*
   * TextEditor-Schicht (native textarea):
   * - enhanceTextEditor: Undo/Redo, Tab, Paste plain, Drop, Bracket-wrap
   * - Schreibzugriff nur über getEditorValue / setEditorValue / insertTextInEditor
   */
  function enhanceTextEditor(el, opts){
    if(!el || el._editorEnhanced) return;
    el._editorEnhanced = true;
    opts = opts || {};
    if(opts.historyKey) el.dataset.historyKey = opts.historyKey;
    getEditorHist(el);

    el.addEventListener('beforeinput', e => {
      onEditorBeforeInput(el, e);
    });

    el.addEventListener('input', e => {
      if(e && e.isComposing) return;
      const h = getEditorHist(el);
      if(h.applying){
        updateDetailFieldCharCount(el);
        return;
      }
      onEditorInputForHistory(el, e);
      updateDetailFieldCharCount(el);
    });

    el.addEventListener('keydown', e => {
      const mod = e.ctrlKey || e.metaKey;
      if(mod && !e.altKey && (e.key === 'z' || e.key === 'Z')){
        e.preventDefault();
        e.stopPropagation();
        if(e.shiftKey) editorRedo(el);
        else editorUndo(el);
        return;
      }
      if(mod && !e.altKey && (e.key === 'y' || e.key === 'Y')){
        e.preventDefault();
        e.stopPropagation();
        editorRedo(el);
        return;
      }
      /* Navigation / Klick beendet Tipp-Gruppe (wie VS Code / CodeMirror) */
      if(!mod && (e.key === 'ArrowLeft' || e.key === 'ArrowRight' || e.key === 'ArrowUp' || e.key === 'ArrowDown' || e.key === 'Home' || e.key === 'End' || e.key === 'PageUp' || e.key === 'PageDown')){
        finalizeEditorCoalesce(el);
      }
      if(e.key === 'Enter' && !mod){
        finalizeEditorCoalesce(el);
      }
      if(e.key === 'Tab' && el.tagName === 'TEXTAREA' && !mod){
        e.preventDefault();
        indentSelection(el, e.shiftKey);
        return;
      }
      const start = el.selectionStart || 0;
      const end = el.selectionEnd || 0;
      if(end > start && !mod && !e.altKey){
        const pairs = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'", '`': '`' };
        if(Object.prototype.hasOwnProperty.call(pairs, e.key)){
          e.preventDefault();
          wrapSelectionWithPair(el, e.key, pairs[e.key]);
          return;
        }
      }
    });

    el.addEventListener('blur', () => {
      finalizeEditorCoalesce(el);
      if(el.classList && el.classList.contains('detail-textarea') && typeof flushSourceFromTree === 'function'){
        flushSourceFromTree();
      }
    });

    /* Mausklick beendet Tipp-Gruppe – Scroll bleibt natives Browser-Verhalten */
    el.addEventListener('mousedown', e => {
      if(e.button !== 0) return;
      finalizeEditorCoalesce(el);
    });
    el.addEventListener('touchstart', () => {
      finalizeEditorCoalesce(el);
    }, { passive: true });

    el.addEventListener('paste', e => {
      const cd = e.clipboardData || window.clipboardData;
      if(!cd) return;
      /* Datei-Paste */
      if(cd.files && cd.files.length){
        const files = Array.from(cd.files).filter(isAcceptedTextFile);
        if(files.length){
          e.preventDefault();
          e.stopPropagation();
          insertFileContents(el, files);
          return;
        }
      }
      let text = cd.getData('text/plain') || cd.getData('text') || '';
      if(!text) return;
      text = applyPasteFormat(text);
      if(warnBeforePastingText && text.length > warnPastingTextThreshold){
        e.preventDefault();
        e.stopPropagation();
        openPasteWarn(text, el);
        return;
      }
      /* eigenes Einfügen damit Undo-Punkt sauber ist */
      e.preventDefault();
      insertTextInEditor(el, text);
    });

    el.addEventListener('dragenter', e => {
      if(!e.dataTransfer) return;
      const types = Array.from(e.dataTransfer.types || []);
      if(types.indexOf('Files') !== -1){
        e.preventDefault();
        setFileDragOver(el, true);
      }
    });
    el.addEventListener('dragover', e => {
      if(!e.dataTransfer) return;
      const types = Array.from(e.dataTransfer.types || []);
      if(types.indexOf('Files') !== -1){
        e.preventDefault();
        e.dataTransfer.dropEffect = 'copy';
        setFileDragOver(el, true);
      }
    });
    el.addEventListener('dragleave', e => {
      if(e.target === el || (el.contains && !el.contains(e.relatedTarget))){
        setFileDragOver(el, false);
      }
    });
    el.addEventListener('drop', e => {
      setFileDragOver(el, false);
      if(!e.dataTransfer || !e.dataTransfer.files || !e.dataTransfer.files.length) return;
      const files = Array.from(e.dataTransfer.files).filter(isAcceptedTextFile);
      if(!files.length) return;
      e.preventDefault();
      e.stopPropagation();
      insertFileContents(el, files);
    });

    if(opts.charCount || (el.classList && el.classList.contains('detail-textarea'))){
      const refreshCount = () => updateDetailFieldCharCount(el);
      el.addEventListener('select', refreshCount);
      el.addEventListener('keyup', refreshCount);
      el.addEventListener('mouseup', refreshCount);
      el.addEventListener('touchend', refreshCount, { passive: true });
      el.addEventListener('blur', refreshCount);
      updateDetailFieldCharCount(el);
    }
  }

  function attachPasteGuard(el){
    /* Alle Textfelder: eigener Undo/Redo-Stack + Paste/Drop wo sinnvoll */
    if(!el) return;
    if(el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'search' || !el.type))){

    updateSourceHeadTools();
    if(S.selectedId) renderDetail();
    restoreScrollPositions();
  });

  /* ResizeObserver für splitBody – ersetzt getBoundingClientRect-Polling bei Sheet-Geometrie (§4.2) */
  if(typeof ResizeObserver !== 'undefined'){
    const _sheetObserver = new ResizeObserver(() => {
      if(isMobileLayout() && activeSheet) updateMobileSheetMetrics();
    });
    const _sb = document.getElementById('splitBody');
    if(_sb) _sheetObserver.observe(_sb);
  }

  /* ===== Mobile Fokus-Editor (Vollbild-Editor-Modus) ===== */
  let focusEditorTarget = null;
  let focusEditorIsTag = false;
  let focusEditorOrigValue = '';
  let _feBodyLockStyle = null;

  /* Body-Lock: fixiert den gesamten Dokumentkörper, sodass das Öffnen der
     Tastatur die Seite nicht scrollen kann. */
  function feLockBody(){
    if(_feBodyLockStyle) return;
    _feBodyLockStyle = document.createElement('style');
    _feBodyLockStyle.id = 'fe-body-lock';
    _feBodyLockStyle.textContent = 'html, body { position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; height: 100% !important; overflow: hidden !important; }';
    document.head.appendChild(_feBodyLockStyle);
  }
  function feUnlockBody(){
    if(!_feBodyLockStyle) return;
    _feBodyLockStyle.remove();
    _feBodyLockStyle = null;
  }

  function openFocusEditor(targetEl, isTag){
    if(!isMobileLayout()) return;
    if(!targetEl) return;
    focusEditorTarget = targetEl;
    focusEditorIsTag = !!isTag;
    focusEditorOrigValue = getEditorValue(targetEl);

    const overlay = document.getElementById('focusEditorOverlay');
    const textarea = document.getElementById('focusEditorTextarea');
    const wrap = document.getElementById('focusEditorTextareaWrap');
    if(!overlay || !textarea) return;

    /* Universell: immer die Textarea als Editor verwenden (auch für Tags) */
    textarea.style.display = 'block';
    textarea.value = focusEditorOrigValue;
    textarea.placeholder = targetEl.placeholder || '';
    textarea.className = 'focus-editor-textarea' + (detailTextLineWrap ? '' : ' wrap-off');
    textarea.dataset.historyKey = targetEl.dataset.historyKey || '';

    /* Wiki-Optionen nur im Fokus-Editor zeigen, wenn Originalfeld eine Detail-Textarea ist */
    const showWiki = !!targetEl.classList && targetEl.classList.contains('detail-textarea');
    const optWiki = document.getElementById('optFocusEditorWiki');
    const optWikiSettings = document.getElementById('optFocusEditorWikiSettings');
    const optWikiSep = document.getElementById('optFocusEditorWikiSep');
    if(optWiki) optWiki.hidden = !showWiki;
    if(optWikiSettings) optWikiSettings.hidden = !showWiki;
    if(optWikiSep) optWikiSep.hidden = !showWiki;
    /* Enhance wenn noch nicht gemacht */
    if(!textarea._editorEnhanced){
      enhanceTextEditor(textarea, { historyKey: textarea.dataset.historyKey, charCount: true });
    }
    /* Char-Count-Stack sicherstellen (gleicher Stil wie Desktop) */
    if(wrap) ensureDetailCharCountStack(wrap);

    overlay.setAttribute('aria-hidden', 'false');
    overlay.classList.add('open');
    document.body.style.overflow = 'hidden';
    feLockBody();

    /* Fokus aufs Textfeld (User hat explizit getippt → Tastatur ist gewollt).
       preventScroll: true verhindert, dass der Browser die Seite scrollt,
       um das fokussierte Element ins Sichtbare zu bringen. */
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        if(textarea){
          try { textarea.focus({ preventScroll: true }); } catch(_){ textarea.focus(); }
          const len = (textarea.value || '').length;
          try { textarea.setSelectionRange(len, len); } catch(_){}
        }
        updateFocusEditorUndoButtons();
        if(textarea) updateDetailFieldCharCount(textarea);
      });
    });
  }

  function closeFocusEditor(){
    const overlay = document.getElementById('focusEditorOverlay');
    if(!overlay || !overlay.classList.contains('open')) return;
    const textarea = document.getElementById('focusEditorTextarea');
    /* Options- und Wiki-Menü schließen */
    if(typeof closeOptionsMenu === 'function') closeOptionsMenu();
    if(typeof closeAllWikiMenus === 'function') closeAllWikiMenus();
    /* Body-Lock aufheben */
    feUnlockBody();
    if(!focusEditorTarget) { overlay.classList.remove('open'); overlay.setAttribute('aria-hidden', 'true'); return; }

    /* Wert zurückkopieren */
    const newValue = textarea ? textarea.value : '';
    if(newValue !== focusEditorOrigValue){
      if(focusEditorIsTag){
        focusEditorTarget.value = newValue;
        /* Input-Event auslösen für Tag-Synchronisation */
        focusEditorTarget.dispatchEvent(new Event('input', { bubbles: true }));
      } else {
        setEditorValue(focusEditorTarget, newValue);
        /* Node-Text aktualisieren */
        if(focusEditorTarget.classList.contains('detail-textarea')){
          const found = S.selectedId ? findNode(S.tree, S.selectedId) : null;
          if(found){
            found.node.text = newValue;
            if(found.node.kind === 'comment') updateOutlineLabelFor(found.node.id, null, newValue);
            else updateOutlinePreview(found.node.id, newValue);
            scheduleSourceFromTree();
          }
        } else if(focusEditorTarget === sourceText){
          sourceDirty = true;
          updateSourceDirtyIndicator();
        }
      }
    }

    overlay.classList.remove('open');
    overlay.setAttribute('aria-hidden', 'true');
    if(!isProtocolOpen() && !isLanguagePanelOpen() && !isSettingsOpen()) document.body.style.overflow = '';
    /* Original-Feld blur-en um Tastatur zu schließen */
    try { if(document.activeElement && document.activeElement.tagName === 'TEXTAREA') document.activeElement.blur(); } catch(_){}
    focusEditorTarget = null;
  }

  function updateFocusEditorUndoButtons(){
    const btnU = document.getElementById('btnFocusEditorUndo');
    const btnR = document.getElementById('btnFocusEditorRedo');
    const el = document.getElementById('focusEditorTextarea');
    if(!el || !btnU || !btnR) return;
    const h = getEditorHist(el);
    btnU.disabled = h.past.length === 0;
    btnR.disabled = h.future.length === 0;
  }

  (function wireFocusEditor(){
    const back = document.getElementById('btnFocusEditorBack');
    const undo = document.getElementById('btnFocusEditorUndo');
    const redo = document.getElementById('btnFocusEditorRedo');
    const options = document.getElementById('btnFocusEditorOptions');
    const optMenu = document.getElementById('focusEditorOptionsMenu');
    const optFind = document.getElementById('optFocusEditorFind');
    const optWrap = document.getElementById('optFocusEditorWrap');
    if(back) back.onclick = () => closeFocusEditor();
    if(undo) undo.onclick = () => {
      const el = document.getElementById('focusEditorTextarea');
      if(el){ editorUndo(el); updateFocusEditorUndoButtons(); }
    };
    if(redo) redo.onclick = () => {
      const el = document.getElementById('focusEditorTextarea');
      if(el){ editorRedo(el); updateFocusEditorUndoButtons(); }
    };
    if(options && optMenu){
      options.onclick = e => {
        e.stopPropagation();
        const isOpen = optMenu.classList.contains('open');
        closeAllWikiMenus();
        closeTemplateMenu();
        closeOptionsMenu();
        if(!isOpen){
          optWrap.textContent = detailTextLineWrap ? t('Umbruch aus', 'detail.wrapOff') : t('Umbruch an', 'detail.wrapOn');
          positionMenu(options, optMenu);
          options.setAttribute('aria-expanded', 'true');
          openOptionsMenu = optMenu;
        }
      };
    }
    if(optFind) optFind.onclick = e => {
      e.stopPropagation();
      closeOptionsMenu();
      const el = document.getElementById('focusEditorTextarea');
      if(el) openFindReplace(el);
    };
    if(optWrap) optWrap.onclick = e => {
      e.stopPropagation();
      detailTextLineWrap = !detailTextLineWrap;
      writeHashState();
      applyDetailLineWrap();
      optWrap.textContent = detailTextLineWrap ? t('Umbruch aus', 'detail.wrapOff') : t('Umbruch an', 'detail.wrapOn');
      closeOptionsMenu();
    };

    /* Wiki im Fokus-Editor (nur bei Detail-Textfeldern sichtbar) */
    const optWiki = document.getElementById('optFocusEditorWiki');
    const optWikiSettings = document.getElementById('optFocusEditorWikiSettings');
    const feLevel0 = document.getElementById('focusEditorMenuLevel0');
    const feLevel1 = document.getElementById('focusEditorMenuLevel1');
    const feWikiBack = document.getElementById('optFocusEditorWikiBack');
    const feWikiLang = document.getElementById('feWikiLang');
    const feWikiChars = document.getElementById('feWikiChars');

    /* Wiki-Sprach-Optionen füllen */
    if(feWikiLang && !feWikiLang.options.length){
      ['de','en','fr','es','it','pt','nl','pl','ru','ja','zh','random'].forEach(v => {
        const o = document.createElement('option');
        o.value = v; o.textContent = t(({'de':'Deutsch','en':'English','fr':'Français','es':'Español','it':'Italiano','pt':'Português','nl':'Nederlands','pl':'Polski','ru':'Русский','ja':'日本語','zh':'中文','random':'Zufällig'})[v]||v, 'wiki.'+v);
        feWikiLang.appendChild(o);
      });
    }

    async function feDoWikiInsert(){
      const fe = document.getElementById('focusEditorTextarea');
      if(!fe) return;
      const lang = feWikiLang ? feWikiLang.value : wikiSettings.lang;
      let chars = feWikiChars ? parseInt(feWikiChars.value, 10) || 450 : wikiSettings.chars;
      wikiSettings = { lang, chars };
      optWiki.disabled = true;
      const prevText = optWiki.textContent;
      optWiki.textContent = t('Lade…', 'detail.wikiLoading');
      try {
        const text = await fetchWikiText(lang, chars);
        if(typeof insertTextInEditor === 'function') insertTextInEditor(fe, text);
        else {
          const s = fe.selectionStart, ee = fe.selectionEnd;
          fe.value = fe.value.substring(0, s) + text + fe.value.substring(ee);
          fe.dispatchEvent(new Event('input', { bubbles: true }));
          fe.setSelectionRange(s + text.length, s + text.length);
        }
        closeOptionsMenu();
      } catch(err) {
        alert(t('Fehler: ', 'protocol.errorPrefix') + err.message);
      } finally {
        optWiki.disabled = false;
        optWiki.textContent = prevText;
      }
    }

    if(optWiki) optWiki.onclick = e => {
      e.stopPropagation();
      feDoWikiInsert();
    };

    if(optWikiSettings) optWikiSettings.onclick = e => {
      e.stopPropagation();
      /* Zur Wiki-Einstellungen-Ebene wechseln (Nested-Level im Options-Menü) */
      if(feLevel0) feLevel0.classList.remove('active');
      if(feLevel1) feLevel1.classList.add('active');
      if(feWikiLang) feWikiLang.value = wikiSettings.lang;
      if(feWikiChars) feWikiChars.value = wikiSettings.chars;
    };

    if(feWikiBack) feWikiBack.onclick = e => {
      e.stopPropagation();
      if(feLevel1) feLevel1.classList.remove('active');
      if(feLevel0) feLevel0.classList.add('active');
    };

    if(feWikiLang) feWikiLang.addEventListener('change', () => { wikiSettings.lang = feWikiLang.value; });
    if(feWikiChars) feWikiChars.addEventListener('change', () => { wikiSettings.chars = parseInt(feWikiChars.value, 10) || 450; });

    /* Intercept focus on text fields in mobile */
    document.addEventListener('focusin', e => {
      if(!isMobileLayout()) return;
      const el = e.target;
      if(!el || el.nodeType !== 1) return;
      /* Focus editor textarea: allow */
      if(el.id === 'focusEditorTextarea') return;
      /* Language search: allow (not a mobile focus editor target) */
      if(el.id === 'languageSearch') return;
      /* Only intercept textareas and text inputs that are in the detail/source area */
      if(el.tagName === 'TEXTAREA' || (el.tagName === 'INPUT' && (el.type === 'text' || !el.type))){
        if(el.id === 'panelStructureTitle' || el.classList.contains('detail-textarea') || el.classList.contains('detail-tag-input') || el.id === 'sourceText'){
          /* Prevent native focus → open focus editor instead */
          e.stopImmediatePropagation();
          try { el.blur(); } catch(_){}
          const isTag = el.classList.contains('detail-tag-input');
          setTimeout(() => openFocusEditor(el, isTag), 50);
        }
      }
    }, true);

    /* Update undo/redo buttons + char count on input in focus editor */
    const feTextarea = document.getElementById('focusEditorTextarea');
    if(feTextarea) feTextarea.addEventListener('input', () => {
      updateFocusEditorUndoButtons();
      updateDetailFieldCharCount(feTextarea);
    });

    /* Escape closes focus editor */
    document.addEventListener('keydown', e => {
      if(e.key === 'Escape'){
        const overlay = document.getElementById('focusEditorOverlay');
        if(overlay && overlay.classList.contains('open')){
          e.preventDefault();
          closeFocusEditor();
        }
      }
    });
  })();

  /* ===== Outline-Filter & Collapse-to-Level: Event-Wiring ===== */
  (function wireOutlineFilter(){
    const filterInput = document.getElementById('outlineFilterInput');
    const filterClear = document.getElementById('btnOutlineFilterClear');
    const collapseBtn = document.getElementById('btnCollapseLevel');
    const collapseWrap = document.getElementById('collapseLevelWrap');
    const collapseMenu = document.getElementById('collapseLevelMenu');

    if(filterInput){
      filterInput.addEventListener('input', () => {
        outlineFilterQuery = filterInput.value || '';
        if(filterClear) filterClear.hidden = !outlineFilterQuery;
        if(outlineFilterTimer) clearTimeout(outlineFilterTimer);
        outlineFilterTimer = setTimeout(applyOutlineFilter, 120);
      });
      filterInput.addEventListener('keydown', e => {
        if(e.key === 'Escape'){
          filterInput.value = '';
          outlineFilterQuery = '';
          if(filterClear) filterClear.hidden = true;
          applyOutlineFilter();
          filterInput.blur();
        }
      });
    }
    if(filterClear){
      filterClear.onclick = () => {
        filterInput.value = '';
        outlineFilterQuery = '';
        filterClear.hidden = true;
        applyOutlineFilter();
        /* Auf Mobile: nicht fokussieren – sonst öffnet sich die Tastatur (§MOBILE-FOCUS-REGEL) */
        if(!isMobileLayout()) filterInput.focus();
      };
    }
    if(collapseBtn && collapseWrap && collapseMenu){
      collapseBtn.onclick = e => {
        e.stopPropagation();
        const isOpen = collapseMenu.classList.contains('open');
        closeOptionsMenu();
        if(!isOpen){
          positionMenu(collapseBtn, collapseMenu);
          collapseBtn.setAttribute('aria-expanded', 'true');
          openOptionsMenu = collapseMenu;
        }
      };
      /* Collapse-Level Optionen */
      const optAll = document.getElementById('optCollapseAll');
      const optExp = document.getElementById('optExpandAll');
      if(optAll) optAll.onclick = () => { closeOptionsMenu(); collapseAll(); };
      if(optExp) optExp.onclick = () => { closeOptionsMenu(); expandAll(); };
    }
  })();

  /* ===== Schema-Learning: Autocomplete-Datalist für Tag-Input ===== */
  /* Globale Datalist, die beim Tippen im Tag-Input aktualisiert wird */
  let _schemaDatalist = null;
  function ensureSchemaDatalist(){
    if(_schemaDatalist) return _schemaDatalist;
    _schemaDatalist = document.createElement('datalist');
    _schemaDatalist.id = 'tagSuggestions';
    document.body.appendChild(_schemaDatalist);
    return _schemaDatalist;
  }
  function refreshTagSuggestions(parentTag){
    const dl = ensureSchemaDatalist();
    dl.innerHTML = '';
    const suggestions = getTagSuggestions(parentTag);
    suggestions.slice(0, 12).forEach(tag => {
      const o = document.createElement('option');
      o.value = tag;
      dl.appendChild(o);
    });
  }

  /* ===== Performance-Mode Setting ===== */
  let performanceMode = 'auto'; /* 'auto' | 'on' | 'off' */
  let autoCollapseThreshold = 200; /* ab dieser Node-Anzahl auto-collapse */

  function countNodes(nodes){
    let c = 0;
    (function walk(ns){ for(const n of ns){ c++; if(n.children) walk(n.children); } })(nodes || []);
    return c;
  }

  function applyPerformanceMode(){
    if(performanceMode === 'off') return;
    const count = countNodes(S.tree);
    const shouldOptimize = performanceMode === 'on' || (performanceMode === 'auto' && count > autoCollapseThreshold);
    if(shouldOptimize){
      /* Level 3+ automatisch einklappen */
      (function walk(nodes, depth){
        nodes.forEach(n => {
          if(n.kind === 'element' && n.children && n.children.length && depth >= 3) n.collapsed = true;
          if(n.children) walk(n.children, depth + 1);
        });
      })(S.tree, 1);
    }
  }

  /* ===== Protokoll-Einträge klickbar machen ===== */
  /* Überschreibt renderProtocolList um Jump-Funktionalität zu ergänzen */
  renderProtocolList = function(){
    const list = document.getElementById('protocolList');
    if(!list) return;
    list.innerHTML = '';
    if(!protocolLog.length){
      const empty = document.createElement('div');
      empty.className = 'protocol-empty';
      empty.textContent = t('Noch keine Einträge. Tippe auf „Prüfen“, um die Struktur jetzt zu prüfen.', 'protocol.empty');
      list.appendChild(empty);
      return;
    }
    /* Letzte Validierung: _line-Properties sind nach runValidation gesetzt.
       Bei Bedarf nachträglich aktualisieren, falls noch nicht geschehen. */
    const hasLines = (function checkLines(nodes){
      for(const n of nodes){ if(n._line != null) return true; if(n.children && checkLines(n.children)) return true; }
      return false;
    })(S.tree);
    if(!hasLines){
      /* _line setzen ohne Protokoll-Einträge zu erzeugen */
      const lineState = getLineMap();
      (function setLines(nodes){
        for(const n of nodes){
          if(n.kind !== 'comment') n._line = lineState.map[n.id] || null;
          if(n.children) setLines(n.children);
        }
      })(S.tree);
    }
    protocolLog.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'protocol-entry type-' + (entry.type || 'ok');
      const ts = document.createElement('span');
      ts.className = 'protocol-ts';
      ts.textContent = entry.ts;
      const msg = document.createElement('span');
      msg.className = 'protocol-msg';
      msg.textContent = entry.message;
      row.appendChild(ts);
      row.appendChild(msg);
      /* Jump: wenn die Message eine Node-ID referenziert (über Zeilen-Map) */
      if(entry.type === 'error' || entry.type === 'warning'){
        /* Versuche zugehörige Issue über Zeilennummer in der Message zu finden */
        const lineMatch = entry.message.match(/Zeile (\d+)/);
        if(lineMatch){
          const line = parseInt(lineMatch[1], 10);
          /* Node mit dieser Zeile finden */
          const found = (function findNodeByLine(nodes){
            for(const n of nodes){
              if(n._line === line) return n;
              if(n.children){ const f = findNodeByLine(n.children); if(f) return f; }
            }
            return null;
          })(S.tree);
          if(found){
            row.style.cursor = 'pointer';
            row.title = t('Zum Eintrag springen', 'protocol.jumpTitle');
            row.onclick = () => {
              selectNode(found.id);
              const row = outlineRowById(found.id);
              if(row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
              if(sourcePanel.style.display !== 'none' && sourcePanel.style.display !== ''){
                jumpToSourceForNode(found.id);
              }
            };
          }
        }
      }
      list.appendChild(row);
    });
    list.scrollTop = list.scrollHeight;
  };

  /* ===== Source → Tree: Bei Selektion im Source-View Tree markieren ===== */
  let sourceToTreeTimer = null;
  if(sourceText){
    sourceText.addEventListener('click', () => {
      if(sourceToTreeTimer) clearTimeout(sourceToTreeTimer);
      sourceToTreeTimer = setTimeout(() => {
        if(sourcePanel.style.display === 'none' || sourcePanel.style.display === '') return;
        if(sourceDirty) return; /* Nur bei synchronem Source */
        const pos = sourceText.selectionStart;
        const map = getFullOffsetMap();
        /* Node finden, dessen Offset <= pos ist */
        let bestId = null, bestOffset = -1;
        for(const [id, off] of Object.entries(map.offsets)){
          const fullOff = '<prompt>\n'.length + off;
          if(fullOff <= pos && fullOff > bestOffset){
            bestOffset = fullOff;
            bestId = id;
          }
        }
        if(bestId) selectNode(bestId);
      }, 80);
    });
  }

  /* ===== Start ===== */
  readHashState();
  /* Sprache: URL setLanguage, sonst System, Fallback de */
  writeHashState();
  /* Sofort korrekten Button-Text setzen (verhindert Flackern vor dem restlichen Init) */
  updateResultCharCount();

  const draft = loadDraftPayload();
  if(draft && applyDraftPayload(draft)){
    /* Tabs aus session/local wiederhergestellt. S liest direkt aus dem aktiven Tab. */
  } else {
    const first = createTabState(t('Prompt {n}', 'tabs.defaultTitle', {n: 1}), []);
    tabs = [first];
    activeTabId = first.id;
    /* Keine Zuweisungen an tree/selectedId/idCounter mehr nötig –
       S liest direkt aus first. */
  }
  registerProtocolTrigger(document.getElementById('btnValidate'));
  registerProtocolTrigger(document.getElementById('btnOptions'));
  bindOutlineScroll();
  bindSharedScrollPersist();
  ensureDetailParent();
  if(isMobileLayout()){
    updateMobileSheetMetrics();
    putAllSheetsDormant();
  }
  applySourceWrap();
  applyDetailLineWrap();
  updateSourceHeadTools();
  renderTemplateMenus();
  renderCustomButtons();
  renderWarningsMenus();
  if(sourceText){
    sourceText.dataset.historyKey = 'sourceText';
    enhanceTextEditor(sourceText, { historyKey: 'sourceText' });
  }
  attachPasteGuardsToTree(document);
  setupMobileKeyboardFix();
  renderTabs();
  render();
  ensureSchemaDatalist();
  updateResultCharCount();
  updateStructUndoButtons();
  loadLanguage(currentLang).catch(() => {});
  /* beim Verlassen noch einmal speichern */
  window.addEventListener('pagehide', () => {
    try { flushSourceFromTree(); } catch(_){}
    try { captureScrollPositions(); } catch(_){}
    try { saveDraftNow(); } catch(_){}
  });
  document.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'hidden'){
      try { flushSourceFromTree(); } catch(_){}
      try { captureScrollPositions(); } catch(_){}
      try { saveDraftNow(); } catch(_){}
    }
  });
})();
</script>
