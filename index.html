  /* Zentrale Stelle für den Kind-Zähler einer Zeile.
   Setzt den Count ab 1 Kind, entfernt ihn bei 0. */
  function updateOutlineCount(row, count){
    if(!row) return;
    let countEl = row.querySelector('.outline-count');
    if(count >= 1){
      if(!countEl){
        countEl = document.createElement('span');
        countEl.className = 'outline-count';
        const openBtn = row.querySelector('.outline-open');
        if(openBtn) row.insertBefore(countEl, openBtn);
        else row.appendChild(countEl);
      }
      countEl.textContent = String(count);
    } else if(countEl){
      countEl.remove();
    }
  }

  /* Bequem-Variante: anhand eines Knotens dessen Row finden und Count setzen. */
  function updateOutlineCountForNode(node){
    if(!node || !node.id) return;
    const row = outlineRowById(node.id);
    if(!row) return;
    const n = (node.children && node.children.length) || 0;
    updateOutlineCount(row, n);
  }

  function refreshParentOutlineChrome(parentNode){
    if(!parentNode || !parentNode.id) return;
    const prow = outlineRowById(parentNode.id);
    if(!prow) return;
    const hasCh = parentNode.children && parentNode.children.length > 0;
    const chev = prow.querySelector('.outline-chevron');
    if(chev){
      chev.classList.toggle('invisible', !hasCh);
      chev.textContent = parentNode.collapsed ? '▸' : '▾';
      chev.setAttribute('aria-label', parentNode.collapsed
        ? t('Aufklappen', 'outline.expand')
        : t('Zuklappen', 'outline.collapse'));
      chev.setAttribute('aria-expanded', hasCh ? String(!parentNode.collapsed) : 'false');
    }
    updateOutlineCountForNode(parentNode);
  }

  function insertRelative(node, opts){
   structUndoPush();
    opts = opts || {};
    const doFocus = opts.focus !== false;
    if(S.selectedId){
      const f = findNode(S.tree, S.selectedId);
      if(f){
        f.arr.splice(f.index + 1, 0, node);
        const selRow = outlineRowById(S.selectedId);
        const selWrap = selRow ? selRow.parentElement : null;
        const depth = selRow ? (parseInt(selRow.dataset.depth || '0', 10) || 0) : 0;
        if(selWrap && selWrap.parentElement){
          const newWrap = renderOutlineRow(node, depth);
          if(selWrap.nextSibling) selWrap.parentElement.insertBefore(newWrap, selWrap.nextSibling);
          else selWrap.parentElement.appendChild(newWrap);

          /* NEU: Wenn der neue Knoten nicht auf oberster Ebene liegt,
             hat sein Parent jetzt ein Kind mehr – Count aktualisieren. */
          if(f.arr !== S.tree){
            const parentNode = findParentOfArray(S.tree, f.arr);
            if(parentNode) refreshParentOutlineChrome(parentNode);
          }

          selectAndShowDetail(node.id, doFocus);
          return;
        }
        S.selectedId = node.id;
        S.focusDetailField = doFocus && shouldFocusDetail();
        renderAfterTreeChange();
        return;
      }
    }
    S.tree.push(node);
    if(outlineList){
      const empty = outlineList.querySelector('.outline-empty');
      if(empty) empty.remove();
      outlineList.appendChild(renderOutlineRow(node, 0));
      selectAndShowDetail(node.id, doFocus);
      return;
    }
    S.selectedId = node.id;
    S.focusDetailField = doFocus && shouldFocusDetail();
    renderAfterTreeChange();
  }

  function addRootNode(){ insertRelative(newNode('','')); }
  function addRootComment(){ insertRelative(newCommentNode('')); }
  function addTemplate(tag){ insertRelative(newNode(tag,''), { focus: false }); }
  function addChild(parentId, isComment){
    const f = findNode(S.tree, parentId);
    if(!f || f.node.kind === 'comment') return;
   structUndoPush();
    const parent = f.node;
    const migratedText = (parent.text || '').trim() !== '';
    if(migratedText){
      const parentTag = (parent.tag || '').trim();
      const leafTag = parentTag ? (parentTag + '_text') : 'content';
      const textNode = newNode(leafTag, parent.text);
      parent.children = parent.children || [];
      parent.children.unshift(textNode);
      parent.text = '';
      showBanner('ok', [t('Hinweis: Inhalt von <{parent}> wurde nach <{leaf}> verschoben, da Container-Tags keinen direkten Text enthalten sollten.', 'protocol.containerMoved', {parent: parentTag || 'element', leaf: leafTag})]);
    }
    parent.children = parent.children || [];
    const n = isComment ? newCommentNode('') : newNode('','');
    parent.children.push(n);
    const wasCollapsed = !!parent.collapsed;
    parent.collapsed = false;

    /* Text-Migration ändert Struktur stärker → Full-Render sicherer */
    if(migratedText){
      S.selectedId = n.id;
      S.focusDetailField = shouldFocusDetail();
      renderAfterTreeChange();
      return;
    }

    const parentRow = outlineRowById(parentId);
    const parentWrap = parentRow ? parentRow.parentElement : null;
    if(parentWrap && parentRow){
      const depth = parseInt(parentRow.dataset.depth || '0', 10) || 0;
      if(wasCollapsed){
        while(parentWrap.childNodes.length > 1) parentWrap.removeChild(parentWrap.lastChild);
        parent.children.forEach(ch => parentWrap.appendChild(renderOutlineRow(ch, depth + 1)));
      } else {
        parentWrap.appendChild(renderOutlineRow(n, depth + 1));
      }
      refreshParentOutlineChrome(parent);
      selectAndShowDetail(n.id, shouldFocusDetail());
      return;
    }
    S.selectedId = n.id;
    S.focusDetailField = shouldFocusDetail();
    renderAfterTreeChange();
  }
  /* Oberpunkt: neuen leeren Parent um den ausgewählten Knoten legen */
  function addParent(){
    if(!S.selectedId) return;
   structUndoPush();
    const f = findNode(S.tree, S.selectedId);
    if(!f) return;
    const parent = newNode('','');
    const node = f.arr.splice(f.index, 1)[0];
    parent.children = [node];
    parent.collapsed = false;
    f.arr.splice(f.index, 0, parent);
    S.selectedId = parent.id;
    S.focusDetailField = shouldFocusDetail();
    /* Struktur-Verschachtelung ändert sich → Full-Render */
    renderAfterTreeChange();
  }

  function customActionLabel(actionId){

      assistant: t('assistant', 'outline.addAssistant'),

      comment: t('Kommentar', 'outline.addComment'),
      child: t('Unterpunkt', 'outline.addChild'),
      parent: t('Oberpunkt', 'outline.addParent')
    };
    return map[actionId] || actionId;

  /* Apple HIG help tags: Verb, no control name, sentence case, no period */
  function customActionTitle(actionId){
    const map = {

  function runCustomAction(actionId){
    if(actionId === 'user') addTemplate('user');
    else if(actionId === 'assistant') addTemplate('assistant');
    else if(actionId === 'tool') addTemplate('tool');
    else if(actionId === 'comment') addRootComment();
    else if(actionId === 'child'){
      if(S.selectedId){
        const f = findNode(S.tree, S.selectedId);
        if(f && f.node.kind === 'element') addChild(S.selectedId, false);
      }
    } else if(actionId === 'parent') addParent();
  }

  function setCustomButtonAction(index, actionId){

        }

  function deleteNode(id){
    const f = findNode(S.tree, id); if(!f) return;
   structUndoPush();
    pruneEditorHistForTree([f.node], activeTabId);
    const wasSelected = S.selectedId === id;
    const path = findPath(S.tree, id) || [];
    const parentNode = path.length > 1 ? path[path.length - 2] : null;
    f.arr.splice(f.index, 1);

    const wrap = outlineWrapForId(id);
    if(wrap && wrap.parentElement){
      const listParent = wrap.parentElement;
      wrap.remove();
      if(parentNode){
        const prow = outlineRowById(parentNode.id);
        if(prow){
          const hasCh = parentNode.children && parentNode.children.length > 0;
          const chev = prow.querySelector('.outline-chevron');
          if(chev){
            chev.classList.toggle('invisible', !hasCh);
            if(!hasCh){
              chev.textContent = '▸';
              parentNode.collapsed = false;
            }
          }
          updateOutlineCountForNode(parentNode);
        }
      }
      if(wasSelected){
        S.selectedId = firstNavigableId(S.tree);
        updateOutlineSelection(S.selectedId);
        scrollCaptureFrozen = true;
        renderDetail();
        requestAnimationFrame(() => { scrollCaptureFrozen = false; });
      }
      markActiveTabDraftDirty();
      scheduleDraftSave();
      scheduleSourceFromTree();
      if(listParent === outlineList && !outlineList.querySelector('.outline-row')){
        renderOutline();
      }
      return;
    }
    if(wasSelected) S.selectedId = firstNavigableId(S.tree);
    renderAfterTreeChange();
  }
  function outlineWrapForId(id){
    const row = outlineRowById(id);
    return row ? row.parentElement : null;
  }

  function moveNode(id, dir){
    const f = findNode(S.tree, id); if(!f) return;
    const ni = f.index + dir; if(ni < 0 || ni >= f.arr.length) return;
   structUndoPush();
    const other = f.arr[ni];
    const item = f.arr[f.index];
    f.arr[f.index] = other;
    f.arr[ni] = item;

    const wrapA = outlineWrapForId(id);
    const wrapB = outlineWrapForId(other.id);
    if(wrapA && wrapB && wrapA.parentElement && wrapA.parentElement === wrapB.parentElement){
      const parent = wrapA.parentElement;
      if(dir < 0) parent.insertBefore(wrapA, wrapB);
      else parent.insertBefore(wrapA, wrapB.nextSibling);
      markActiveTabDraftDirty();
      scheduleDraftSave();
      scheduleSourceFromTree();
      return;
    }
    renderAfterTreeChange();
  }
  function toggleCollapse(id, evt){
    if(evt) evt.stopPropagation();
    const f = findNode(S.tree, id); if(!f) return;
    f.node.collapsed = !f.node.collapsed;
    const row = outlineRowById(id);
    if(!row || !row.parentElement){
      renderOutline();
      return;
    }
    const wrap = row.parentElement;
    const depth = parseInt(row.dataset.depth || '0', 10) || 0;
    const hasCh = f.node.kind === 'element' && f.node.children && f.node.children.length > 0;
    const chev = row.querySelector('.outline-chevron');
    if(chev){
      chev.classList.toggle('invisible', !hasCh);
      chev.textContent = f.node.collapsed ? '▸' : '▾';
      chev.setAttribute('aria-label', f.node.collapsed
        ? t('Aufklappen', 'outline.expand')
        : t('Zuklappen', 'outline.collapse'));
      chev.setAttribute('aria-expanded', hasCh ? String(!f.node.collapsed) : 'false');
    }
    /* Kind-Zeilen sind Geschwister hinter der row im wrap – gezielt entfernen/neu aufbauen */
    while(wrap.childNodes.length > 1){
      wrap.removeChild(wrap.lastChild);
    }
    if(hasCh && !f.node.collapsed){
      f.node.children.forEach(ch => wrap.appendChild(renderOutlineRow(ch, depth + 1)));
    }
  }
  function updateOutlineSelection(nextId){
    if(!outlineList) return;
    outlineList.querySelectorAll('.outline-row.selected').forEach(r => r.classList.remove('selected'));
    if(!nextId) return;
    const row = typeof outlineRowById === 'function' ? outlineRowById(nextId) : null;
    if(row) row.classList.add('selected');
  }

  function selectNode(id){
    if(id && id === S.selectedId){
      return;
    }
    /* Ausstehende Source-Serialisierung vor Wechsel durchführen */
    if(typeof flushSourceFromTree === 'function') flushSourceFromTree();
    /* Nur Selektion: Outline-Klassen + Detail – kein Full-Rebuild der Struktur */
    captureScrollPositions();
    setSelectedId(id);
    updateOutlineSelection(S.selectedId);
    scrollCaptureFrozen = true;
    renderDetail();
    updateSourceFromTree();
    /* Tree → Source: Entsprechende Zeile im Source-View markieren */
    if(id) jumpToSourceForNode(id);
    restoreScrollPositions();
    requestAnimationFrame(() => { scrollCaptureFrozen = false; });
  }

  /* Struktur/Baum geändert → vollständiger Re-Render */

    btnReplace.title = t('Aktuelles Vorkommen ersetzen', 'find.replaceTitle');

    const btnReplaceAll = document.createElement('button');
    btnReplaceAll.type = 'button';
    btnReplaceAll.className = 'btn small';
    btnReplaceAll.textContent = t('Alle', 'find.replaceAll');
    btnReplaceAll.title = t('Alle Vorkommen ersetzen', 'find.replaceAllTitle');

    replaceRow.appendChild(replaceInput);
    replaceRow.appendChild(btnReplace);
    replaceRow.appendChild(btnReplaceAll);

    const options = document.createElement('div');
    options.className = 'find-options';

    const caseLabel = document.createElement('label');
    const caseCheck = document.createElement('input');
    caseCheck.type = 'checkbox';
    caseCheck.className = 'find-case';
    caseLabel.appendChild(caseCheck);
    caseLabel.appendChild(document.createTextNode(' Aa'));
    caseLabel.title = t('Groß-/Kleinschreibung beachten', 'find.caseTitle');

    const regexLabel = document.createElement('label');
    const regexCheck = document.createElement('input');
    regexCheck.type = 'checkbox';
    regexCheck.className = 'find-regex';
    regexLabel.appendChild(regexCheck);
    regexLabel.appendChild(document.createTextNode(' .*'));
    regexLabel.title = t('Regulärer Ausdruck', 'find.regexTitle');

    options.appendChild(caseLabel);
    options.appendChild(regexLabel);

    bar.appendChild(findRow);
    bar.appendChild(replaceRow);
    bar.appendChild(options);

    let matches = [];
    let currentIdx = -1;

    function getRegExp(){
      const q = findInput.value;
      if(!q) return null;
      const flags = caseCheck.checked ? 'g' : 'gi';
      try{
        if(regexCheck.checked) return new RegExp(q, flags);
        return new RegExp(escapeRegExp(q), flags);
      }catch(err){
        status.textContent = t('RegEx!', 'find.regexError');
        return null;
      }
    }

    function collectMatches(){
      const re = getRegExp();
      matches = [];
      currentIdx = -1;
      if(!re){ status.textContent = '0/0'; return; }
      const text = typeof getEditorValue === 'function' ? getEditorValue(textarea) : (textarea.value || '');
      let m;
      re.lastIndex = 0;
      while((m = re.exec(text)) !== null){
        matches.push({ index: m.index, length: m[0].length });
        if(m[0].length === 0) re.lastIndex++;
      }
      status.textContent = matches.length ? ('0/' + matches.length) : '0/0';
    }

    function selectMatch(i){
      if(i < 0 || i >= matches.length) return;
      currentIdx = i;
      const m = matches[i];
      try { textarea.focus(); } catch(_){}
      if(typeof setEditorSelection === 'function') setEditorSelection(textarea, m.index, m.index + m.length);
      else try { textarea.setSelectionRange(m.index, m.index + m.length); } catch(_){}
      const textBefore = (typeof getEditorValue === 'function' ? getEditorValue(textarea) : (textarea.value || '')).slice(0, m.index);
      const line = (textBefore.match(/\n/g) || []).length;
      const lineHeight = parseFloat(getComputedStyle(textarea).lineHeight) || 18;
      textarea.scrollTop = Math.max(0, (line - 2) * lineHeight);
      status.textContent = (i + 1) + '/' + matches.length;
    }

    function findNext(dir){
      collectMatches();
      if(!matches.length){ status.textContent = '0/0'; return; }
      const sel = typeof getEditorSelection === 'function' ? getEditorSelection(textarea) : { start: textarea.selectionStart, end: textarea.selectionEnd };
      const start = sel.start;
      const end = sel.end;
      let next = -1;
      if(dir > 0){
        for(let i = 0; i < matches.length; i++){
          if(matches[i].index >= end || (matches[i].index === start && matches[i].length === 0)){
            next = i; break;
          }
        }
        if(next < 0) next = 0;
      } else {
        for(let i = matches.length - 1; i >= 0; i--){
          if(matches[i].index < start){ next = i; break; }
        }
        if(next < 0) next = matches.length - 1;
      }
      selectMatch(next);
    }

    function doReplace(){
      if(currentIdx < 0 || currentIdx >= matches.length){
        findNext(1);
        if(currentIdx < 0) return;
      }
      const m = matches[currentIdx];
      const rep = replaceInput.value;
      const newPos = m.index + rep.length;
      if(typeof pushEditorUndo === 'function') pushEditorUndo(textarea);
      if(typeof replaceEditorRange === 'function') replaceEditorRange(textarea, m.index, m.index + m.length, rep, newPos);
      else if(typeof setEditorValue === 'function'){
        const text = getEditorValue(textarea);
        setEditorValue(textarea, text.slice(0, m.index) + rep + text.slice(m.index + m.length), newPos, newPos);
      }
      if(typeof commitEditorBaseline === 'function') commitEditorBaseline(textarea);
      collectMatches();
      if(matches.length){
        let next = matches.findIndex(mm => mm.index >= newPos);
        if(next < 0) next = 0;
        selectMatch(next);
      } else status.textContent = '0/0';
    }

    function doReplaceAll(){
      const re = getRegExp();
      if(!re) return;
      const rep = replaceInput.value;
      const text = typeof getEditorValue === 'function' ? getEditorValue(textarea) : (textarea.value || '');
      let count = 0;
      const newText = text.replace(re, () => { count++; return rep; });
      if(count === 0){ status.textContent = '0/0'; return; }
      const pos = (typeof getEditorSelection === 'function' ? getEditorSelection(textarea).start : textarea.selectionStart) || 0;
      if(typeof pushEditorUndo === 'function') pushEditorUndo(textarea);
      if(typeof setEditorValue === 'function') setEditorValue(textarea, newText, Math.min(pos, newText.length), Math.min(pos, newText.length));
      else {
        textarea.value = newText;
        textarea.dispatchEvent(new Event('input', { bubbles: true }));
      }
      if(typeof commitEditorBaseline === 'function') commitEditorBaseline(textarea);
      collectMatches();
      status.textContent = t('{n} ersetzt', 'find.replaced', {n: count});
      textarea.focus();
    }

    function closeBar(){
      bar.remove();
      if(textarea._findBar === bar) delete textarea._findBar;
      textarea.focus();
    }

    findInput.addEventListener('input', () => collectMatches());
    caseCheck.addEventListener('change', () => collectMatches());
    regexCheck.addEventListener('change', () => collectMatches());

    findInput.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); findNext(e.shiftKey ? -1 : 1); }
      else if(e.key === 'Escape'){ e.preventDefault(); closeBar(); }
    });
    replaceInput.addEventListener('keydown', e => {
      if(e.key === 'Enter'){ e.preventDefault(); doReplace(); }
      else if(e.key === 'Escape'){ e.preventDefault(); closeBar(); }
    });

    btnNext.onclick = () => findNext(1);
    btnPrev.onclick = () => findNext(-1);
    btnReplace.onclick = doReplace;
    btnReplaceAll.onclick = doReplaceAll;
    btnClose.onclick = closeBar;

    return bar;
  }

  function openFindReplace(textarea){
    if(!textarea) return;
    document.querySelectorAll('.find-replace-bar').forEach(b => {
      if(b !== textarea._findBar) b.remove();
    });
    if(textarea._findBar && textarea._findBar.isConnected){
      /* Bereits offen → bei erneutem Klick schließen (Toggle) */
      textarea._findBar.remove();
      delete textarea._findBar;
      textarea.focus();
      return;
    }
    const bar = buildFindReplaceBar(textarea);
    textarea._findBar = bar;
    /* Fokus-Editor: Leiste in focus-editor-body vor dem Wrap einfügen,
       damit die Zeichenanzahl-Anzeige (absolute am Wrap-Top) mit nach unten rückt */
    if(textarea.id === 'focusEditorTextarea' && textarea.parentElement && textarea.parentElement.parentElement){
      const body = textarea.parentElement.parentElement;
      body.insertBefore(bar, textarea.parentElement);
    } else if(textarea.parentElement){
      textarea.parentElement.insertBefore(bar, textarea);
    }
    const inp = bar.querySelector('.find-input');
    if(inp){
      const sel = (textarea.value || '').slice(textarea.selectionStart, textarea.selectionEnd);
      if(sel && sel.length < 200 && !sel.includes('\n')) inp.value = sel;
      /* Auf Mobile: nicht automatisch fokussieren (vermeidet ungewollte Tastatur bei Button-Klick) */
      if(!isMobileLayout()){ inp.focus(); inp.select(); }
    }
  }

  /* ===== Drag & Drop ===== */
  function clearDragStyles(){
    outlineList.querySelectorAll('.outline-row').forEach(r => {
      r.classList.remove('dragging', 'drag-over-above', 'drag-over-below');
    });
  }

  function canDropOn(sourceId, targetId){
    if(!sourceId || !targetId || sourceId === targetId) return false;
    const src = findNode(S.tree, sourceId);
    const tgt = findNode(S.tree, targetId);
    if(!src || !tgt) return false;
    return src.arr === tgt.arr;
  }

  function performDrop(sourceId, targetId, pos){
    if(!canDropOn(sourceId, targetId)) return;
   structUndoPush();
    const src = findNode(S.tree, sourceId);
    const tgt = findNode(S.tree, targetId);
    if(!src || !tgt || src.arr !== tgt.arr) return;
    const arr = src.arr;
    const from = src.index;
    let to = tgt.index;
    if(pos === 'below') to = tgt.index + 1;
    const item = arr.splice(from, 1)[0];
    if(from < to) to -= 1;
    arr.splice(to, 0, item);
    S.selectedId = sourceId;

    const srcWrap = outlineWrapForId(sourceId);
    const tgtWrap = outlineWrapForId(targetId);
    if(srcWrap && tgtWrap && srcWrap.parentElement && srcWrap.parentElement === tgtWrap.parentElement){
      const parent = srcWrap.parentElement;
      if(pos === 'above') parent.insertBefore(srcWrap, tgtWrap);
      else parent.insertBefore(srcWrap, tgtWrap.nextSibling);
      updateOutlineSelection(S.selectedId);
      markActiveTabDraftDirty();
      scheduleDraftSave();
      scheduleSourceFromTree();
      return;
    }
    renderAfterTreeChange();
  }

  function getPreviewText(node){
    if(node.kind === 'comment') return (node.text||'').trim().slice(0,36);
    const t = (node.text||'').trim(); if(t) return t.slice(0,36);
    return '';
  }

  /* ===== Outline-Filter & Collapse-to-Level ===== */
  let outlineFilterTimer = null;
  let outlineFilterQuery = '';

  function applyOutlineFilter(){
    if(!outlineList) return;
    const q = outlineFilterQuery.trim().toLowerCase();
    if(!q){
      outlineList.classList.remove('filtering');
      outlineList.querySelectorAll('.outline-row').forEach(r => {
        r.classList.remove('filtered-out', 'filter-match');
      });
      return;
    }
    outlineList.classList.add('filtering');
    /* Alle Rows durchlaufen, Match + Vorfahren sichtbar lassen */
    const matchIds = new Set();
    const ancestorIds = new Set();
    (function walk(nodes, parents){
      for(const n of nodes){
        const tag = (n.tag||'').toLowerCase();
        const text = (n.text||'').toLowerCase();
        if(tag.includes(q) || text.includes(q)){
          matchIds.add(n.id);
          parents.forEach(p => ancestorIds.add(p));
        }
        if(n.children && n.children.length){
          walk(n.children, parents.concat([n.id]));
        }
      }
    })(S.tree, []);
    outlineList.querySelectorAll('.outline-row').forEach(row => {
      const id = row.dataset.id;
      if(matchIds.has(id)){
        row.classList.remove('filtered-out');
        row.classList.add('filter-match');
      } else if(ancestorIds.has(id)){
        row.classList.remove('filtered-out', 'filter-match');
      } else {
        row.classList.add('filtered-out');
        row.classList.remove('filter-match');
      }
    });
  }

  function collapseToLevel(maxDepth){
    (function walk(nodes, depth){
      nodes.forEach(n => {
        if(n.kind === 'element' && n.children && n.children.length){
          n.collapsed = depth >= maxDepth;
          walk(n.children, depth + 1);
        }
      });
    })(S.tree, 1);
    renderOutline();
    markActiveTabDraftDirty();
    scheduleDraftSave();
    scheduleSourceFromTree();
  }

  function collapseAll(){
    (function walk(nodes){
      nodes.forEach(n => {
        if(n.kind === 'element' && n.children && n.children.length) n.collapsed = true;
        if(n.children) walk(n.children);
      });
    })(S.tree);
    renderOutline();
    markActiveTabDraftDirty();
    scheduleDraftSave();
    scheduleSourceFromTree();
  }

  function expandAll(){
    (function walk(nodes){
      nodes.forEach(n => {
        n.collapsed = false;
        if(n.children) walk(n.children);
      });
    })(S.tree);
    renderOutline();
    markActiveTabDraftDirty();
    scheduleDraftSave();
    scheduleSourceFromTree();
  }

  /* ===== Schema-Learning (Autocomplete für Tag-Input) ===== */
  /* Lernt aus dem aktuellen Tree, welche Tags als Kinder eines Parent-Tags
     vorkommen. Liefert Vorschläge für das Tag-Input-Feld. */
  function buildSchemaMap(){
    const map = new Map(); /* parentTag → Map<childTag, count> */
    (function walk(nodes, parentTag){
      for(const n of nodes){
        if(n.kind === 'element' && n.tag){
          const tag = n.tag.toLowerCase();
          if(parentTag){
            if(!map.has(parentTag)) map.set(parentTag, new Map());
            const children = map.get(parentTag);
            children.set(tag, (children.get(tag) || 0) + 1);
          }
          if(n.children && n.children.length) walk(n.children, tag);
        }
      }
    })(S.tree, null);
    return map;
  }

  function getTagSuggestions(parentTag){
    const schema = buildSchemaMap();
    const key = (parentTag || '').toLowerCase();
    if(!schema.has(key)) return [];
    const children = schema.get(key);
    return Array.from(children.entries())
      .sort((a, b) => b[1] - a[1])
      .map(([tag, count]) => tag);
  }

  /* ===== Offset-Map (Tree → Source Jump) ===== */
  /* Erweitert serializeTreeWithLines um Zeichen-Offsets für jeden Node.
     Damit kann beim Selektieren im Tree die entsprechende Source-Zeile
     markiert werden. */
  function buildOffsetMap(nodes, depth, state){
    depth = depth || 0;
    state = state || {text: '', offsets: {}};
    const pad = '  '.repeat(depth);
    for(const node of nodes){
      if(node.kind === 'comment'){
        const s = (node.text||'').trim().replace(/--/g,'- -');
        if(s){
          state.offsets[node.id] = state.text.length;
          state.text += pad + '<!-- ' + s + ' -->\n';
        }
        continue;
      }
      const tag = sanitizeTagName((node.tag && node.tag.trim()) || '') || 'element';
      const hasCh = node.children && node.children.length;
      const text = dedentText(node.text == null ? '' : String(node.text));
      state.offsets[node.id] = state.text.length;
      if(hasCh){
        state.text += pad + '<' + tag + '>\n';
        if(text.length){
          if(text.includes('\n')) text.split('\n').forEach(l => state.text += pad + '  ' + escapeXML(l) + '\n');
          else state.text += pad + '  ' + escapeXML(text) + '\n';
        }
        buildOffsetMap(node.children, depth + 1, state);
        state.text += pad + '</' + tag + '>\n';
      } else {
        if(text.includes('\n')){
          state.text += pad + '<' + tag + '>\n';
          text.split('\n').forEach(l => state.text += pad + '  ' + escapeXML(l) + '\n');
          state.text += pad + '</' + tag + '>\n';
        } else {
          state.text += pad + '<' + tag + '>' + escapeXML(text) + '</' + tag + '>\n';
        }
      }
    }
    return state;
  }

  function getFullOffsetMap(){
    const state = {text: '<prompt>\n', offsets: {}};
    buildOffsetMap(S.tree, 1, state);
    state.text += '</prompt>';
    return state;
  }

  /* Tree → Source: Selektierte Node im Source-View markieren */
  function jumpToSourceForNode(nodeId){
    if(!sourceText || !nodeId) return;
    if(sourcePanel.style.display === 'none' || sourcePanel.style.display === '') return;
    const map = getFullOffsetMap();
    const offset = map.offsets[nodeId];
    if(offset == null) return;
    /* Offset ist relativ zum <prompt>-Body → +Länge von '<prompt>\n' */
    const fullOffset = '<prompt>\n'.length + offset;
    const text = getEditorValue(sourceText);
    /* Zeile finden für Scroll */
    const prefix = text.slice(0, fullOffset);
    const line = (prefix.match(/\n/g) || []).length;
    /* Ende des Tags finden (bis zur nächsten Zeile) */
    const lineEnd = text.indexOf('\n', fullOffset);
    const endPos = lineEnd === -1 ? text.length : lineEnd;
    if(typeof setEditorSelection === 'function') setEditorSelection(sourceText, fullOffset, endPos);
    else try { sourceText.setSelectionRange(fullOffset, endPos); } catch(_){}
    const lineHeight = parseFloat(getComputedStyle(sourceText).lineHeight) || 18;
    sourceText.scrollTop = Math.max(0, (line - 2) * lineHeight);
  }

  /* ===== Protokoll-Einträge klickbar (Jump-to-Node + Source) ===== */
  function makeProtocolEntryClickable(entry, issue){
    if(!entry || !issue) return;

    entry.title = t('Zum Eintrag springen', 'protocol.jumpTitle');

  /* ===== Structural Diff (zwischen zwei Tree-Snapshots) ===== */
  /* Vergleicht zwei Bäume und liefert eine lesbare Zusammenfassung der
     Änderungen (hinzugefügt, entfernt, umbenannt, Text geändert). */
  function treeToMap(nodes, parentTag, out){
    out = out || {};
    for(const n of (nodes || [])){
      out[n.id] = {
        tag: n.tag || '',
        text: (n.text || '').trim().slice(0, 60),
        kind: n.kind,
        parentTag: parentTag || ''
      };
      if(n.children) treeToMap(n.children, n.tag, out);
    }
    return out;
  }

  function diffTrees(oldTree, newTree){
    const oldMap = treeToMap(oldTree);
    const newMap = treeToMap(newTree);
    const added = [], removed = [], renamed = [], textChanged = [];
    for(const [id, info] of Object.entries(newMap)){
      if(!oldMap[id]){
        added.push(info.kind === 'comment' ? '💬 Kommentar' : '<' + info.tag + '>');
      } else {
        if(info.kind === 'element' && oldMap[id].tag !== info.tag){
          renamed.push('<' + oldMap[id].tag + '> → <' + info.tag + '>');
        }
        if(oldMap[id].text !== info.text){
          textChanged.push(info.kind === 'comment' ? '💬' : '<' + info.tag + '>');
        }
      }
    }
    for(const [id, info] of Object.entries(oldMap)){
      if(!newMap[id]){
        removed.push(info.kind === 'comment' ? '💬 Kommentar' : '<' + info.tag + '>');
      }
    }
    return {added, removed, renamed, textChanged};
  }

  function formatTreeDiff(diff){
    const parts = [];
    if(diff.added.length) parts.push(t('Hinzugefügt: {items}', 'diff.added', {items: diff.added.join(', ')}));
    if(diff.removed.length) parts.push(t('Entfernt: {items}', 'diff.removed', {items: diff.removed.join(', ')}));
    if(diff.renamed.length) parts.push(t('Umbenannt: {items}', 'diff.renamed', {items: diff.renamed.join(', ')}));
    if(diff.textChanged.length) parts.push(t('Text geändert: {items}', 'diff.textChanged', {items: diff.textChanged.join(', ')}));
    return parts.length ? parts.join(' · ') : t('Keine Strukturänderung', 'diff.noChange');
  }

  /* ===== Outline ===== */
  function renderOutline(){
    bindOutlineScroll();
    /* Während Rebuild kein Capture: innerHTML setzt scrollTop kurz auf 0 und würde Tab-State überschreiben */
    outlineScrollFrozen = true;
    outlineList.innerHTML = '';
    if(!S.tree.length){
      const e = document.createElement('div');
      e.className = 'outline-empty';
      e.textContent = t('Noch keine Elemente. Lege unten ein Element oder einen Kommentar an.', 'outline.empty');
      outlineList.appendChild(e);
      restoreOutlineScroll();
      requestAnimationFrame(() => { outlineScrollFrozen = false; });
      return;
    }
    S.tree.forEach(n => outlineList.appendChild(renderOutlineRow(n, 0)));
    restoreOutlineScroll();
    requestAnimationFrame(() => { outlineScrollFrozen = false; });
  }

  function renderOutlineRow(node, depth){
    const wrap = document.createElement('div');
    const row = document.createElement('div');
    row.className = 'outline-row depth-'+Math.min(depth,4);
    row.style.paddingLeft = (8 + depth*14)+'px';
    if(node.id === S.selectedId) row.classList.add('selected');
    if(node._hasError) row.classList.add('error');
    row.dataset.id = node.id;
    row.dataset.depth = String(depth);
    row.setAttribute('role', 'treeitem');
    row.setAttribute('aria-level', String(depth + 1));
    row.tabIndex = 0;
    row.draggable = true;

    row.onclick = (e) => {
      if(e.target.closest('.outline-open') || e.target.closest('.outline-chevron')) return;
      selectNode(node.id);
    };
    row.onkeydown = e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); selectNode(node.id); }
    };

    row.addEventListener('dragstart', e => {
      dragId = node.id;
      row.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      e.dataTransfer.setData('text/plain', node.id);
      requestAnimationFrame(() => row.classList.add('dragging'));
    });
    row.addEventListener('dragend', () => {
      dragId = null; dragOverId = null; dragOverPos = null; clearDragStyles();
    });
    row.addEventListener('dragover', e => {
      if(!dragId || !canDropOn(dragId, node.id)) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      const rect = row.getBoundingClientRect();
      const mid = rect.top + rect.height / 2;
      const pos = e.clientY < mid ? 'above' : 'below';
      if(dragOverId !== node.id || dragOverPos !== pos){
        clearDragStyles();
        const srcRow = outlineRowById(dragId);
        if(srcRow) srcRow.classList.add('dragging');
        row.classList.add(pos === 'above' ? 'drag-over-above' : 'drag-over-below');
        dragOverId = node.id;
        dragOverPos = pos;
      }
    });
    row.addEventListener('dragleave', e => {
      if(!row.contains(e.relatedTarget)) row.classList.remove('drag-over-above', 'drag-over-below');
    });
    row.addEventListener('drop', e => {
      e.preventDefault();
      const srcId = dragId || e.dataTransfer.getData('text/plain');
      const pos = dragOverPos || 'below';
      clearDragStyles();
      if(srcId) performDrop(srcId, node.id, pos);
      dragId = null; dragOverId = null; dragOverPos = null;
    });

    row.addEventListener('touchstart', e => {
      if(e.touches.length !== 1) return;
      touchStartY = e.touches[0].clientY;
      isTouchDragging = false;
      longPressTimer = setTimeout(() => {
        isTouchDragging = true;
        dragId = node.id;
        row.classList.add('dragging');
        if(navigator.vibrate) try { navigator.vibrate(30); } catch(_){}
      }, 420);
    }, {passive: true});

    row.addEventListener('touchmove', e => {
      if(!longPressTimer && !isTouchDragging) return;
      const touch = e.touches[0];
      if(!isTouchDragging){
        if(Math.abs(touch.clientY - touchStartY) > 10){
          clearTimeout(longPressTimer);
          longPressTimer = null;
        }
        return;
      }
      e.preventDefault();
      const el = document.elementFromPoint(touch.clientX, touch.clientY);
      const targetRow = el && el.closest ? el.closest('.outline-row') : null;
      if(targetRow && targetRow.dataset.id && canDropOn(dragId, targetRow.dataset.id)){
        const rect = targetRow.getBoundingClientRect();
        const mid = rect.top + rect.height / 2;
        const pos = touch.clientY < mid ? 'above' : 'below';
        if(dragOverId !== targetRow.dataset.id || dragOverPos !== pos){
          clearDragStyles();
          row.classList.add('dragging');
          targetRow.classList.add(pos === 'above' ? 'drag-over-above' : 'drag-over-below');
          dragOverId = targetRow.dataset.id;
          dragOverPos = pos;
        }
      }
    }, {passive: false});

    row.addEventListener('touchend', () => {
      clearTimeout(longPressTimer);
      longPressTimer = null;
      if(isTouchDragging && dragId && dragOverId) performDrop(dragId, dragOverId, dragOverPos || 'below');
      isTouchDragging = false;
      dragId = null; dragOverId = null; dragOverPos = null;
      clearDragStyles();
    });

    row.addEventListener('touchcancel', () => {
      clearTimeout(longPressTimer);
      longPressTimer = null;
      isTouchDragging = false;
      dragId = null; dragOverId = null; dragOverPos = null;
      clearDragStyles();
    });

    const hasCh = node.kind === 'element' && node.children && node.children.length;
    const chev = document.createElement('button');
    chev.className = 'outline-chevron'+(hasCh?'':' invisible');
    chev.setAttribute('aria-label', node.collapsed ? t('Aufklappen', 'outline.expand') : t('Zuklappen', 'outline.collapse'));
    chev.setAttribute('aria-expanded', hasCh ? String(!node.collapsed) : 'false');
    chev.textContent = node.collapsed ? '▸' : '▾';
    chev.onclick = e => toggleCollapse(node.id, e);
    row.appendChild(chev);

      if(node.kind === 'comment'){
        /* Kommentar: kein Tag-Titel, nur der Text mit Fade am Ende */
        const lab = document.createElement('span');
        lab.className = 'outline-comment';
        lab.textContent = '💬 '+((node.text||'').trim().slice(0,64) || t('Anmerkung', 'outline.commentLabel'));
        row.appendChild(lab);
      } else {
      const lab = document.createElement('span');
      lab.className = 'outline-tag'+(node.tag.trim()?'':' empty');
      lab.textContent = node.tag.trim()||t('(ohne Namen)', 'outline.noName');
      row.appendChild(lab);
      const prev = document.createElement('span');
      prev.className = 'outline-preview';
      prev.textContent = getPreviewText(node);
      row.appendChild(prev);
      updateOutlineCount(row, node.children.length);
    }

    const openBtn = document.createElement('button');
    openBtn.type = 'button';
    openBtn.className = 'outline-open';
    openBtn.setAttribute('aria-label', t('Im Editor öffnen', 'outline.openEditor'));
    openBtn.textContent = '›';
    openBtn.onclick = e => {
      e.stopPropagation();
      selectNode(node.id);
      openMobileDetail();
    };
    row.appendChild(openBtn);

    wrap.appendChild(row);
    if(hasCh && !node.collapsed) node.children.forEach(ch => wrap.appendChild(renderOutlineRow(ch, depth+1)));
    return wrap;
  }
  
  function render(){
    applyPerformanceMode();
    scrollCaptureFrozen = true;
    renderOutline();
    renderDetail();
    updateSourceFromTree();
    /* Tree speichern, Scroll nicht aus (noch falschem) DOM lesen */
    saveActiveTab({ captureScroll: false });
    /* Scroll erst im nächsten Frame setzen – renderOutline() hat outlineScrollFrozen
        bis dahin noch aktiv, sodass der Scroll-Listener nicht dazwischenfunkt. */
    requestAnimationFrame(() => {
      restoreScrollPositions();
      scrollCaptureFrozen = false;
      updateStructUndoButtons();
    });
  }

  /* ===== Detail-Editor (mit Nested-Optionen-Menü) ===== */
  function renderDetail(){
    /* Inkrementelles Update: wenn gleicher Knoten-Typ und gleiche Tools-Layout,
       nur Werte aktualisieren statt komplett neu aufbauen (§2.1). */
    if(S.tree.length && S.selectedId){
      const incFound = findNode(S.tree, S.selectedId);
      if(incFound && detailScroll.firstChild && detailScroll._renderedId === S.selectedId){
        const incNode = incFound.node;
        const incIsContainer = incNode.kind === 'element' && incNode.children && incNode.children.length > 0;
        const incWasContainer = !!detailScroll._renderedContainer;
        const incToolsMode = useUnpackedTools();
        if(incNode.kind === detailScroll._renderedKind && incIsContainer === incWasContainer && incToolsMode === detailScroll._renderedToolsMode){
          /* Level-Bar aktualisieren (Breadcrumb ändert sich bei Move) */
          const incPath = findPath(S.tree, incNode.id) || [];
          const incDepth = incPath.length;
          const oldBar = detailScroll.querySelector('.level-bar');
          if(oldBar){
            const newBar = buildLevelBar(incPath, incDepth);
            oldBar.replaceWith(newBar);
          }
          /* Tag-Input aktualisieren */
          if(incNode.kind !== 'comment'){
            const tagInput = detailScroll.querySelector('.detail-tag-input');
            if(tagInput && document.activeElement !== tagInput){
              tagInput.value = incNode.tag;
            }
          }
          /* Textarea aktualisieren */
          const ta = detailScroll.querySelector('.detail-textarea');
          if(ta){
            if(incIsContainer){
              if(!ta.disabled) ta.disabled = true;
              if(ta.value !== '') setEditorValue(ta, '');
              ta.placeholder = t('Dieser Tag ist ein Container.', 'detail.containerPlaceholder');
            } else {
              if(ta.disabled) ta.disabled = false;
              const curVal = getEditorValue(ta);
              if(document.activeElement !== ta && curVal !== (incNode.text || '')){
                setEditorValue(ta, incNode.text || '');
              }
              ta.placeholder = incNode.kind === 'comment'
                ? t('Anmerkung…', 'detail.commentPlaceholder')
                : t('Text für dieses Element…', 'detail.textPlaceholder');
            }
            updateDetailFieldCharCount(ta);
          }
          /* Paste-Button State */
          const pasteBtn = detailScroll.querySelector('.btn-paste-node');
          if(pasteBtn) pasteBtn.disabled = !nodeClipboard;
          /* Focus wenn gewünscht */
          if(S.focusDetailField && shouldFocusDetail()){
            S.focusDetailField = false;
            const ti = detailScroll.querySelector('.detail-tag-input');
            const ta2 = detailScroll.querySelector('.detail-textarea');
            if(ti && incNode.kind !== 'comment') ti.focus();
            else if(ta2) ta2.focus();
          } else {
            S.focusDetailField = false;
          }
          return;
        }
      }
    }

    detailScroll.innerHTML = '';
    document.querySelectorAll('.tools-options-menu').forEach(m => m.remove());

    if(!S.tree.length){ detailScroll._renderedId = null; detailScroll.appendChild(buildEmptyState()); return; }
    if(!S.selectedId || !findNode(S.tree, S.selectedId)) S.selectedId = firstNavigableId(S.tree);
    const found = S.selectedId ? findNode(S.tree, S.selectedId) : null;
    if(!found){ detailScroll._renderedId = null; detailScroll.appendChild(buildEmptyState()); return; }
    const node = found.node;
    const path = findPath(S.tree, node.id)||[];
    const depth = path.length;

    detailScroll.appendChild(buildLevelBar(path, depth));

    if(node.kind === 'comment'){
      const head = document.createElement('div'); head.className = 'detail-heading-row';
      const h = document.createElement('span'); h.className = 'comment-heading'; h.textContent = t('💬 Anmerkung', 'detail.commentHeading');
      head.appendChild(h); detailScroll.appendChild(head);
    } else {
      const head = document.createElement('div'); head.className = 'detail-heading-row';
      const oa = document.createElement('span'); oa.className = 'detail-angle'; oa.textContent = '<';
      head.appendChild(oa);
      const tagInput = document.createElement('input');
      tagInput.className = 'detail-tag-input'; tagInput.type = 'text';
      tagInput.dataset.historyKey = 'detail-tag-' + (activeTabId || 'tab') + '-' + node.id;
      /* Bestehende ungültige Namen (z.B. mit Ziffer am Anfang) einmalig korrigieren */
      if(node.tag && node.tag !== sanitizeTagName(node.tag)){
        node.tag = sanitizeTagName(node.tag);
      }
      tagInput.value = node.tag;
      tagInput.placeholder = t('tag-name', 'detail.tagPlaceholder'); tagInput.autocomplete = 'off'; tagInput.spellcheck = false;
      tagInput.setAttribute('aria-label', t('Tag-Name', 'detail.tagAria'));
      tagInput.setAttribute('list', 'tagSuggestions');
      tagInput.oninput = e => {
        node.tag = sanitizeTagName(e.target.value);
        e.target.value = node.tag;
        updateOutlineLabelFor(node.id, node.tag);
        scheduleSourceFromTree();
      };
      /* Schema-Learning: Vorschläge basierend auf Parent-Tag aktualisieren */
      const parentForSchema = path.length > 1 ? path[path.length - 2] : null;
      const parentTag = parentForSchema ? (parentForSchema.tag || '') : '';
      tagInput.onfocus = () => refreshTagSuggestions(parentTag);
      head.appendChild(tagInput);
      const ca = document.createElement('span'); ca.className = 'detail-angle'; ca.textContent = '>';
      head.appendChild(ca);
      detailScroll.appendChild(head);
    }

    const tools = document.createElement('div'); tools.className = 'detail-tools';

    const moveGroup = document.createElement('div');
    moveGroup.className = 'move-group';
    const btnUp = document.createElement('button');
    btnUp.type = 'button';
    btnUp.className = 'btn small icon-only';
    btnUp.setAttribute('aria-label', t('Nach oben', 'detail.moveUp'));
    btnUp.title = t('Eintrag nach oben', 'detail.moveUpTitle');
    btnUp.textContent = '↑';
    btnUp.onclick = () => { if(S.selectedId) moveNode(S.selectedId, -1); };
    const btnDown = document.createElement('button');
    btnDown.type = 'button';
    btnDown.className = 'btn small icon-only';
    btnDown.setAttribute('aria-label', t('Nach unten', 'detail.moveDown'));
    btnDown.title = t('Eintrag nach unten', 'detail.moveDownTitle');
    btnDown.textContent = '↓';
    btnDown.onclick = () => { if(S.selectedId) moveNode(S.selectedId, 1); };
    moveGroup.appendChild(btnUp);
    moveGroup.appendChild(btnDown);
    tools.appendChild(moveGroup);

    const textareaWrap = document.createElement('div'); textareaWrap.className = 'detail-textarea-wrap';
    const textarea = document.createElement('textarea');
    textarea.className = 'detail-textarea'+(node.kind==='comment'?' comment-style':'')+(detailTextLineWrap?'':' wrap-off');
    textarea.dataset.historyKey = 'detail-' + (activeTabId || 'tab') + '-' + node.id;
    const isContainer = node.kind === 'element' && node.children && node.children.length > 0;
    if(isContainer){
      textarea.disabled = true;
      textarea.placeholder = t('Dieser Tag ist ein Container.', 'detail.containerPlaceholder');
      textarea.value = '';
    } else {
      textarea.placeholder = node.kind==='comment'?t('Anmerkung…', 'detail.commentPlaceholder'):t('Text für dieses Element…', 'detail.textPlaceholder');
      textarea.value = node.text||'';
    }
    textarea.setAttribute('aria-label', node.kind==='comment' ? t('Kommentartext', 'detail.commentAria') : t('Elementtext', 'detail.textAria'));
    textarea.oninput = e => {
      if(isContainer) return;
      node.text = e.target.value;
      if(node.kind === 'comment') updateOutlineLabelFor(node.id, null, node.text);
      else updateOutlinePreview(node.id, node.text);
      scheduleSourceFromTree();
      updateDetailFieldCharCount(textarea);
    };
    textarea.addEventListener('keydown', e => {
      if((e.ctrlKey || e.metaKey) && e.key === 'f'){
        e.preventDefault();
        openFindReplace(textarea);
      }
    });
    textareaWrap.appendChild(textarea);
    if(!isContainer){
      ensureDetailCharCountStack(textareaWrap);
      updateDetailFieldCharCount(textarea);
      enhanceTextEditor(textarea, {
        historyKey: 'detail-' + (activeTabId || 'tab') + '-' + node.id,
        charCount: true
      });
      bindDetailTextareaScroll(textarea, node.id);
      const sc = getActiveTabScroll();
      if(sc && sc.fields && sc.fields[node.id] != null){
        const y = sc.fields[node.id];
        requestAnimationFrame(() => { textarea.scrollTop = y; });
      }
    }

    const wikiWrap = createWikiSplitButton(textarea);

    if(useUnpackedTools()){
      const btnCopyNode = document.createElement('button');
      btnCopyNode.type = 'button';
      btnCopyNode.className = 'btn small';
      btnCopyNode.textContent = t('Kopieren', 'detail.copy');
      btnCopyNode.title = t('Ausgewählten Punkt kopieren', 'detail.copyTitle');
      btnCopyNode.onclick = () => copySelectedNode();
      tools.appendChild(btnCopyNode);

      const btnPasteNode = document.createElement('button');
      btnPasteNode.type = 'button';
      btnPasteNode.className = 'btn small btn-paste-node';
      btnPasteNode.textContent = t('Einfügen', 'detail.paste');
      btnPasteNode.title = t('Kopierten Punkt einfügen', 'detail.pasteTitle');
      btnPasteNode.disabled = !nodeClipboard;
      btnPasteNode.onclick = () => pasteNode();
      tools.appendChild(btnPasteNode);

      const btnFind = document.createElement('button');
      btnFind.type = 'button';
      btnFind.className = 'btn small';
      btnFind.textContent = t('Suchen', 'detail.find');
      btnFind.title = t('Suchen und Ersetzen', 'detail.findTitle');
      btnFind.onclick = () => openFindReplace(textarea);
      if(!isMobileLayout()) tools.appendChild(btnFind);

      const btnDetailWrap = document.createElement('button');
      btnDetailWrap.type = 'button';
      btnDetailWrap.className = 'btn small';
      btnDetailWrap.textContent = detailTextLineWrap ? t('Umbruch an', 'detail.wrapOn') : t('Umbruch aus', 'detail.wrapOff');
      btnDetailWrap.title = t('Zeilenumbruch umschalten', 'detail.wrapTitle');
      btnDetailWrap.setAttribute('aria-pressed', detailTextLineWrap ? 'true' : 'false');
      btnDetailWrap.onclick = () => {
        detailTextLineWrap = !detailTextLineWrap;
        writeHashState();
        applyDetailLineWrap();
        btnDetailWrap.textContent = detailTextLineWrap ? t('Umbruch an', 'detail.wrapOn') : t('Umbruch aus', 'detail.wrapOff');
        btnDetailWrap.setAttribute('aria-pressed', detailTextLineWrap ? 'true' : 'false');
      };
      tools.appendChild(btnDetailWrap);

      tools.appendChild(wikiWrap);
    } else {
      /* Mobile: Pfeile + Optionen (Wiki nur im Fokus-Editor) */
      const optionsWrap = document.createElement('div');
      optionsWrap.className = 'options-wrap';

      const btnOptions = document.createElement('button');
      btnOptions.type = 'button';
      btnOptions.className = 'btn small';
      btnOptions.setAttribute('aria-haspopup', 'true');
      btnOptions.setAttribute('aria-expanded', 'false');
      btnOptions.textContent = t('Optionen', 'detail.options');

      const menu = document.createElement('div');
      menu.className = 'options-menu tools-options-menu';
      menu.setAttribute('role', 'menu');

      /* --- Level 0: Hauptmenü --- */
      const level0 = document.createElement('div');
      level0.className = 'menu-level active';
      level0.dataset.level = '0';

      const optCopy = document.createElement('button');
      optCopy.type = 'button';
      optCopy.className = 'opt-item';
      optCopy.setAttribute('role', 'menuitem');
      optCopy.textContent = t('Kopieren', 'detail.copy');
      optCopy.onclick = e => {
        e.stopPropagation();
        copySelectedNode();
        /* Einfügen-Button im gleichen Menü sofort enablen */
        const pasteInMenu = menu.querySelector('.btn-paste-node');
        if(pasteInMenu) pasteInMenu.disabled = false;
      };
      level0.appendChild(optCopy);

      const optPaste = document.createElement('button');
      optPaste.type = 'button';
      optPaste.className = 'opt-item btn-paste-node';
      optPaste.setAttribute('role', 'menuitem');
      optPaste.textContent = t('Einfügen', 'detail.paste');
      optPaste.disabled = !nodeClipboard;
      optPaste.onclick = e => {
        e.stopPropagation();
        closeOptionsMenu();
        pasteNode();
      };
      level0.appendChild(optPaste);

      menu.appendChild(level0);

      btnOptions.onclick = e => {
        e.stopPropagation();
        openToolsOptionsMenu(btnOptions, menu);
      };

      optionsWrap.appendChild(btnOptions);
      optionsWrap.appendChild(menu);
      tools.appendChild(optionsWrap);
    }

    detailScroll.appendChild(tools);
    detailScroll.appendChild(textareaWrap);

    if(S.focusDetailField && shouldFocusDetail()){
      S.focusDetailField = false;
      const ti = detailScroll.querySelector('.detail-tag-input');
      const ta = detailScroll.querySelector('.detail-textarea');
      if(ti) ti.focus(); else if(ta) ta.focus();
    } else {
      S.focusDetailField = false;
    }
    /* Tracking für inkrementelles Update (§2.1) */
    detailScroll._renderedId = S.selectedId;
    detailScroll._renderedKind = node ? node.kind : null;
    detailScroll._renderedContainer = node ? (node.kind === 'element' && node.children && node.children.length > 0) : false;
    detailScroll._renderedToolsMode = useUnpackedTools();
  }

  function buildLevelBar(path, depth){
    const bar = document.createElement('div'); bar.className = 'level-bar';
    const badge = document.createElement('div'); badge.className = 'level-badge';
    badge.innerHTML = '<span class="lvl-num">'+depth+'</span> '+t('Ebene {n}', 'detail.level', {n: depth});
    bar.appendChild(badge);
    const bc = document.createElement('div'); bc.className = 'breadcrumb';
    path.forEach((n,i) => {
      if(i > 0){ const s = document.createElement('span'); s.className = 'sep'; s.textContent = '›'; bc.appendChild(s); }
      const btn = document.createElement('button');
      btn.textContent = n.kind==='comment'?'💬':(n.tag.trim()||'(?)');
      if(i === path.length-1) btn.classList.add('current');
      btn.onclick = () => selectNode(n.id);
      bc.appendChild(btn);
    });
    bar.appendChild(bc);

    const closeBtn = document.createElement('button');
    closeBtn.type = 'button';
    closeBtn.className = 'detail-close';
    closeBtn.setAttribute('aria-label', t('Editor schließen', 'detail.closeEditor'));
    closeBtn.textContent = '×';
    closeBtn.onclick = () => closeMobileDetail();
    bar.appendChild(closeBtn);
    return bar;
  }

  function buildEmptyState(){
    const empty = document.createElement('div'); empty.className = 'detail-empty';
    empty.innerHTML = '<p>' + t('Wähle links ein Element aus oder lege unten ein neues an.', 'detail.empty') + '</p>';
    return empty;
  }

  function outlineRowById(id){
    if(!outlineList || id == null || id === '') return null;
    const esc = (window.CSS && CSS.escape) ? CSS.escape(String(id)) : String(id).replace(/"/g, '\\"');
    return outlineList.querySelector('.outline-row[data-id="'+esc+'"]');
  }

  function updateOutlineLabelFor(id, tagValue, commentValue){
    const row = outlineRowById(id); if(!row) return;
    if(tagValue != null){
      const lab = row.querySelector('.outline-tag');
      if(lab){
        const tv = tagValue.trim();
        lab.textContent = tv||t('(ohne Namen)', 'outline.noName');
        lab.classList.toggle('empty', !tv);
      }
    }
    if(commentValue != null){
      const lab = row.querySelector('.outline-comment');
      if(lab) lab.textContent = '💬 '+((commentValue||'').trim().slice(0,64)||t('Anmerkung', 'outline.commentLabel'));
    }
  }
  
  function updateOutlinePreview(id, text){
    const row = outlineRowById(id); if(!row) return;
    const p = row.querySelector('.outline-preview'); if(p) p.textContent = (text||'').trim().slice(0,36);
  }

  let sourceFromTreeTimer = null;
  function updateSourceFromTree(){
    if(sourceFromTreeTimer){ clearTimeout(sourceFromTreeTimer); sourceFromTreeTimer = null; }
    if(!S.sourceFocused && !sourceDirty) {
      const prevScroll = sourceText ? sourceText.scrollTop : 0;
      const next = sourceGesamtMode ? serializeGesamtConfig() : getCopyResultText();
      if(sourceText){
        sourceText.value = next;
        const sc = getActiveTabScroll();
        const y = sc && sc.source != null ? sc.source : prevScroll;
        sourceText.scrollTop = y;
      }
    }
    updateResultCharCount();
    updateSourceDirtyIndicator();
  }

  function updateSourceDirtyIndicator(){
    const btn = document.getElementById('btnApplySource');
    if(!btn) return;
    let dot = btn.querySelector('.source-dirty-dot');
    if(sourceDirty){
      if(!dot){ dot = document.createElement('span'); dot.className = 'source-dirty-dot'; btn.appendChild(dot); }
    } else if(dot){
      dot.remove();
    }
  }

  /* Beim Tippen: Source/Ergebnis nicht bei jedem Tastendruck serialisieren */
  function scheduleSourceFromTree(){
    markActiveTabDraftDirty();
    scheduleDraftSave();
    if(sourceFromTreeTimer) clearTimeout(sourceFromTreeTimer);
    sourceFromTreeTimer = setTimeout(() => {
      sourceFromTreeTimer = null;
      updateSourceFromTree();
    }, 150);
  }

  function flushSourceFromTree(){
    if(sourceFromTreeTimer){ clearTimeout(sourceFromTreeTimer); sourceFromTreeTimer = null; }
    updateSourceFromTree();
  }

  function tagRenameMessages(renames){
    if(!renames || !renames.length) return [];
    return renames.map(r => t(
      'Hinweis: Tag <{from}> wurde zu <{to}> korrigiert (XML-Namen dürfen nicht mit einer Ziffer beginnen).',
      'protocol.tagRenamed',
      { from: r.from, to: r.to }
    ));
  }

  function applyGesamtFromSource(){
    const { tree: parsed, errors, migrated, renames } = parseXMLString(sourceText.value);
    if(errors.length){ showBanner('error', errors); return; }
    if(!parsed || !parsed.length){
      showBanner('error', [t('Keine gültige Gesamt-Config gefunden.', 'protocol.noGesamt')]);
      return;
    }
    const newTabs = [];
    let currentTitle = t('Prompt {n}', 'tabs.defaultTitle', {n: 1});
    let currentChildren = [];
    function flush(){
      if(currentChildren.length || newTabs.length === 0){
        let treeData = currentChildren;
        if(currentChildren.length === 1 && currentChildren[0].kind === 'element' && (currentChildren[0].tag || '').toLowerCase() === 'prompt'){
          treeData = currentChildren[0].children || [];
        }
        const tabState = createTabState(currentTitle, treeData);
        newTabs.push(tabState);
      }
      currentChildren = [];
    }
    parsed.forEach(n => {
      if(n.kind === 'comment'){
        const txt = (n.text || '').trim();
        const m = /^TAB:\s*(.+)$/i.exec(txt);
        if(m){
          flush();
          currentTitle = m[1].trim() || t('Prompt {n}', 'tabs.defaultTitle', {n: newTabs.length+1});
        }
      } else {
        currentChildren.push(n);
      }
    });
    flush();
    if(!newTabs.length){
      showBanner('error', [t('Keine gültige Gesamt-Config gefunden.', 'protocol.noGesamt')]);
      return;
    }
    tabs = newTabs;
    activeTabId = tabs[0].id;
    /* S liest aus tabs[0]; sourceFocused/focusDetailField werden hier zurückgesetzt. */
    S.sourceFocused = false;
    S.focusDetailField = false;
    sourceGesamtMode = false;
    sourceDirty = false;
    updateSourcePanelTitle();
    const msgs = [];
    if(migrated > 0){
      msgs.push(t('Import-Hinweis: Mixed Content erkannt. {n} Text-Blöcke wurden automatisch in <Parent_text>-Tags umgewandelt.', 'protocol.mixedContent', { n: migrated }));
    } else {
      msgs.push(t('Gesamt-Config erfolgreich übernommen.', 'protocol.gesamtApplied'));
    }
    msgs.push(...tagRenameMessages(renames));
    showBanner('ok', msgs);
    renderTabs();
    render();
    updateSourceHeadTools();
  }

  function applySourceToTree(){
    if(sourceGesamtMode){
      applyGesamtFromSource();
      return;
    }
    const { tree: parsed, errors, migrated, renames } = parseXMLString(sourceText.value);
    if(errors.length){ showBanner('error', errors); return; }
    if(parsed.length === 1 && parsed[0].kind === 'element' && (parsed[0].tag || '').toLowerCase() === 'prompt'){
      S.tree = parsed[0].children;
    } else {
      S.tree = parsed;
    }
    S.selectedId = firstNavigableId(S.tree);
    const msgs = [];
    if(migrated > 0){
      msgs.push(t('Import-Hinweis: Mixed Content erkannt. {n} Text-Blöcke wurden automatisch in <Parent_text>-Tags umgewandelt.', 'protocol.mixedContent', { n: migrated }));
    } else {
      msgs.push(t('XML erfolgreich übernommen.', 'protocol.xmlApplied'));
    }
    msgs.push(...tagRenameMessages(renames));
    showBanner('ok', msgs);
    flashButton('btnApplySource', t('✓', 'outline.copiedShort'));
    sourceDirty = false;
    clearStructUndo();
    render();
  }

  /* ===== Validierung ===== */
  const tagNameRe = /^[A-Za-z_][A-Za-z0-9_.\-]*$/;
  const GENERIC_TAGS = new Set(['tag','data','info','text','element','item','value']);

  function clearErrorFlags(nodes){
    nodes.forEach(n => {
      n._hasError = false;
      n._line = null;
      if(n.children) clearErrorFlags(n.children);
    });
  }

  function validateTree(){
    const hard = [];
    const soft = [];
    const lineState = getLineMap();
    (function walk(nodes, depth, parentTag){
      nodes.forEach(n => {
        if(n.kind === 'comment') return;
        const tagName = (n.tag || '').trim();
        const line = lineState.map[n.id] || null;
        n._line = line;
        const lineSuf = line ? t(' · Zeile ~{line}', 'validation.lineSuffix', {line}) : '';
        if(!tagName || !tagNameRe.test(tagName)){
          hard.push({
            id: n.id, line,
            message: !tagName ? t('Tag ohne Namen – Zeile {line}', 'validation.tagNoName', {line}) : t('Tag <{tag}> enthält ungültige Zeichen – Zeile {line}', 'validation.tagInvalid', {tag: tagName, line})
          });
        }
        if(tagName && GENERIC_TAGS.has(tagName.toLowerCase())){
          soft.push({
            id:n.id, line, level:'warning',
            message: t('Warnung: <{tag}> ist zu generisch. Nutze beschreibende Namen wie <kunden_anfrage> statt <data> (XML: Use consistent, descriptive tag names){line}', 'validation.genericTag', {tag: tagName, line: lineSuf})
          });
        }
        if(depth > 4){
          soft.push({
            id:n.id, line, level:'warning',
            message: t('Warnung: Verschachtelungstiefe {depth} in <{tag}>. Mehr als 4 Ebenen erschweren das Verständnis.{line}', 'validation.depth', {depth, tag: tagName||'?', line: lineSuf})
          });
        }
        if(tagName.toLowerCase() === 'example' && (parentTag||'').toLowerCase() !== 'examples'){
          soft.push({
            id:n.id, line, level:'hint',
            message: t('Hinweis: <example> sollte in <examples> verpackt sein (XML){line}', 'validation.exampleHint', {line: lineSuf})
          });
        }
        const hasText = (n.text||'').trim() !== '';
        const hasKids = n.children && n.children.length > 0;
        if(!hasText && !hasKids){
          soft.push({
            id:n.id, line, level:'hint',
            message: t('Hinweis: <{tag}> ist leer{line}', 'validation.emptyTag', {tag: tagName||'?', line: lineSuf})
          });
        }
        if(n.children && n.children.length) walk(n.children, depth + 1, tagName);
      });
    })(S.tree, 1, null);
    return {hard, soft};
  }

  function formatProtocolTime(){
    const d = new Date();
    return d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false });
  }

  function isProtocolOpen(){
    const panel = document.getElementById('protocolPanel');
    return panel && panel.classList.contains('open');
  }

  function registerProtocolTrigger(el){
    if(el && !protocolTriggerEls.includes(el)) protocolTriggerEls.push(el);
  }

  function protocolBadgeLabel(count){
    if(count > 99) return '99+';
    return String(count);
  }

  function ensureProtocolBadge(el, count){
    if(!el) return;
    let badge = el.querySelector(':scope > .protocol-badge');
    if(count <= 0){
      el.classList.remove('has-error-mark');
      if(badge) badge.remove();
      return;
    }
    el.classList.add('has-error-mark');
    if(!badge){
      badge = document.createElement('span');
      badge.className = 'protocol-badge';
      badge.setAttribute('aria-hidden', 'true');
      el.appendChild(badge);
    }
    const label = protocolBadgeLabel(count);
    badge.textContent = label;
    badge.classList.toggle('digits-2', label.length === 2);
    badge.classList.toggle('digits-3', label.length >= 3);
  }

  function updateProtocolMarks(){
    const count = hasProtocolErrors ? Math.max(1, protocolErrorCount) : 0;
    protocolTriggerEls.forEach(el => ensureProtocolBadge(el, count));
    /* Mobile: Badge auch am Menüpunkt „Protokoll“, falls Options-Menü offen */
    const optValidate = document.getElementById('optValidate');
    if(optValidate) ensureProtocolBadge(optValidate, count);
  }

  function setProtocolErrorMark(on){
    /* Mark nur setzen, wenn Protokoll geschlossen ist (wie Handy-Badge) */
    if(on && isProtocolOpen()){
      hasProtocolErrors = false;
      /* Zähler bleibt erhalten, Badge wird beim Schließen ggf. neu gesetzt – beim Öffnen wird Zähler genullt */
    } else if(on){
      hasProtocolErrors = true;
    } else {
      hasProtocolErrors = false;
    }
    updateProtocolMarks();
  }

  function addToProtocol(type, msgs){
    const ts = formatProtocolTime();
    const list = Array.isArray(msgs) ? msgs : [msgs];
    list.forEach(m => {
      const message = typeof m === 'string' ? m : (m && m.message ? m.message : String(m));
      protocolLog.push({ ts, type, message });
      if(type === 'error') protocolErrorCount += 1;
    });
    while(protocolLog.length > protocolThreshold) protocolLog.shift();
    setProtocolErrorMark(protocolErrorCount > 0);
    if(isProtocolOpen()) renderProtocolList();
  }

  function runValidation(){
    clearErrorFlags(S.tree);
    const {hard, soft} = validateTree();
    if(!hard.length && !soft.length){
      protocolErrorCount = 0;
      setProtocolErrorMark(false);
      showBanner('ok', [t('Keine Fehler.', 'protocol.noErrors')]);
      renderOutline();
      return;
    }
    hard.forEach(i => {
      const f = findNode(S.tree, i.id);
      if(f) f.node._hasError = true;
    });
    /* Fehleranzahl kommt über addToProtocol (je Message +1) */
    renderOutline();
    showBannerMixed(hard, soft);
  }

  function escapeHTML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

  function showBanner(type, msgs){
    addToProtocol(type, msgs);
  }

  function jumpToIssue(issue){
    if(issue.id) selectNode(issue.id);
    if(issue.line){
      if(isMobileLayout()){
        openSheet('source');
        setTimeout(() => scrollSourceToLine(issue.line, issue.col), 320);
      } else {
        if(sourcePanel.style.display === 'none' || sourcePanel.style.display === ''){
          sourcePanel.style.display = 'flex';
          layout.classList.add('with-source');
          setSourceLabels(true);
          sourceGesamtMode = false;
          sourceDirty = false;
          updateSourcePanelTitle();
          updateSourceFromTree();
          updateSourceHeadTools();
        }
        scrollSourceToLine(issue.line, issue.col);
      }
    }
    if(issue.id){
      const row = outlineList.querySelector('.outline-row[data-id="' + issue.id + '"]');
      if(row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
  }

  function scrollSourceToLine(line, col){
    if(!sourceText || !line) return;
    const text = typeof getEditorValue === 'function' ? getEditorValue(sourceText) : (sourceText.value || '');
    const lines = text.split('\n');
    let pos = 0;
    for(let i = 0; i < line - 1 && i < lines.length; i++) pos += lines[i].length + 1;
    const lineText = lines[line - 1] || '';
    const start = pos + (col && col > 0 ? Math.min(col - 1, lineText.length) : 0);
    const end = pos + lineText.length;
    /* Auf Mobile: nicht fokussieren – sonst öffnet sich der Fokus-Editor (§MOBILE-FOCUS-REGEL) */
    if(!isMobileLayout()) try { sourceText.focus(); } catch(_){}
    if(typeof setEditorSelection === 'function') setEditorSelection(sourceText, start, end);
    else try { sourceText.setSelectionRange(start, end); } catch(_){}
    const lineHeight = parseFloat(getComputedStyle(sourceText).lineHeight) || 18;
    sourceText.scrollTop = Math.max(0, (line - 3) * lineHeight);
  }

  function showBannerMixed(hard, soft){
    if(hard.length) addToProtocol('error', hard.map(i => (i.line ? t('Zeile {line}: ', 'protocol.linePrefix', {line: i.line}) : '') + i.message));
    if(soft.length) addToProtocol('warning', soft.map(i => (i.line ? t('Zeile {line}: ', 'protocol.linePrefix', {line: i.line}) : '') + i.message));
  }

  function hideBanner(){
    /* Kein Banner mehr – nur noch Protokoll */
  }

  /* ===== Protokoll-UI ===== */
  function renderProtocolList(){
    const list = document.getElementById('protocolList');
    if(!list) return;
    list.innerHTML = '';
    if(!protocolLog.length){
      const empty = document.createElement('div');
      empty.className = 'protocol-empty';
      empty.textContent = t('Noch keine Einträge. Tippe auf „Prüfen“, um die Struktur jetzt zu prüfen.', 'protocol.empty');
      list.appendChild(empty);
      return;
    }
    protocolLog.forEach(entry => {
      const row = document.createElement('div');
      row.className = 'protocol-entry type-' + (entry.type || 'ok');
      const ts = document.createElement('span');
      ts.className = 'protocol-ts';
      ts.textContent = entry.ts;
      const msg = document.createElement('span');
      msg.className = 'protocol-msg';
      msg.textContent = entry.message;
      row.appendChild(ts);
      row.appendChild(msg);
      list.appendChild(row);
    });
    list.scrollTop = list.scrollHeight;
  }

  function openProtocol(){
    closeAllWikiMenus();
    closeTemplateMenu();
    closeOptionsMenu();
    const panel = document.getElementById('protocolPanel');

    if(!panel) return;

    updateProtocolMarks();
    renderProtocolList();
    if(overlay){
      overlay.hidden = false;
      overlay.classList.add('open');

    panel.classList.add('open');
    document.body.style.overflow = 'hidden';

    if(closeBtn) closeBtn.focus();

    const panel = document.getElementById('protocolPanel');
    const overlay = document.getElementById('protocolOverlay');
    if(panel) panel.classList.remove('open');
    if(overlay){
      overlay.classList.remove('open');
      overlay.hidden = true;
    }
    document.body.style.overflow = '';
  }

  function clearProtocol(){
    protocolLog = [];
    protocolErrorCount = 0;
    hasProtocolErrors = false;
    updateProtocolMarks();
    renderProtocolList();
  }

    if(btn){
      btn.textContent = xmlCodeLineWrap ? t('Umbruch an', 'source.wrapOn') : t('Umbruch aus', 'source.wrapOff');

  function resetAll(){
    maybeConfirm(S.tree.length && warnPromptTabReset, t('Diesen Tab zurücksetzen?', 'outline.confirmReset'), () => {
      structUndoPush();
      S.tree = [];
      S.selectedId = null;
      hideBanner(); closeSheet(true); render();
    });
  }
  function copyToClipboardFallback(text){
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    document.body.removeChild(ta);
    return ok;
  }
  function copySource(){
    navigator.clipboard.writeText(sourceText.value)
      .then(() => flashButton('btnCopySource', t('✓', 'outline.copiedShort')))
      .catch(() => {
        if(copyToClipboardFallback(sourceText.value)) flashButton('btnCopySource', t('✓', 'outline.copiedShort'));
        else flashButton('btnCopySource', t('✗', 'outline.copyFailed'));
      });
  }
  function copyResult(){
    const xml = getCopyResultText();
    navigator.clipboard.writeText(xml)
      .then(() => flashButton('btnCopyResult', t('✓ Kopiert', 'outline.copied')))
      .catch(() => {
        if(copyToClipboardFallback(xml)) flashButton('btnCopyResult', t('✓', 'outline.copiedShort'));
        else flashButton('btnCopyResult', t('✗ Kopieren fehlgeschlagen', 'outline.copyFailedFull'));
      });
  }
  function flashButton(id, label){ const b = document.getElementById(id); if(!b) return; const o = b.textContent; b.textContent = label; setTimeout(() => b.textContent = o, 1300); }
  function setSourceLabels(open){
    const label = open ? t('XML ausblenden', 'toolbar.hideXml') : t('XML anzeigen', 'toolbar.showXml');
    const desk = document.getElementById('btnToggleSource');
    const mob = document.getElementById('optToggleSource');
    if(desk) desk.textContent = label;

  function toggleSourcePanel(){
    if(isMobileLayout()){
      if(activeSheet === 'source' || sourcePanel.classList.contains('mobile-open')) closeSheet(false);
      else openSheet('source');
      return;
    }
    activeSheet = null;
    mobileDetailOpen = false;
    sourcePanel.classList.remove('mobile-open');
    applySheetChrome(false);
    ensureDetailParent();
    clearSheetInlineGeometry();
    const detailCol = document.getElementById('detailCol');
    if(detailCol){
      detailCol.classList.remove('mobile-open', 'sheet-dormant');
      detailCol.removeAttribute('aria-hidden');
    }
    sourcePanel.classList.remove('mobile-open', 'sheet-dormant');
    sourcePanel.removeAttribute('aria-hidden');
    sourcePanel.style.transform = '';
    sourcePanel.style.zIndex = '';

    if(showing){
