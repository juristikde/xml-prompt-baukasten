<!DOCTYPE html>
    <html lang="de">
    <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0%25' stop-color='%2333415c'/%3E%3Cstop offset='100%25' stop-color='%2354704f'/%3E%3C/linearGradient%3E%3C/defs%3E%3Cg transform='translate(16 16) rotate(6)'%3E%3Crect x='-10' y='-10' width='20' height='20' rx='3' fill='url(%23g)'/%3E%3C/g%3E%3C/svg%3E" />
    <title>Prompt Baukasten – Strukturierter XML-Editor</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');
    
      /*
       * HOVER-REGEL
       * -----------------------------
       * Hover-Feedback nur auf Geräten mit echtem Zeiger-Hover und feinem Pointer
       * (Maus/Trackpad). Auf Touch-Geräten darf :hover NICHT greifen – sonst bleiben
       * Zustände nach dem Antippen „hängen“.
       * Alle :hover-Styles MÜSSEN in diesem Media-Query stehen:
       *   @media (hover: hover) and (pointer: fine) { ... }
       * Active-/Focus-Zustände bleiben davon unberührt und gelten überall.
       */
    
      :root {
        --space-1: 4px;
        --space-2: 8px;
        --space-3: 12px;
        --space-4: 16px;
        --space-5: 24px;
        --space-6: 32px;
        --space-7: 48px;
    
        --text-caption: 0.75rem;
        --text-footnote: 0.8125rem;
        --text-subhead: 0.9375rem;
        --text-body: 1.0625rem;
        --text-callout: 1rem;
        --text-headline: 1.125rem;
        --text-title-3: 1.25rem;
        --text-title-2: 1.375rem;
        --text-title-1: 1.75rem;
        --text-large-title: 2.125rem;
    
        --paper: #f1efe9;
        --paper-raised: #faf9f5;
        --paper-sunken: #f7f5ef;
        --ink: #26313f;
        --ink-soft: #5b6472;
        --ink-faint: #9aa1ac;
        --line: #dcd7cb;
        --line-strong: #c9c3b5;
    
        --color-action: #33415c;
        --color-action-hover: #3c4c6b;
        --color-action-soft: #e6e9ef;
        --color-success: #54704f;
        --color-success-soft: #e6ebe2;
        --color-warning: #8a6323;
        --color-warning-soft: #f1e7d2;
        --color-destructive: #a8442f;
        --color-destructive-soft: #f3e0da;
        --color-muted: #5c6773;
        --color-muted-soft: #e6e8ea;
    
        --radius: 10px;
        --radius-sm: 6px;
        --radius-lg: 14px;
        --shadow: 0 1px 2px rgba(38,49,63,.06), 0 6px 20px -10px rgba(38,49,63,.15);
        --shadow-raised: 0 4px 16px -4px rgba(38,49,63,.12);
    
        --touch-min: 44px;
        --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
        --font-serif: 'Source Serif 4', Georgia, serif;
        --font-mono: 'JetBrains Mono', ui-monospace, monospace;
      }
    
      *, *::before, *::after { box-sizing: border-box; }
    
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        overflow: hidden;
      }
    
      body {
        background: var(--paper);
        background-image: radial-gradient(circle at 1px 1px, rgba(38,49,63,.045) 1px, transparent 0);
        background-size: 22px 22px;
        color: var(--ink);
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: 1.35;
        -webkit-font-smoothing: antialiased;
      }
    
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
          animation-duration: 0.01ms !important;
          transition-duration: 0.01ms !important;
        }
      }
    
      .wrap {
        max-width: 1400px;
        margin: 0 auto;
        padding: var(--space-4);
        height: 100%;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        gap: var(--space-3);
      }
    
      header.top {
        display: flex;
        flex-wrap: nowrap;
        align-items: center;
        justify-content: space-between;
        gap: var(--space-3);
        padding-bottom: var(--space-3);
        border-bottom: 1px solid var(--line);
        flex: none;
        min-width: 0;
      }
    
      header.top .title-block {
        min-width: 0;
        flex: 1 1 auto;
        display: flex;
        align-items: center;
      }
    
      header.top .title-block h1 {
        font-family: var(--font-serif);
        font-weight: 700;
        font-size: var(--text-title-2);
        margin: 0;
        letter-spacing: -0.02em;
        display: flex;
        align-items: center;
        gap: var(--space-2);
        line-height: 1.2;
        min-width: 0;
        max-width: 100%;
      }
    
      header.top .title-block h1 .mark {
        display: inline-block;
        width: 12px;
        height: 12px;
        border-radius: 3px;
        background: linear-gradient(135deg, var(--color-action), var(--color-success));
        transform: rotate(6deg);
        flex: none;
      }
    
      /* Einzeiliger Titel (Guidelines: kompakte Leiste, Kürzen statt Umbruch) */
      header.top .title-block h1 .title-text {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
    
      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: var(--space-2);
        align-items: center;
        flex: 0 0 auto;
      }
    
      .toolbar-desktop { display: flex; flex-wrap: wrap; gap: var(--space-2); align-items: center; }
      .toolbar-mobile { display: none; }
    
      button { font-family: inherit; cursor: pointer; }
    
      .btn {
        appearance: none;
        border: 1px solid var(--line);
        background: var(--paper-raised);
        color: var(--ink);
        min-height: var(--touch-min);
        min-width: var(--touch-min);
        padding: 0 var(--space-4);
        border-radius: var(--radius-sm);
        font-size: var(--text-subhead);
        font-weight: 600;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: var(--space-2);
        transition: border-color 0.12s ease, background 0.12s ease, transform 0.08s ease, opacity 0.12s ease;
        white-space: nowrap;
        line-height: 1.25;
        text-decoration: none;
      }
    
      .btn:focus-visible {
        outline: 2px solid var(--color-action);
        outline-offset: 2px;
      }
    
      .btn:active:not(:disabled) { transform: scale(0.97); }
    
      .btn:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
    
      .btn.primary {
        background: var(--color-action);
        border-color: var(--color-action);
        color: #fbf9f4;
      }
    
      .btn.secondary {
        background: transparent;
        border-color: var(--color-action);
        color: var(--color-action);
      }
    
      .btn.plain {
        background: transparent;
        border-color: transparent;
        color: var(--color-action);
        font-weight: 500;
      }
    
      .btn.danger { color: var(--color-destructive); }
    
      .btn.danger.primary {
        background: var(--color-destructive);
        border-color: var(--color-destructive);
        color: #fff;
      }
    
      .btn.small {
        min-height: 36px;
        min-width: 36px;
        padding: 0 var(--space-3);
        font-size: var(--text-footnote);
        border-radius: var(--radius-sm);
      }
    
      .btn.block { width: 100%; }
    
      .btn.icon-only {
        padding: 0;
        width: var(--touch-min);
      }
    
      /* Hover nur bei feinem Zeiger – siehe HOVER-REGEL oben */
      @media (hover: hover) and (pointer: fine) {
        .btn:hover:not(:disabled) {
          border-color: var(--ink-faint);
          background: #fff;
        }
        .btn.primary:hover:not(:disabled) {
          background: var(--color-action-hover);
          border-color: var(--color-action-hover);
        }
        .btn.secondary:hover:not(:disabled) { background: var(--color-action-soft); }
        .btn.plain:hover:not(:disabled) { background: var(--color-muted-soft); }
        .btn.danger:hover:not(:disabled) { background: var(--color-destructive-soft); }
      }
    
      .split-btn {
        display: inline-flex;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        overflow: visible;
        background: var(--paper-raised);
        position: relative;
        min-height: var(--touch-min);
      }
    
      .split-btn .split-main {
        border: none;
        background: transparent;
        min-height: var(--touch-min);
        padding: 0 var(--space-4);
        font-size: var(--text-subhead);
        font-weight: 600;
        color: var(--ink);
        cursor: pointer;
        display: flex;
        align-items: center;
        gap: var(--space-1);
        border-radius: var(--radius-sm) 0 0 var(--radius-sm);
      }
    
      .split-btn .split-sep {
        width: 1px;
        background: var(--line);
        align-self: stretch;
      }
    
      .split-btn .split-caret {
        border: none;
        background: transparent;
        min-height: var(--touch-min);
        min-width: 40px;
        padding: 0 var(--space-2);
        cursor: pointer;
        color: var(--ink-soft);
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
      }
    
      .split-btn .split-caret svg { width: 12px; height: 12px; }
    
      @media (hover: hover) and (pointer: fine) {
        .split-btn .split-main:hover,
        .split-btn .split-caret:hover {
          background: #fff;
          color: var(--ink);
        }
      }
    
      .split-btn .split-main:focus-visible,
      .split-btn .split-caret:focus-visible {
        outline: 2px solid var(--color-action);
        outline-offset: -2px;
      }
    
      .wiki-menu,
      .template-menu,
      .options-menu {
        position: fixed;
        top: 0;
        left: 0;
        background: var(--paper-raised);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow-raised);
        padding: var(--space-2);
        z-index: 10000;
        min-width: 220px;
        display: none;
      }
    
      .wiki-menu.open,
      .template-menu.open,
      .options-menu.open { display: block; }
    
      .wiki-menu label,
      .template-menu label {
        display: block;
        font-size: var(--text-caption);
        color: var(--ink-soft);
        margin-bottom: var(--space-1);
        font-weight: 600;
      }
    
      .wiki-menu select,
      .wiki-menu input[type="number"] {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        padding: var(--space-2) var(--space-3);
        font-family: inherit;
        font-size: var(--text-subhead);
        background: #fff;
        margin-bottom: var(--space-2);
        min-height: 40px;
      }
    
      .wiki-menu select:focus,
      .wiki-menu input:focus {
        outline: 2px solid var(--color-action);
        outline-offset: 0;
        border-color: var(--color-action);
      }
    
      .wiki-menu .menu-actions {
        display: flex;
        gap: var(--space-2);
      }
    
      .wiki-wrap,
      .template-wrap,
      .options-wrap {
        position: relative;
        display: inline-block;
      }
    
      .template-menu .tpl-item,
      .options-menu .opt-item {
        display: block;
        width: 100%;
        text-align: left;
        border: none;
        background: transparent;
        min-height: 40px;
        padding: var(--space-2) var(--space-3);
        border-radius: var(--radius-sm);
        font-family: inherit;
        font-size: var(--text-subhead);
        font-weight: 500;
        color: var(--ink);
        cursor: pointer;
      }
    
      .options-menu .opt-sep {
        height: 1px;
        background: var(--line);
        margin: var(--space-1) var(--space-2);
      }
    
      .options-menu .opt-label {
        display: block;
        font-size: var(--text-caption);
        font-weight: 700;
        color: var(--ink-faint);
        text-transform: uppercase;
        letter-spacing: 0.04em;
        padding: var(--space-2) var(--space-3) var(--space-1);
      }
    
      @media (hover: hover) and (pointer: fine) {
        .template-menu .tpl-item:hover,
        .options-menu .opt-item:hover {
          background: var(--color-action-soft);
          color: var(--color-action);
        }
      }
    
      .template-menu .tpl-item:focus-visible,
      .options-menu .opt-item:focus-visible {
        outline: 2px solid var(--color-action);
        outline-offset: -2px;
      }
    
      .template-menu .tpl-item + .tpl-item { margin-top: 2px; }
    
      .tabs-shell {
        display: flex;
        flex-direction: column;
        flex: 1;
        min-height: 0;
        overflow: hidden;
      }
    
      .tabs-shell.tabs-vertical { flex-direction: row; }
    
      .tab-bar {
        display: flex;
        align-items: stretch;
        gap: 0;
        background: var(--paper-raised);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        flex: none;
        min-height: var(--touch-min);
        overflow: hidden;
      }
    
      .tabs-shell.tabs-horizontal .tab-bar {
        flex-direction: row;
        margin-bottom: var(--space-2);
      }
    
      .tabs-shell.tabs-vertical .tab-bar {
        flex-direction: column;
        width: 180px;
        margin-right: var(--space-2);
        overflow-y: auto;
        max-height: 100%;
        scrollbar-width: none;
      }
    
      .tabs-shell.tabs-vertical .tab-bar::-webkit-scrollbar { display: none; }
    
      .tabs-shell.tabs-hidden .tab-bar { display: none; }
    
      .tab-list {
        display: flex;
        flex: 1;
        min-width: 0;
        overflow-x: auto;
        overflow-y: hidden;
        scrollbar-width: none;
      }
    
      .tab-list::-webkit-scrollbar { display: none; }
    
      .tabs-shell.tabs-vertical .tab-list {
        flex-direction: column;
        overflow-x: hidden;
        overflow-y: auto;
      }
    
      .tab-item {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        min-height: var(--touch-min);
        padding: 0 var(--space-2) 0 var(--space-3);
        border: none;
        background: transparent;
        font-family: inherit;
        font-size: var(--text-subhead);
        font-weight: 500;
        color: var(--ink-soft);
        cursor: pointer;
        border-right: 1px solid var(--line);
        white-space: nowrap;
        max-width: 200px;
        min-width: 0;
        position: relative;
        flex: none;
      }
    
      .tabs-shell.tabs-vertical .tab-item {
        border-right: none;
        border-bottom: 1px solid var(--line);
        max-width: none;
        width: 100%;
      }
    
      @media (hover: hover) and (pointer: fine) {
        .tab-item:hover {
          background: var(--color-muted-soft);
          color: var(--ink);
        }
      }
    
      .tab-item.active {
        background: var(--color-action-soft);
        color: var(--color-action);
        font-weight: 600;
      }
    
      .tab-item.active::after {
        content: '';
        position: absolute;
        left: 0;
        top: 0;
        bottom: 0;
        width: 3px;
        background: var(--color-action);
      }
    
      .tabs-shell.tabs-horizontal .tab-item.active::after {
        left: 0;
        right: 0;
        top: auto;
        bottom: 0;
        width: auto;
        height: 2px;
      }
    
      .tab-item:focus-visible {
        outline: 2px solid var(--color-action);
        outline-offset: -2px;
      }
    
      .tab-title {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    
      .tab-close {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--ink-faint);
        font-size: 1rem;
        line-height: 1;
        width: 28px;
        height: 28px;
        border-radius: var(--radius-sm);
        cursor: pointer;
        flex: none;
        opacity: 0.6;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    
      @media (hover: hover) and (pointer: fine) {
        .tab-close:hover {
          opacity: 1;
          background: rgba(0,0,0,.08);
          color: var(--color-destructive);
        }
      }
    
      .tab-new {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--ink-soft);
        font-size: 1.25rem;
        font-weight: 500;
        line-height: 1;
        min-width: var(--touch-min);
        min-height: var(--touch-min);
        padding: 0;
        cursor: pointer;
        flex: none;
        font-family: inherit;
        display: flex;
        align-items: center;
        justify-content: center;
      }
    
      @media (hover: hover) and (pointer: fine) {
        .tab-new:hover {
          background: var(--color-muted-soft);
          color: var(--ink);
        }
      }
    
      .tab-new:focus-visible {
        outline: 2px solid var(--color-action);
        outline-offset: -2px;
      }
    
      .tabs-shell.tabs-vertical .tab-new {
        width: 100%;
        border-top: 1px solid var(--line);
      }
    
      .tabs-main {
        flex: 1;
        min-height: 0;
        min-width: 0;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
    
      .layout {
        display: grid;
        grid-template-columns: 1fr;
        gap: var(--space-3);
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }
    
      .layout.with-source { grid-template-columns: 1.5fr 1fr; }
    
      .panel {
        background: var(--paper-raised);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
        display: flex;
        flex-direction: column;
        min-height: 0;
      }
    
      .panel-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: var(--space-3) var(--space-4);
        border-bottom: 1px solid var(--line);
        gap: var(--space-2);
        flex-wrap: wrap;
        flex: none;
        min-height: 56px; /* an Struktur-Panel mit Title-Input anpassen */
        box-sizing: border-box;
      }

      .panel-head h2 {
        font-family: var(--font-serif);
        font-size: var(--text-headline);
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.01em;
        line-height: 1.25;
        min-height: 36px;          /* wie .panel-title-input */
        display: flex;
        align-items: center;
      }

      .panel-title-input {
        /* bestehende Regeln lassen; min-height: 36px bleibt */
      }
    
      /*
       * Panel-Titel = Tab-Name (editierbar wie detail-tag-input).
       * Gleiche Interaktionsmechanik: immer Input, Fokus-Unterstrich, kein Modal.
       */
      .panel-title-input {
        font-family: var(--font-serif);
        font-size: var(--text-headline);
        font-weight: 600;
        letter-spacing: -0.01em;
        color: var(--ink);
        margin: 0;
        border: none;
        background: transparent;
        border-bottom: 2px solid transparent;
        padding: var(--space-1) var(--space-1);
        min-width: 0;
        flex: 1 1 auto;
        max-width: 100%;
        line-height: 1.25;
        min-height: 36px;
      }
    
      .panel-title-input:focus {
        outline: none;
        border-bottom-color: var(--color-action);
        background: #fff;
        border-radius: 4px 4px 0 0;
      }
    
      .panel-title-input::placeholder {
        color: var(--ink-faint);
        font-weight: 600;
      }
    
      .panel-body {
        padding: var(--space-4);
        overflow: hidden;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
        gap: var(--space-3);
      }
    
      .split-body {
        display: flex;
        align-items: stretch;
        flex: 1;
        min-height: 0;
        overflow: hidden;
        position: relative;
      }
    
      .outline-col {
        width: 340px;
        flex: 0 0 340px;
        border-right: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        background: var(--paper-sunken);
        min-height: 0;
      }
    
      .outline-list {
        overflow-y: auto;
        flex: 1;
        min-height: 0;
        padding: var(--space-2);
        scrollbar-width: none;
      }
    
      .outline-list::-webkit-scrollbar { display: none; }
    
      .outline-footer {
        border-top: 1px solid var(--line);
        display: flex;
        flex-direction: column;
        gap: 0;
        flex: none;
        background: #f5f3ec;
      }
    
      .footer-static {
        padding: var(--space-3);
        display: flex;
        flex-direction: column;
        gap: var(--space-2);
      }
    
      .footer-static .add-row,
      .footer-static .template-row,
      .footer-static .action-row {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
      }
    
      .footer-static .add-row .btn,
      .footer-static .template-row .btn,
      .footer-static .action-row .btn {
        flex: 1;
      }
    
      .outline-empty {
        padding: var(--space-5) var(--space-3);
        font-size: var(--text-subhead);
        color: var(--ink-faint);
        line-height: 1.45;
        text-align: center;
      }
    
      .outline-row {
        display: flex;
        align-items: center;
        gap: var(--space-1);
        min-height: 40px;
        padding: var(--space-1) var(--space-2);
        border-radius: var(--radius-sm);
        cursor: grab;
        font-size: var(--text-subhead);
        margin-bottom: 1px;
        min-width: 0;
        transition: background 0.1s ease, box-shadow 0.1s ease, opacity 0.1s ease;
        user-select: none;
        -webkit-user-select: none;
      }
    
      .outline-row.dragging {
        opacity: 0.45;
        cursor: grabbing;
      }

        color: var(--color-action);

      .detail-tag-input:focus {

      .detail-tag-input::placeholder {

      .comment-heading {

      .detail-tools {

        align-items: center;
        gap: var(--space-2);
        flex-wrap: wrap;

      .detail-textarea-wrap {

        background: #fff;
        box-shadow: var(--shadow);
        overflow: hidden;
        flex: 1;
        min-height: 0;
        display: flex;
        flex-direction: column;
      }
    
      .detail-textarea {
        display: block;
        width: 100%;
        box-sizing: border-box;
        border: none;
        outline: none;
        font-family: var(--font-sans);
        font-size: var(--text-body);
        line-height: 1.5;
        color: var(--ink);
        padding: var(--space-4);
        resize: none;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        background: transparent;
        letter-spacing: -0.01em;
        scrollbar-width: none;
      }
    
      .detail-textarea::-webkit-scrollbar { display: none; }
    
      .detail-textarea.comment-style {
        font-style: italic;
        color: var(--ink-soft);
      }
    
      .detail-textarea::placeholder {
        color: var(--ink-faint);
        font-style: normal;
      }
    
      .detail-textarea:focus { outline: none; }
    
      .detail-empty {
        padding: var(--space-7) var(--space-4);
        text-align: center;
        color: var(--ink-soft);
        flex: 1;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: var(--space-3);
      }
    
      .detail-empty p {
        margin: 0;
        font-size: var(--text-subhead);
        line-height: 1.45;
        max-width: 28ch;
      }
    
      #sourcePanel { min-height: 0; }
    
      .source-close { display: none; }
    
      #sourceText {
        width: 100%;
        flex: 1 1 auto;
        min-height: 0;
        height: 100%;
        resize: none;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        background: #fdfcf9;
        font-family: var(--font-mono);
        font-size: var(--text-footnote);
        line-height: 1.5;
        color: var(--ink);
        padding: var(--space-3);
        overflow-y: auto;
      }
    
      #sourceText:focus {
        outline: 2px solid var(--color-action);
        outline-offset: 0;
        border-color: var(--color-action);
      }
    
      .source-actions {
        display: flex;
        gap: var(--space-2);
        flex-wrap: wrap;
        flex: none;
      }
    
      .banner {
        margin: 0;
        padding: var(--space-3) var(--space-4);
        padding-right: var(--space-7);
        border-radius: var(--radius-sm);
        font-size: var(--text-subhead);
        line-height: 1.35;
        display: none;
        flex: none;
        position: relative;
        box-sizing: border-box;
        max-height: 9.5rem;
        overflow-x: hidden;
        overflow-y: auto;
        scrollbar-width: thin;
      }

      .banner.show {
        display: block;
      }

      .banner.error {
        background: var(--color-destructive-soft);
        color: #7a2f1f;
        border: 1px solid #e2b3a4;
      }

      .banner.ok {
        background: var(--color-success-soft);
        color: #33452f;
        border: 1px solid #b9cbb0;
      }

      .banner.warning {
        background: var(--color-warning-soft);
        color: #5c4218;
        border: 1px solid #e0cfa0;
      }

      .banner ul {
        margin: var(--space-1) 0 0;
        padding-left: var(--space-4);
      }

      .banner li,
      .banner .banner-item {
        margin-bottom: 2px;
        cursor: default;
        text-decoration: none;
      }

      .banner-close {
        position: absolute;
        top: var(--space-2);
        right: var(--space-2);
        background: none;
        border: none;
        color: inherit;
        font-size: 1.1rem;
        line-height: 1;
        cursor: pointer;
        opacity: 0.6;
        width: 32px;
        height: 32px;
        border-radius: var(--radius-sm);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0;
        float: none;
        z-index: 2;
      }

      @media (hover: hover) and (pointer: fine) {
        .banner-close:hover {
          opacity: 1;
          background: rgba(0, 0, 0, 0.06);
        }
      }

      .banner-close:focus-visible {
        outline: 2px solid currentColor;
        outline-offset: 0;
      }

      @media (max-width: 900px) {
        .banner {
          max-height: 8rem;
        }
      }

      .source-wrap {
        display: flex;
        flex: 1 1 auto;
        min-height: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius-sm);
        overflow: hidden;
        background: #fdfcf9;
      }

      .source-gutter {
        flex: none;
        width: 3.2em;
        padding: var(--space-3) 6px var(--space-3) 0;
        text-align: right;
        font-family: var(--font-mono);
        font-size: var(--text-footnote);
        line-height: 1.5;
        color: var(--ink-faint);
        background: var(--paper-sunken);

        overflow: hidden;
        user-select: none;
        white-space: pre;
      }

      .source-gutter .ln {
        display: block;
        box-sizing: border-box;
        line-height: 1.5;
        padding-right: 6px;
      }

      #sourceText {
        border: none !important;
        border-radius: 0 !important;
        flex: 1 1 auto;
        min-width: 0;
        font-family: var(--font-mono);
        font-size: var(--text-footnote);
        line-height: 1.5;
        padding: var(--space-3);
        white-space: pre;
        overflow-x: auto;
        overflow-y: auto;
        tab-size: 2;
      }

      #sourceText.wrap-on {

        overflow-x: hidden;
        word-break: break-word;
      }

      .detail-textarea:disabled {
        background: var(--paper-sunken);
        color: var(--ink-faint);
        cursor: not-allowed;
      }
    
      /* ===== Mobile ===== */
      @media (max-width: 900px) {
        /*
         * Gemeinsame Grenze Liste / Editor:
         * Die Liste endet exakt dort, wo der Editor beginnt – kein Überdecken.
         */
        .layout,
        .split-body {
          /* Fallback percentages; JS sets --mobile-sheet-top / --mobile-outline-h in px
             so sheet top and list bottom share one edge (no overlap, list fully scrollable). */
          --mobile-editor-top: 36%;
          --mobile-sheet-top: 36%;
          --mobile-outline-h: 36%;
        }
    
        .wrap {
          padding: var(--space-2);
          gap: var(--space-2);
        }
    
        header.top {
          gap: var(--space-2);
          padding-bottom: var(--space-2);
        }
    
        header.top .title-block h1 {
          font-size: var(--text-title-3);
        }
    
    
        .toolbar {
          width: auto;
          flex: 0 0 auto;
          flex-wrap: nowrap;
          margin-left: auto;
        }
    
        .toolbar-desktop { display: none; }
        .toolbar-mobile {
          display: flex;
          flex-wrap: nowrap;
          gap: var(--space-2);
          align-items: center;
        }
    
        .layout.with-source { grid-template-columns: 1fr; }
    
        .split-body {
          flex-direction: column;
          /* static: .detail-col positions against .layout – same containing
             block as #sourcePanel, so both sheets open at identical height */
          position: static;
        }
    
        .outline-col {
          width: 100%;
          flex: 1 1 auto;
          min-height: 0;
          border-right: none;
          border-bottom: none;
          max-height: none;
          display: flex;
          flex-direction: column;
          overflow: hidden;
        }
    
        .outline-list {
          flex: 1 1 auto;
          min-height: 0;
          max-height: none;
          scrollbar-width: none;
        }
    
        .outline-list::-webkit-scrollbar { display: none; }
    
        /*
         * sheet-open erst NACH Ende der Einschiebe-Animation (JS).
         * Während der Animation bleibt das Bedienpanel unter dem Sheet sichtbar
         * und wird erst verdeckt ausgeblendet – kein plötzliches „Wegploppen“.
         */
        .layout.sheet-open .outline-col {
          flex: none;
          height: var(--mobile-outline-h);
          max-height: var(--mobile-outline-h);
          overflow: hidden;
        }
    
        .layout.sheet-open .outline-list {
          flex: 1 1 auto;
          min-height: 0;
          max-height: 100%;
          overflow-y: auto;
        }
    
        .layout.sheet-open .outline-footer {
          display: none;
        }
    
        .outline-open {
          display: inline-flex;
        }
    
        .outline-count {
          margin-left: 0;
        }
    
        .detail-col {
          /* Geometrie kommt von JS (inline top/left/width/height) – hier nur Look & Motion */
          position: fixed;
          z-index: 20;
          transform: translateX(calc(100% + 32px));
          transition: transform 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
          border-top: 1px solid var(--line);
          border-radius: var(--radius) var(--radius) 0 0;
          box-shadow: 0 -4px 24px -8px rgba(38,49,63,.18);
          display: flex;
          flex-direction: column;
          min-height: 0;
          box-sizing: border-box;
          pointer-events: none;
        }
    
        .detail-col.mobile-open {
          transform: translateX(0);
          pointer-events: auto;
        }
    
        .detail-col.sheet-dormant {
          visibility: hidden;
          pointer-events: none;
        }
    
        .detail-close {
          display: inline-flex;
        }
    
        .detail-scroll {
          padding: var(--space-3);
        }
    
        .detail-tag-input { font-size: var(--text-headline); }
    
        /* Pfad: genau eine Zeile, horizontal scrollbar ohne sichtbaren Balken */
        .level-bar {
          flex-wrap: nowrap;
          overflow: hidden;
        }
    
        .breadcrumb {
          flex-wrap: nowrap;
          overflow-x: auto;
          overflow-y: hidden;
          scrollbar-width: none;
          -webkit-overflow-scrolling: touch;
          min-width: 0;
        }
    
        .breadcrumb::-webkit-scrollbar { display: none; }
    
        .breadcrumb button {
          max-width: none;
          flex-shrink: 0;
        }
    
        .tabs-shell.tabs-vertical { flex-direction: column; }
    
        .tabs-shell.tabs-vertical .tab-bar {
          width: 100%;
          margin-right: 0;
          margin-bottom: var(--space-2);
          max-height: 120px;
        }
    
        .tabs-shell.tabs-vertical .tab-list {
          flex-direction: row;
          overflow-x: auto;
          overflow-y: hidden;
        }
    
        .tabs-shell.tabs-vertical .tab-item {
          border-bottom: none;
          border-right: 1px solid var(--line);
          max-width: 160px;
        }
    
        .tabs-shell.tabs-vertical .tab-new {
          width: auto;
          border-top: none;
          border-left: 1px solid var(--line);
        }
    
        .tab-item {
          max-width: 150px;
          font-size: var(--text-footnote);
        }
    
        /* XML-Panel: nur Mobile – von links einschieben (Spiegelung des Detail-Editors) */
        #sourcePanel {
          /* Geometrie kommt von JS (inline) – identisch zu .detail-col */
          position: fixed;
          z-index: 25;
          max-height: none;
          transform: translateX(calc(-100% - 32px));
          transition: transform 0.28s cubic-bezier(0.25, 0.1, 0.25, 1);
          display: flex !important;
          flex-direction: column;
          border-radius: var(--radius) var(--radius) 0 0;
          box-shadow: 4px 0 24px -8px rgba(38,49,63,.18);
          pointer-events: none;
          box-sizing: border-box;
          min-height: 0;
        }
    
        #sourcePanel.mobile-open {
          transform: translateX(0);
          pointer-events: auto;
        }
    
        #sourcePanel.sheet-dormant {
          visibility: hidden;
          pointer-events: none;
        }
    
        .source-close {
          display: inline-flex;
          appearance: none;
          border: none;
          background: var(--color-muted-soft);
          color: var(--ink-soft);
          width: 32px;
          height: 32px;
          border-radius: 50%;
          font-size: 1.1rem;
          line-height: 1;
          cursor: pointer;
          flex: none;
          align-items: center;
          justify-content: center;
          margin-left: auto;
          padding: 0;
        }
    
        .source-close:focus-visible {
          outline: 2px solid var(--color-action);
          outline-offset: 2px;
        }
      }
    
      @media (max-width: 480px) {
        .btn {
          font-size: var(--text-footnote);
          padding: 0 var(--space-3);
        }
    
        .layout,
        .split-body {
          --mobile-editor-top: 32%;
          --mobile-sheet-top: 32%;
          --mobile-outline-h: 32%;
        }
      }
    
      /* Zeichenanzahl – Caption, tabular, zurückhaltend (Guidelines: Deference) */
      .char-count {
        font-size: var(--text-caption);
        color: var(--ink-faint);
        font-weight: 500;
        font-variant-numeric: tabular-nums;
        line-height: 1.3;
        padding: var(--space-1) var(--space-3);
        flex: none;
        user-select: none;
        -webkit-user-select: none;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
    
      .char-count .char-sel {
        color: var(--ink-soft);
      }
    
      .detail-textarea-wrap .char-count {
        border-top: 1px solid var(--line);
        background: var(--paper-sunken);
        padding: var(--space-2) var(--space-4);
      }
    
      .char-count-inline {
        padding: var(--space-1) 0 0;
        width: 100%;
      }
    
      .char-count-global {
        text-align: center;
        padding: var(--space-1) var(--space-2) 0;
        width: 100%;
      }
    
      #sourceText + .char-count {
        border: 1px solid var(--line);
        border-top: none;
        border-radius: 0 0 var(--radius-sm) var(--radius-sm);
        background: var(--paper-sunken);
      }
    
      ::selection { background: var(--color-warning-soft); }
    </style>

    <body>
    <div class="wrap">
      <header class="top">
        <div class="title-block">
          <h1><span class="mark"></span><span class="title-text">Prompt Baukasten</span></h1>
        </div>
        <div class="toolbar">
          <div class="toolbar-desktop">

    <script>
    (function(){
      let tabs = [];
      let activeTabId = null;
      let tabIdCounter = 1;
      let tabsOrientation = 'horizontal';
      let tabsVisible = true;
      let mobileDetailOpen = false;
    
      function isMobileLayout(){
        return window.matchMedia('(max-width: 900px)').matches;
      }
    
      const SHEET_MS = 280;
      let activeSheet = null; /* 'detail' | 'source' | null */
      let sheetTimer = null;
    
      function sheetPanelEl(side){
        return side === 'detail' ? document.getElementById('detailCol') : sourcePanel;
      }
    
      function clearSheetTimer(){
        if(sheetTimer){ clearTimeout(sheetTimer); sheetTimer = null; }
      }
    
      /** Gespeicherte Listen-Scrollposition (überlebt Höhenwechsel & Re-Render). */
      let outlineScrollTop = 0;
      let outlineScrollFrozen = false;

      function bindOutlineScroll(){
        if(!outlineList || outlineList._scrollBound) return;
        outlineList._scrollBound = true;
        outlineList.addEventListener('scroll', () => {
          if(!outlineScrollFrozen) outlineScrollTop = outlineList.scrollTop;
        }, {passive: true});
      }

      function restoreOutlineScroll(){
        if(!outlineList) return;
        outlineList.scrollTop = outlineScrollTop;
      }

      /**
       * Mobile: detailCol unter .layout hängen (gleicher Ancestor wie #sourcePanel),
       * damit overflow/Containing-Block identisch sind – sonst öffnet Detail höher.
       * Desktop: zurück nach #splitBody für das Flex-Layout Liste|Editor.
       */
      function ensureDetailParent(){
        const detailCol = document.getElementById('detailCol');
        const split = document.getElementById('splitBody');
        if(!detailCol || !split) return;
        if(isMobileLayout()){
          if(detailCol.parentElement !== layout) layout.appendChild(detailCol);
        } else {
          if(detailCol.parentElement !== split) split.appendChild(detailCol);
        }
      }

      /** Inline-Geometrie an beiden Sheets löschen (Desktop / Reset). */
      function clearSheetInlineGeometry(){
        const detailCol = document.getElementById('detailCol');
        [detailCol, sourcePanel].forEach(el => {
          if(!el) return;
          el.style.position = '';
          el.style.top = '';
          el.style.left = '';
          el.style.right = '';
          el.style.bottom = '';
          el.style.width = '';
          el.style.height = '';
        });
        ['--mobile-sheet-top','--mobile-sheet-left','--mobile-sheet-right',
         '--mobile-sheet-bottom','--mobile-outline-h'].forEach(p => layout.style.removeProperty(p));
      }

      /** Sheet vollständig ruhend (kein Rand-Pixel, kein Hit-Test, kein Paint-Zwang). */
      function putSheetDormant(panel){
        if(!panel) return;
        panel.classList.remove('mobile-open');
        panel.classList.add('sheet-dormant');
        panel.setAttribute('aria-hidden', 'true');
      }

      /** Vor dem Einschieben: sichtbar machen, dann transform animieren. */
      function wakeSheet(panel){
        if(!panel) return;
        panel.classList.remove('sheet-dormant');
        panel.setAttribute('aria-hidden', 'false');
      }

      function putAllSheetsDormant(){
        const detailCol = document.getElementById('detailCol');
        putSheetDormant(detailCol);
        putSheetDormant(sourcePanel);
      }

      /**
       * Misst Split-Bereich und setzt BEIDEN Sheets dieselbe Pixel-Geometrie (inline).
       * Sheet-Oberkante = Unterkante der sichtbaren Strukturliste.
       */
      function updateMobileSheetMetrics(){
        if(!isMobileLayout()){
          clearSheetInlineGeometry();
          return;
        }
        ensureDetailParent();
        const split = document.getElementById('splitBody');
        const detailCol = document.getElementById('detailCol');
        if(!split || !detailCol) return;
        const fraction = window.matchMedia('(max-width: 480px)').matches ? 0.32 : 0.36;
        const layoutRect = layout.getBoundingClientRect();
        const splitRect = split.getBoundingClientRect();
        if(splitRect.height < 40) return;
        const outlineH = Math.max(80, Math.round(splitRect.height * fraction));
        const top = Math.round(splitRect.top + outlineH);
        const left = Math.round(layoutRect.left);
        const width = Math.round(layoutRect.width);
        const height = Math.max(80, Math.round(layoutRect.bottom - top));
        layout.style.setProperty('--mobile-outline-h', outlineH + 'px');
        /* Identische Inline-Styles – kein CSS-Var-Erbe, kein unterschiedlicher CB */
        [detailCol, sourcePanel].forEach(el => {
          if(!el) return;
          el.style.position = 'fixed';
          el.style.top = top + 'px';
          el.style.left = left + 'px';
          el.style.width = width + 'px';
          el.style.height = height + 'px';
          el.style.right = 'auto';
          el.style.bottom = 'auto';
        });
      }

      function applySheetChrome(on){
        bindOutlineScroll();
        if(on){
          if(outlineList && !outlineScrollFrozen) outlineScrollTop = outlineList.scrollTop;
          outlineScrollFrozen = true;
          layout.classList.add('sheet-open');
          updateMobileSheetMetrics();
          restoreOutlineScroll();
          requestAnimationFrame(() => {
            restoreOutlineScroll();
            outlineScrollFrozen = false;
          });
        } else {
          outlineScrollFrozen = true;
          layout.classList.remove('sheet-open');
          restoreOutlineScroll();
          requestAnimationFrame(() => {
            restoreOutlineScroll();
            outlineScrollFrozen = false;
          });
        }
      }
    
      /** Öffnet Detail- oder XML-Sheet (spiegelverkehrt, gemeinsame Logik). */
      function openSheet(side){
        if(!isMobileLayout()) return;
        if(activeSheet === side) return;
        bindOutlineScroll();
        if(outlineList && !outlineScrollFrozen) outlineScrollTop = outlineList.scrollTop;
        if(activeSheet && activeSheet !== side){
          closeSheet(true);
        }
        activeSheet = side;
        mobileDetailOpen = (side === 'detail');
        const panel = sheetPanelEl(side);
        if(side === 'source'){
          sourcePanel.style.display = 'flex';
          setSourceLabels(true);
          updateSourceFromTree();
        }
        clearSheetTimer();
        ensureDetailParent();
        updateMobileSheetMetrics();
        applySheetChrome(false);
        restoreOutlineScroll();
        /* Erst wecken (visibility), dann im nächsten Frame einschieben – GPU-Transform */
        wakeSheet(panel);
        requestAnimationFrame(() => {
          requestAnimationFrame(() => {
            panel.classList.add('mobile-open');
          });
        });
        const done = (e) => {
          if(e && e.target !== panel) return;
          panel.removeEventListener('transitionend', done);
          clearSheetTimer();
          if(activeSheet === side){
            applySheetChrome(true);
            restoreOutlineScroll();
          }
        };
        panel.addEventListener('transitionend', done);
        sheetTimer = setTimeout(() => done(), SHEET_MS + 40);
      }
    
      /**
       * Schließt das Sheet. Zuerst Chrome/Footer unter dem Sheet wiederherstellen
       * (für Nutzer unsichtbar), dann erst hinausschieben.
       */
      function closeSheet(immediate){
        bindOutlineScroll();
        if(outlineList && !outlineScrollFrozen) outlineScrollTop = outlineList.scrollTop;
        if(!activeSheet) {
          putAllSheetsDormant();
          applySheetChrome(false);
          restoreOutlineScroll();
          mobileDetailOpen = false;
          return;
        }
        const side = activeSheet;
        const panel = sheetPanelEl(side);
        activeSheet = null;
        mobileDetailOpen = false;
        clearSheetTimer();
        applySheetChrome(false);
        restoreOutlineScroll();
        if(immediate){
          putSheetDormant(panel);
          if(side === 'source') setSourceLabels(false);
          restoreOutlineScroll();
          return;
        }
        /* 1) Hinausschieben  2) nach Transition vollständig dormant */
        void layout.offsetHeight;
        requestAnimationFrame(() => {
          panel.classList.remove('mobile-open');
          restoreOutlineScroll();
        });
        const done = (e) => {
          if(e && e.target !== panel) return;
          panel.removeEventListener('transitionend', done);
          clearSheetTimer();
          putSheetDormant(panel);
          if(side === 'source') setSourceLabels(false);
          restoreOutlineScroll();
        };
        panel.addEventListener('transitionend', done);
        sheetTimer = setTimeout(() => done(), SHEET_MS + 40);
      }
    
      function openMobileDetail(){ openSheet('detail'); }
      function closeMobileDetail(){ if(activeSheet === 'detail' || mobileDetailOpen) closeSheet(false); }
      function openMobileSource(){ openSheet('source'); }
      function closeMobileSource(){ if(activeSheet === 'source' || sourcePanel.classList.contains('mobile-open')) closeSheet(false); }
    
      function shouldFocusDetail(){
        return !isMobileLayout() || mobileDetailOpen;
      }
    
      function parseHashParams(){
        const raw = (location.hash || '').replace(/^#/, '');
        const params = {};
        raw.split('&').forEach(part => {
          if(!part) return;
          const eq = part.indexOf('=');
          if(eq < 0){
            const k = decodeURIComponent(part.trim());
            if(k) params[k] = '';
            return;
          }
          const k = decodeURIComponent(part.slice(0, eq).trim());
          const v = decodeURIComponent(part.slice(eq + 1).trim());
          if(k) params[k] = v;
        });
        return params;
      }

      function readHashState(){
        const params = parseHashParams();
        if(params.tabBarLocation === 'left') tabsOrientation = 'vertical';
        else if(params.tabBarLocation === 'top') tabsOrientation = 'horizontal';
        if(params.tabBarShown === 'false') tabsVisible = false;
        else if(params.tabBarShown === 'true') tabsVisible = true;
        /* showCharacterCount: Wert aus URL behalten; fehlt er → Default false (erster Aufruf) */
        if(Object.prototype.hasOwnProperty.call(params, 'skipNonErrorNotifications')){
          const v = params.skipNonErrorNotifications;
          skipNonErrorNotifications = (v === 'true' || v === '1');
        } else {
          skipNonErrorNotifications = false; // Default: dauerhaft anzeigen
        }
        if(Object.prototype.hasOwnProperty.call(params, 'xmlCodeLineWrap')){
          const v = params.xmlCodeLineWrap;
          xmlCodeLineWrap = (v === 'true' || v === '1');
        } else {
          xmlCodeLineWrap = true;
        }
      }
    
      function writeHashState(){
        const parts = [];
        parts.push('tabBarLocation=' + (tabsOrientation === 'vertical' ? 'left' : 'top'));
        parts.push('tabBarShown=' + (tabsVisible ? 'true' : 'false'));
        parts.push('showCharacterCount=' + (showCharacterCount ? 'true' : 'false'));
        parts.push('skipNonErrorNotifications=' + (skipNonErrorNotifications ? 'true' : 'false'));
        parts.push('xmlCodeLineWrap=' + (xmlCodeLineWrap ? 'true' : 'false'));
        const next = '#' + parts.join('&');
        if(location.hash !== next){
          history.replaceState(null, '', next);
        }
      }
    
      let tree = [], idCounter = 1, sourceFocused = false, selectedId = null, focusDetailField = false;
      let showCharacterCount = false;
      let skipNonErrorNotifications = false;
      let bannerHideTimer = null;
      let xmlCodeLineWrap = true;
      let wikiSettings = {lang:'de', chars:1200}, openWikiMenu = null, openTemplateMenu = null, openOptionsMenu = null;
    
      let dragId = null;
      let dragOverId = null;
      let dragOverPos = null;
      let longPressTimer = null;
      let touchStartY = 0;
      let isTouchDragging = false;
    
      const outlineList = document.getElementById('outlineList');
      const detailScroll = document.getElementById('detailScroll');
      const sourceText = document.getElementById('sourceText');
      const sourcePanel = document.getElementById('sourcePanel');
      const layout = document.getElementById('layout');
      const validationBanner = document.getElementById('validationBanner');
      const tabsShell = document.getElementById('tabsShell');
      const tabList = document.getElementById('tabList');
      const panelStructureTitle = document.getElementById('panelStructureTitle');
      const LANG_CODES = ['de','en','fr','es','it','pt','nl','pl','ru','ja','zh'];
    
      function uid(){ return 'n'+(idCounter++); }
      function newNode(tag,text){ return {id:uid(), kind:'element', tag:tag||'', text:text||'', children:[], collapsed:false}; }
      function newCommentNode(text){ return {id:uid(), kind:'comment', text:text||''}; }
    
      function createTabState(title, treeData){
        const t = {
          id: 'tab'+(tabIdCounter++),
          title: title || ('Prompt '+tabIdCounter),
          tree: treeData || [],
          selectedId: null,
          idCounter: 1,
          sourceFocused: false,
          focusDetailField: false
        };
        if(treeData && treeData.length){
          let max = 0;
          (function walk(nodes){
            nodes.forEach(n=>{
              const m = /^n(\d+)$/.exec(n.id||'');
              if(m) max = Math.max(max, parseInt(m[1],10));
              if(n.children) walk(n.children);
            });
          })(treeData);
          t.idCounter = max + 1;
          t.selectedId = firstNavigableId(treeData);
        }
        return t;
      }
    
      function saveActiveTab(){
        if(!activeTabId) return;
        const t = tabs.find(x => x.id === activeTabId);
        if(!t) return;
        t.tree = tree;
        t.selectedId = selectedId;
        t.idCounter = idCounter;
        t.sourceFocused = sourceFocused;
        t.focusDetailField = focusDetailField;
      }
    
      function loadTab(tabId){
        saveActiveTab();
        const t = tabs.find(x => x.id === tabId);
        if(!t) return;
        activeTabId = tabId;
        tree = t.tree;
        selectedId = t.selectedId;
        idCounter = t.idCounter;
        sourceFocused = false;
        focusDetailField = false;
        closeSheet(true);
        hideBanner();
        renderTabs();
        render();
      }
    
      function addNewTab(title, treeData){
        saveActiveTab();
        const t = createTabState(title, treeData);
        tabs.push(t);
        activeTabId = t.id;
        tree = t.tree;
        selectedId = t.selectedId;
        idCounter = t.idCounter;
        sourceFocused = false;
        focusDetailField = false;
        closeSheet(true);
        hideBanner();
        renderTabs();
        render();
      }
    
      function closeTab(tabId, evt){
        if(evt) evt.stopPropagation();
        if(tabs.length <= 1){
          if(confirm('Letzten Tab zurücksetzen?')){
            const t = tabs[0];
            t.tree = [];
            t.selectedId = null;
            t.idCounter = 1;
            t.title = 'Prompt 1';
            loadTab(t.id);
          }
          return;
        }
        const idx = tabs.findIndex(x => x.id === tabId);
        if(idx < 0) return;
        const wasActive = activeTabId === tabId;
        tabs.splice(idx, 1);
        if(wasActive){
          const next = tabs[Math.min(idx, tabs.length-1)];
          activeTabId = null;
          loadTab(next.id);
        } else {
          renderTabs();
        }
      }
    
      /** Panel-Titel an aktiven Tab anbinden (wie detail-tag-input). */
      function updatePanelStructureTitle(){
        if(!panelStructureTitle) return;
        const t = tabs.find(x => x.id === activeTabId);
        const name = t ? t.title : 'Prompt 1';
        if(document.activeElement !== panelStructureTitle){
          panelStructureTitle.value = name;
        }
      }
    
      /** Live: Tab-Titel aus Panel-Input – Tabs-Leiste mitziehen. */
      function applyPanelTitleToTab(){
        const t = tabs.find(x => x.id === activeTabId);
        if(!t) return;
        const name = (panelStructureTitle.value || '').trim() || 'Prompt';
        if(t.title === name) return;
        t.title = name;
        const label = tabList.querySelector('.tab-item.active .tab-title');
        if(label) label.textContent = name;
      }
    
      function renderTabs(){
        tabList.innerHTML = '';
        tabs.forEach(t => {
          const btn = document.createElement('button');
          btn.type = 'button';
          btn.className = 'tab-item' + (t.id === activeTabId ? ' active' : '');
          btn.setAttribute('role', 'tab');
          btn.setAttribute('aria-selected', t.id === activeTabId ? 'true' : 'false');
          btn.onclick = () => { if(t.id !== activeTabId) loadTab(t.id); };
    
          const title = document.createElement('span');
          title.className = 'tab-title';
          title.textContent = t.title;
          btn.appendChild(title);
    
          const close = document.createElement('button');
          close.type = 'button';
          close.className = 'tab-close';
          close.title = 'Tab schließen';
          close.setAttribute('aria-label', 'Tab schließen');
          close.textContent = '×';
          close.onclick = e => closeTab(t.id, e);
          btn.appendChild(close);
    
          tabList.appendChild(btn);
        });
    
        const addBtn = document.createElement('button');
        addBtn.type = 'button';
        addBtn.className = 'tab-new';
        addBtn.title = 'Neuer Tab';
        addBtn.setAttribute('aria-label', 'Neuer Tab');
        addBtn.textContent = '+';
        addBtn.onclick = e => {
          e.stopPropagation();
          addNewTab('Prompt '+(tabs.length+1), []);
        };
        tabList.appendChild(addBtn);
    
        tabsShell.classList.remove('tabs-horizontal','tabs-vertical','tabs-hidden');
        if(!tabsVisible){
          tabsShell.classList.add('tabs-hidden');
          tabsShell.classList.add(tabsOrientation === 'vertical' ? 'tabs-vertical' : 'tabs-horizontal');
        } else {
          tabsShell.classList.add(tabsOrientation === 'vertical' ? 'tabs-vertical' : 'tabs-horizontal');
        }
        writeHashState();
        updatePanelStructureTitle();
      }
    
      /* Panel-Titel: gleiche Mechanik wie detail-tag-input (oninput live, Enter blur) */
      panelStructureTitle.oninput = () => {
        applyPanelTitleToTab();
      };
      panelStructureTitle.onkeydown = e => {
        if(e.key === 'Enter'){
          e.preventDefault();
          panelStructureTitle.blur();
        }
      };
      panelStructureTitle.onblur = () => {
        const name = (panelStructureTitle.value || '').trim() || 'Prompt';
        panelStructureTitle.value = name;
        applyPanelTitleToTab();
      };
    
      async function fetchWikiText(lang,chars){
        const limit = Math.max(80, Math.min(2000, chars||450));
        let useLang = lang==='random' ? LANG_CODES[Math.floor(Math.random()*LANG_CODES.length)] : lang;
        const url = `https://${useLang}.wikipedia.org/w/api.php?action=query&generator=random&grnnamespace=0&prop=extracts|info&inprop=url&exintro&explaintext&exchars=${limit}&format=json&origin=*`;
        const res = await fetch(url); if(!res.ok) throw new Error('Netzwerkfehler');
        const data = await res.json(); const pages = data.query?.pages;
        if(!pages) throw new Error('Keine Seite');
        const page = Object.values(pages)[0];
        let extract = (page.extract||'').trim().replace(/\s+/g,' ');
        if(extract.endsWith('...')) extract = extract.slice(0,-3).trim();
        if(!extract || extract.length < 30) throw new Error('Text zu kurz');
        return extract;
      }
    
      function closeAllWikiMenus(){
        document.querySelectorAll('.wiki-menu.open').forEach(m => {
          m.classList.remove('open');
          m.style.left = '';
          m.style.top = '';
        });
        openWikiMenu = null;
      }
    
      function closeTemplateMenu(){
        const menu = document.getElementById('templateMenu');
        if(menu){
          menu.classList.remove('open');
          menu.style.left = '';
          menu.style.top = '';
        }
        openTemplateMenu = null;
      }
    
      function closeOptionsMenu(){
        const menu = document.getElementById('optionsMenu');
        const btn = document.getElementById('btnOptions');
        if(menu){
          menu.classList.remove('open');
          menu.style.left = '';
          menu.style.top = '';
        }
        if(btn) btn.setAttribute('aria-expanded', 'false');
        openOptionsMenu = null;
      }
    
      document.addEventListener('click', e => {
        if(openWikiMenu && !e.target.closest('.wiki-wrap')) closeAllWikiMenus();
        if(openTemplateMenu && !e.target.closest('.template-wrap')) closeTemplateMenu();
        if(openOptionsMenu && !e.target.closest('.options-wrap')) closeOptionsMenu();
      });
    
      function createWikiSplitButton(textarea){
        const wrap = document.createElement('div'); wrap.className = 'wiki-wrap';
        const split = document.createElement('div'); split.className = 'split-btn';
        const mainBtn = document.createElement('button'); mainBtn.type = 'button'; mainBtn.className = 'split-main'; mainBtn.innerHTML = '+ WikiText';
        const sep = document.createElement('div'); sep.className = 'split-sep';
        const caretBtn = document.createElement('button'); caretBtn.type = 'button'; caretBtn.className = 'split-caret';
        caretBtn.setAttribute('aria-label', 'Wiki-Einstellungen');
        caretBtn.innerHTML = '<svg viewBox="0 0 12 12" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 4.5L6 7.5L9 4.5"/></svg>';
        const menu = document.createElement('div'); menu.className = 'wiki-menu';
        menu.innerHTML = `<label>Sprache</label><select class="wiki-lang">

      const strayAmpRe = /&(?!(?:amp|lt|gt|quot|apos|#\d+|#x[0-9a-fA-F]+);)/g;
      function replaceStrayAmpersands(str,rep){ return (str||'').replace(strayAmpRe, rep); }
      function cleanParserErrorText(raw){
        let s = (raw || '').replace(/\s+/g, ' ').trim();

        s = s.replace(/\bAdresse:\s*\S+/gi, '');
        s = s.replace(/\bLocation:\s*\S+/gi, '');
        s = s.replace(/file:\/\/\/\S+/gi, '');
        s = s.replace(/https?:\/\/\S+/gi, '');
        s = s.replace(/This page contains the following errors:\s*/i, '');
        s = s.replace(/Below is a rendering of the page up to the first error\.?/gi, '');

        // Firefox-Sourcetext / Caret-Zeilen entfernen
        s = s.replace(/----+\^/g, '');
        s = s.replace(/:\s*<\/[^>]+>\s*$/g, ''); // trailing ": </tag>" vom Sourcetext

        return s.replace(/\s+/g, ' ').trim();
      }

      function extractXmlParserLocation(parserErrorEl){
        const raw = parserErrorEl ? (parserErrorEl.textContent || '') : '';

        const patterns = [
          /error on line\s+(\d+)\s+at column\s+(\d+)/i,
          /Line Number\s*(\d+)\s*,?\s*Column\s*(\d+)/i,
          /Zeile\s*Nr\.?\s*(\d+)\s*,\s*Spalte\s*(\d+)/i,
          /line(?:\s*number)?\s*(\d+)\s*,\s*column\s*(\d+)/i,
          /Zeile\s*(\d+)\s*,\s*Spalte\s*(\d+)/i
        ];
        let line = null, col = null;
        for(const re of patterns){
          const m = re.exec(raw);
          if(m){ line = parseInt(m[1],10); col = m[2] ? parseInt(m[2],10) : null; break; }
        }

        // Nur die eigentliche Fehlermeldung extrahieren, kein Sourcetext/Caret
        let message;
        const chromeMatch = /error on line\s+\d+\s+at column\s+\d+\s*:?\s*([^\n]*)/i.exec(raw);
        if(chromeMatch && chromeMatch[1]){
          message = chromeMatch[1];
        } else {
          // Firefox: alles vor "Location:" ist die Meldung
          message = raw.split(/Location:/i)[0].replace(/^XML Parsing Error:\s*/i, '');
        }

        message = message.split(/\n/)[0];              // nur erste Zeile
        message = message.replace(/[-]{2,}\^.*$/, '');  // Reste von Caret-Zeilen kappen
        message = message.trim();

        return { line, col, detail: message };
      }

      function parseXMLString(str){
        const raw = str || '';
        // Führende Newlines im Textarea, die trim() schluckt
        const leading = raw.match(/^\s*/)?.[0] || '';
        const leadingNL = (leading.match(/\n/g) || []).length;
        const t = raw.trim();
        if(!t) return { tree: [], errors: [], migrated: 0 };

        // Prefix in derselben Zeile → Zeilen 2…N stimmen 1:1, kein künstliches \n
        const prefix = '<__root__>';
        const wrapped = prefix + replaceStrayAmpersands(t, '&amp;') + '</__root__>';
        const doc = new DOMParser().parseFromString(wrapped, 'text/xml');
        const pe = doc.querySelector('parsererror');

        if(pe){
          const loc = extractXmlParserLocation(pe);
          let line = loc.line;
          let col = loc.col;

          if(line != null){
            line = Math.max(1, line - 1 + leadingNL);
            if(line - leadingNL === 1 && col != null){
              col = Math.max(1, col - prefix.length);
            }
          }

          const detail = cleanParserErrorText(loc.detail);

          let message;
          if(line != null){
            message = 'XML ungültig – Zeile ' + line +
              (col != null ? ', Spalte ' + col : '') +
              (detail ? ': ' + detail : '');
          } else if(detail){
            message = 'XML ungültig: ' + detail;
          } else {
            message = 'XML ungültig.';
          }

          return { tree: null, errors: [message], migrated: 0 };
        }

        let migrated = 0;
        const result = domChildNodesToNodes(doc.documentElement, (n) => { migrated += n; });
        if(!result.length && doc.documentElement.textContent.trim()){
          result.push(newNode('text', doc.documentElement.textContent.trim()));
        }
        return { tree: result, errors: [], migrated };
      }

      function domChildNodesToNodes(el, onMigrate){
        const out = [];
        for(const c of Array.from(el.childNodes)){
          if(c.nodeType === 1) out.push(domElementToNode(c, onMigrate));
          else if(c.nodeType === 8){
            const t = (c.data||'').trim();
            if(t) out.push(newCommentNode(t));
          }
        }
        return out;
      }

      function domElementToNode(el, onMigrate){
        const node = newNode(el.tagName, '');
        const ordered = [];
        let textChunks = [];
        let hasElements = false;
        let hasNonEmptyText = false;

        for(const c of Array.from(el.childNodes)){
          if(c.nodeType === 1){
            hasElements = true;
            ordered.push({type:'el', el:c});
          } else if(c.nodeType === 3){
            const raw = c.textContent || '';
            if(raw.trim()){
              hasNonEmptyText = true;
              ordered.push({type:'text', text: raw});
              textChunks.push(raw);
            }
          } else if(c.nodeType === 8){
            const t = (c.data||'').trim();
            if(t) ordered.push({type:'comment', text:t});
          }
        }

        if(hasNonEmptyText && hasElements){
          const kids = [];
          const parentTag = (el.tagName || 'element').trim();
          const leafTag = parentTag ? (parentTag + '_text') : 'content';
          for(const item of ordered){
            if(item.type === 'text'){
              const trimmed = item.text.trim();
              if(trimmed){
                kids.push(newNode(leafTag, trimmed));
                if(typeof onMigrate === 'function') onMigrate(1);
              }
            } else if(item.type === 'el'){
              kids.push(domElementToNode(item.el, onMigrate));
            } else if(item.type === 'comment'){
              kids.push(newCommentNode(item.text));
            }
          }
          node.text = '';
          node.children = kids;
        } else if(hasElements){
          node.text = '';
          node.children = ordered
            .filter(i => i.type === 'el' || i.type === 'comment')
            .map(i => i.type === 'el' ? domElementToNode(i.el, onMigrate) : newCommentNode(i.text));
        } else {
          // Nur Text
          node.text = textChunks.join('').trim();
          node.children = [];
        }
        return node;
      }
      function escapeXML(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
      function serializeTree(nodes, depth){
        depth = depth||0; const pad = '  '.repeat(depth); let out = '';
        for(const node of nodes){
          if(node.kind === 'comment'){ const s = (node.text||'').trim().replace(/--/g,'- -'); if(s) out += pad+'<!-- '+s+' -->\n'; continue; }
          const tag = (node.tag && node.tag.trim()) || 'element';
          const hasCh = node.children && node.children.length; const text = (node.text||'').trim();
          if(hasCh){
            out += pad+'<'+tag+'>\n';
            if(text) out += (text.includes('\n') ? text.split('\n').map(l => pad+'  '+escapeXML(l)).join('\n') : pad+'  '+escapeXML(text))+'\n';
            out += serializeTree(node.children, depth+1)+pad+'</'+tag+'>\n';
          } else {
            if(text.includes('\n')) out += pad+'<'+tag+'>\n'+text.split('\n').map(l => pad+'  '+escapeXML(l)).join('\n')+'\n'+pad+'</'+tag+'>\n';
            else out += pad+'<'+tag+'>'+escapeXML(text)+'</'+tag+'>\n';
          }
        }
        return out;
      }
      function serializeFull(){ return '<prompt>\n'+serializeTree(tree,1)+'</prompt>'; }

      /** Serialisiert und liefert Map nodeId → Start-Zeile (1-basiert, relativ zum gesamten serializeFull-Output). */
      function serializeTreeWithLines(nodes, depth, state){
        depth = depth || 0;
        state = state || {lines: [''], map: {}};
        const pad = '  '.repeat(depth);
        for(const node of nodes){
          if(node.kind === 'comment'){
            const s = (node.text||'').trim().replace(/--/g,'- -');
            if(s){
              state.map[node.id] = state.lines.length;
              state.lines.push(pad + '<!-- ' + s + ' -->');
            }
            continue;
          }
          const tag = (node.tag && node.tag.trim()) || 'element';
          const hasCh = node.children && node.children.length;
          const text = (node.text||'').trim();
          state.map[node.id] = state.lines.length;
          if(hasCh){
            state.lines.push(pad + '<' + tag + '>');
            if(text){
              if(text.includes('\n')){
                text.split('\n').forEach(l => state.lines.push(pad + '  ' + escapeXML(l)));
              } else {
                state.lines.push(pad + '  ' + escapeXML(text));
              }
            }
            serializeTreeWithLines(node.children, depth + 1, state);
            state.lines.push(pad + '</' + tag + '>');
          } else {
            if(text.includes('\n')){
              state.lines.push(pad + '<' + tag + '>');
              text.split('\n').forEach(l => state.lines.push(pad + '  ' + escapeXML(l)));
              state.lines.push(pad + '</' + tag + '>');
            } else {
              state.lines.push(pad + '<' + tag + '>' + escapeXML(text) + '</' + tag + '>');
            }
          }
        }
        return state;
      }

      function getLineMap(){
        const state = {lines: ['<prompt>'], map: {}};
        serializeTreeWithLines(tree, 1, state);
        state.lines.push('</prompt>');
        return state;
      }

      /**
       * Nur Felder mit Klasse .char-count-field und nur wenn showCharacterCount=true.
       * Auswahl-Länge wenn Markierung möglich (textarea/input).
       */
      function attachCharCount(field){
        if(!showCharacterCount) return;
        if(!field || field.nodeType !== 1) return;
        if(!field.classList.contains('char-count-field')) return;
        const tag = field.tagName;
        if(tag !== 'TEXTAREA' && !(tag === 'INPUT' && /^(text|search|url|tel|password|email)$/i.test(field.type || 'text'))) return;
        if(field.dataset.charCountBound === '1'){
          updateCharCountMeter(field);
          return;
        }
        field.dataset.charCountBound = '1';
        let meter = field._charMeter;
        if(!meter || !meter.isConnected){
          meter = document.createElement('div');
          meter.className = 'char-count';
          meter.setAttribute('aria-live', 'polite');
          meter.hidden = !showCharacterCount;
          const parent = field.parentElement;
          if(parent && parent.classList.contains('detail-textarea-wrap')){
            parent.appendChild(meter);
          } else {
            field.insertAdjacentElement('afterend', meter);
          }
          field._charMeter = meter;
        }
        const update = () => updateCharCountMeter(field);
        field.addEventListener('input', update);
        field.addEventListener('select', update);
        field.addEventListener('keyup', update);
        field.addEventListener('mouseup', update);
        field.addEventListener('focus', update);
        field.addEventListener('blur', update);
        update();
      }

      function updateCharCountMeter(field){
        const meter = field._charMeter;
        if(!meter) return;
        if(!showCharacterCount){
          meter.hidden = true;

        meter.hidden = false;
        const len = (field.value || '').length;
        const sel = selectionLength(field);
        if(sel > 0){
